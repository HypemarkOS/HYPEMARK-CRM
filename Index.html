<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clients | HYPEMARK CRM</title>
  <style>
    :root{--ink:#172033;--muted:#748094;--line:#e7ebf1;--surface:#fff;--soft:#f5f7fa;--brand:#6d4aff;--green:#16a673;--orange:#e48a18;--red:#d84b5b}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--soft);color:var(--ink)}button,input,textarea{font:inherit}.app{display:flex;min-height:100vh}.side{width:240px;background:#111827;color:#fff;padding:22px 15px;display:flex;flex-direction:column;flex-shrink:0}.logo{font-size:21px;font-weight:800;padding:8px 10px 28px}.logo span{color:#9b86ff}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aeb8c8;text-align:left;padding:12px 13px;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:#202a3b;color:#fff}.foot{margin-top:auto;color:#68758a;font-size:11px;padding:12px}.main{flex:1;min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.crumb{font-size:12px;color:var(--muted)}.title{font-size:21px;font-weight:750;margin-top:3px}.user{background:#f6f8fb;border:1px solid var(--line);padding:9px 13px;border-radius:20px;font-size:12px;color:var(--muted)}.content{padding:30px 32px 45px;max-width:1500px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.hero h1{margin:0;font-size:30px;letter-spacing:-.7px}.hero p{margin:7px 0 0;color:var(--muted);font-size:13px}.primary{border:0;background:var(--brand);color:#fff;padding:11px 17px;border-radius:9px;font-weight:700;cursor:pointer;box-shadow:0 8px 18px rgba(109,74,255,.2)}.toolbar{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;display:flex;gap:10px;align-items:center;margin-bottom:16px}.search{flex:1;min-width:180px;padding:11px 13px;border:1px solid #dfe4eb;border-radius:9px;outline:none}.search:focus{border-color:#9b86ff;box-shadow:0 0 0 3px rgba(109,74,255,.08)}.filter{padding:11px 12px;border:1px solid #dfe4eb;border-radius:9px;background:#fff;color:var(--ink)}.count{font-size:12px;color:var(--muted);white-space:nowrap}.card{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 5px 18px rgba(24,32,42,.035);overflow:hidden}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-size:10px;color:#8a94a4;text-transform:uppercase;letter-spacing:.4px;padding:13px 16px;border-bottom:1px solid var(--line);background:#fbfcfe}.table td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}.table tbody tr{cursor:pointer}.table tbody tr:hover{background:#fafbff}.name{font-weight:750}.business{color:var(--muted);font-size:11px;margin-top:3px}.status{display:inline-flex;padding:5px 9px;border-radius:16px;font-size:10px;font-weight:700}.status.active{background:#eaf8f2;color:#13815d}.status.inactive{background:#fff0f2;color:#c43c4d}.muted{color:var(--muted)}.empty,.loading{padding:55px;text-align:center;color:var(--muted);font-size:12px}.error{color:var(--red)}
    .modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.48);display:none;align-items:center;justify-content:center;padding:25px;z-index:20}.modal-bg.show{display:flex}.modal{width:min(900px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 25px 70px rgba(0,0,0,.2)}.modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;font-size:20px}.close{border:0;background:#f1f3f6;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:20px}.modal-body{padding:22px 24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700}.field input,.field textarea{padding:11px 12px;border:1px solid #d8dee8;border-radius:8px;outline:none}.field textarea{min-height:85px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#9b86ff;box-shadow:0 0 0 3px rgba(109,74,255,.08)}.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.secondary{border:0;background:#eef0f4;padding:11px 16px;border-radius:9px;font-weight:700;cursor:pointer}.save{border:0;background:var(--brand);color:#fff;padding:11px 18px;border-radius:9px;font-weight:700;cursor:pointer}.save:disabled{opacity:.6;cursor:not-allowed}.toast{position:fixed;right:25px;bottom:25px;background:#172033;color:#fff;padding:12px 16px;border-radius:9px;font-size:12px;display:none;z-index:30}.toast.show{display:block}.toast.ok{background:#13815d}.toast.err{background:#c43c4d}
    @media(max-width:850px){.side{width:70px}.logo{font-size:0}.logo span{font-size:18px}.nav button{font-size:0;text-align:center}.top{padding:0 16px}.content{padding:22px 16px}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.table{min-width:760px}.card{overflow:auto}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="logo">HYPE<span>MARK</span></div><nav class="nav">
    <button onclick="go('dashboard')">▦ &nbsp; Dashboard</button><button class="active">◉ &nbsp; Clients</button><button>▣ &nbsp; Projects</button><button>✓ &nbsp; Deliverables</button><button onclick="go('payments')">₹ &nbsp; Payments</button><button>◌ &nbsp; Activities</button>
  </nav><div class="foot">HYPEMARK CRM v1.0</div></aside>
  <main class="main"><header class="top"><div><div class="crumb">Workspace / Clients</div><div class="title">HYPEMARK CRM</div></div><div class="user">Internal Workspace</div></header>
    <section class="content">
      <div class="hero"><div><h1>Clients</h1><p>Manage every client relationship from one clean workspace.</p></div><button class="primary" onclick="openAdd()">＋ Add Client</button></div>
      <div class="toolbar"><input id="search" class="search" placeholder="Search client, business, contact, mobile or email..." oninput="render()"><select id="status" class="filter" onchange="render()"><option value="">All statuses</option><option value="Active">Active</option><option value="Inactive">Inactive</option></select><div id="count" class="count">Loading...</div></div>
      <div class="card"><div id="table" class="loading">Loading clients...</div></div>
    </section>
  </main>
</div>
<div id="modalBg" class="modal-bg"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Add New Client</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><form id="clientForm" onsubmit="saveClient(event)"><input type="hidden" id="clientId"><div class="form-grid"><div class="field"><label>Client Name *</label><input id="clientName" required></div><div class="field"><label>Business Name *</label><input id="businessName" required></div><div class="field"><label>Contact Person</label><input id="contactPerson"></div><div class="field"><label>Mobile</label><input id="mobile" inputmode="tel"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>GST</label><input id="gst"></div><div class="field full"><label>Address</label><textarea id="address"></textarea></div></div></form></div><div class="modal-foot"><button class="secondary" onclick="closeModal()">Cancel</button><button id="saveBtn" class="save" onclick="document.getElementById('clientForm').requestSubmit()">Save Client</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
var clients=[];
function esc(v){return String(v==null?'':v).replace(/[&<>\'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
function go(page){var base=location.href.split('?')[0];location.href=base+'?page='+encodeURIComponent(page)}
function load(){google.script.run.withSuccessHandler(function(d){clients=d||[];render()}).withFailureHandler(function(e){document.getElementById('table').innerHTML='<div class="empty error">Could not load clients: '+esc(e.message||e)+'</div>'}).getClients()}
function render(){var q=(document.getElementById('search').value||'').toLowerCase().trim(),s=document.getElementById('status').value;var list=clients.filter(function(c){var text=[c['Client Name'],c['Business Name'],c['Contact Person'],c['Mobile'],c['Email'],c['GST']].join(' ').toLowerCase();return (!q||text.indexOf(q)>-1)&&(!s||String(c.Status||'')===s)});document.getElementById('count').textContent=list.length+' client'+(list.length===1?'':'s');if(!list.length){document.getElementById('table').innerHTML='<div class="empty">No clients found. Try another search or add a new client.</div>';return}document.getElementById('table').innerHTML='<table class="table"><thead><tr><th>Client</th><th>Contact</th><th>Mobile</th><th>Email</th><th>Status</th><th>Created</th></tr></thead><tbody>'+list.map(function(c){var active=String(c.Status||'')==='Active';return '<tr onclick="openEdit(\''+esc(c['Client ID']).replace(/'/g,"\\'")+'\')"><td><div class="name">'+esc(c['Client Name'])+'</div><div class="business">'+esc(c['Business Name'])+'</div></td><td>'+esc(c['Contact Person']||'-')+'</td><td>'+esc(c['Mobile']||'-')+'</td><td>'+esc(c['Email']||'-')+'</td><td><span class="status '+(active?'active':'inactive')+'">'+esc(c.Status||'-')+'</span></td><td class="muted">'+esc(c['Created On']||'-')+'</td></tr>'}).join('')+'</tbody></table>'}
function openAdd(){document.getElementById('clientForm').reset();document.getElementById('clientId').value='';document.getElementById('modalTitle').textContent='Add New Client';document.getElementById('saveBtn').textContent='Save Client';document.getElementById('modalBg').classList.add('show')}
function openEdit(id){var c=clients.find(function(x){return String(x['Client ID'])===String(id)});if(!c)return;document.getElementById('clientId').value=c['Client ID'];document.getElementById('clientName').value=c['Client Name']||'';document.getElementById('businessName').value=c['Business Name']||'';document.getElementById('contactPerson').value=c['Contact Person']||'';document.getElementById('mobile').value=c.Mobile||'';document.getElementById('email').value=c.Email||'';document.getElementById('gst').value=c.GST||'';document.getElementById('address').value=c.Address||'';document.getElementById('modalTitle').textContent='Edit Client';document.getElementById('saveBtn').textContent='Save Changes';document.getElementById('modalBg').classList.add('show')}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}
function saveClient(e){e.preventDefault();var btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='Saving...';var data={clientName:document.getElementById('clientName').value,businessName:document.getElementById('businessName').value,contactPerson:document.getElementById('contactPerson').value,mobile:document.getElementById('mobile').value,email:document.getElementById('email').value,gst:document.getElementById('gst').value,address:document.getElementById('address').value};var id=document.getElementById('clientId').value;var runner=google.script.run.withSuccessHandler(function(saved){var i=clients.findIndex(function(x){return String(x['Client ID'])===String(saved['Client ID'])});if(i>-1)clients[i]=saved;else clients.push(saved);closeModal();render();toast(id?'Client updated successfully.':'Client created successfully.','ok');btn.disabled=false;btn.textContent=id?'Save Changes':'Save Client'}).withFailureHandler(function(err){toast(err.message||String(err),'err');btn.disabled=false;btn.textContent=id?'Save Changes':'Save Client'});if(id)runner.updateClient(id,data);else runner.createClient(data)}
function toast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+(type||'');setTimeout(function(){t.className='toast'},2600)}
document.getElementById('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()});load();
</script>
</body>
</html>
