<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | HYPEMARK CRM</title>
  <style>
    :root{--ink:#172033;--muted:#748094;--line:#e6eaf0;--soft:#f5f7fb;--brand:#6d4aff;--red:#d84b5b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f5f7fb,#eef0f7);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink)}
    .card{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 24px 70px rgba(24,32,42,.10);text-align:center}.logo{font-size:25px;font-weight:900;letter-spacing:-.6px}.logo span{color:var(--brand)}h1{font-size:22px;margin:28px 0 8px}.sub{color:var(--muted);font-size:12px;line-height:1.6}.identity{margin-top:22px;padding:14px;border-radius:10px;background:var(--soft);font-size:11px;color:var(--muted)}.error{margin-top:18px;padding:12px;border-radius:9px;background:#fff0f2;color:#b83d4d;font-size:11px;line-height:1.5}.note{margin-top:18px;color:#8a94a4;font-size:10px;line-height:1.6}button{margin-top:22px;border:0;background:var(--brand);color:#fff;padding:12px 20px;border-radius:9px;font-weight:800;cursor:pointer}button:hover{background:#5840d8}.secondary{background:#eef1f7;color:#39445a;margin-left:8px}.secondary:hover{background:#e1e6ef}.hidden{display:none}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">HYPE<span>MARK</span> CRM</div>
    <h1>Sign in to your workspace</h1>
    <div class="sub">Use your authorised Google account. Your CRM role controls exactly what you can see and do.</div>
    <div id="state" class="identity">Checking your Google account...</div>
    <div id="error" class="error hidden"></div>
    <div id="actions"><button id="retry" class="hidden" onclick="location.reload()">Check again</button><button id="recover" class="secondary hidden" onclick="recoverAdmin()">Restore Admin access</button></div>
    <div class="note">No CRM password is stored here. Access is controlled by your Google account and the Users sheet.</div>
  </div>
<script>
function recoverAdmin(){
  var b=document.getElementById('recover');b.disabled=true;b.textContent='Restoring...';
  google.script.run.withSuccessHandler(function(){
    b.textContent='Access restored';
    setTimeout(check,500);
  }).withFailureHandler(function(err){
    b.disabled=false;b.textContent='Restore Admin access';
    var e=document.getElementById('error');e.textContent=err&&err.message?err.message:String(err);e.classList.remove('hidden');
  }).recoverPrimaryAdminAccess();
}
function check(){google.script.run.withSuccessHandler(function(c){
  var s=document.getElementById('state'),e=document.getElementById('error'),b=document.getElementById('retry'),r=document.getElementById('recover');
  r.classList.add('hidden');
  if(c&&c.authenticated){s.textContent='Signed in as '+(c.name||c.email);s.style.color='#13815d';setTimeout(function(){location.reload()},250);return;}
  b.classList.remove('hidden');
  if(!c||c.reason==='identity_unavailable') e.textContent='Google could not provide your account identity to this web app. The deployment must require Google sign-in (for example, your Google Workspace organisation) for role-based access to work.';
  else if(c.reason==='not_registered') e.textContent='This Google account is not registered in HYPEMARK CRM. An Admin must add your email in Settings → Users before you can enter.';
  else if(c.reason==='inactive'){e.textContent='Your CRM account is inactive. If this is the primary Admin account, you can restore its existing Admin access below.';if(String(c.email||'').toLowerCase()==='namani.ajay@gmail.com')r.classList.remove('hidden');}
  else e.textContent='Access denied.';
  e.classList.remove('hidden');s.textContent=c&&c.email?'Google account: '+c.email:'Google account not detected';
}).withFailureHandler(function(err){document.getElementById('state').textContent='Unable to verify your account';var e=document.getElementById('error');e.textContent=err.message||String(err);e.classList.remove('hidden');document.getElementById('retry').classList.remove('hidden')}).getAuthContext()}
check();
</script>
</body>
</html>
