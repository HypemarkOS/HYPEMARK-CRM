<script>
(function(){
  function escPB(v){return String(v==null?'':v).replace(/[&<>\'\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]})}
  function moneyPB(v){return '₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
  function loadBalances(){
    var content=document.getElementById('content');
    if(!content || !document.querySelector('.tabs') || !document.getElementById('paymentList')) return;
    var existing=document.getElementById('receiptBalancesPanel');
    if(!existing){
      existing=document.createElement('div');
      existing.id='receiptBalancesPanel';
      existing.className='card panel';
      existing.style.marginTop='15px';
      var form=document.getElementById('paymentForm');
      if(form && form.parentNode) form.parentNode.insertBefore(existing,form.nextSibling);
    }
    existing.innerHTML='<div class="loading">Calculating receipt balances...</div>';
    google.script.run.withSuccessHandler(renderBalances).withFailureHandler(function(e){
      existing.innerHTML='<div class="notice err">Unable to load receipt balances: '+escPB(e&&e.message||e)+'</div>';
    }).getPayments();
  }
  function renderBalances(rows){
    var box=document.getElementById('receiptBalancesPanel');
    if(!box) return;
    rows=rows||[];
    var receipts=rows.filter(function(r){return r.Type==='Client Receipt';});
    var allocations={};
    rows.forEach(function(r){
      var rid=String(r['Receipt ID']||'').trim();
      if(!rid || r.Type==='Client Receipt') return;
      allocations[rid]=(allocations[rid]||0)+Number(r.Amount||0);
    });
    var names={};
    if(window.state&&state.clients) state.clients.forEach(function(c){names[String(c['Client ID'])]=c['Client Name']||c['Business Name']||c['Client ID'];});
    var data=receipts.map(function(r){
      var id=String(r['Receipt ID']||'');
      var received=Number(r.Amount||0);
      var allocated=allocations[id]||0;
      var remaining=Math.max(0,received-allocated);
      return {id:id,client:names[String(r['Client ID'])]||r['Client ID']||'-',received:received,allocated:allocated,remaining:remaining,date:r['Payment Date']||'-'};
    });
    var unallocated=data.reduce(function(sum,r){return sum+r.remaining;},0);
    var totalReceived=data.reduce(function(sum,r){return sum+r.received;},0);
    var totalAllocated=data.reduce(function(sum,r){return sum+r.allocated;},0);
    box.innerHTML='<div class="panel-head"><div><h2>Receipt Balances</h2><p>Every client receipt is tracked against linked employee/partner payments and business expenses.</p></div></div>'+
      '<div class="grid" style="margin-top:14px;margin-bottom:14px">'+
      '<div class="card stat"><div class="label">Money Received</div><div class="value money">'+moneyPB(totalReceived)+'</div></div>'+ 
      '<div class="card stat"><div class="label">Allocated</div><div class="value money">'+moneyPB(totalAllocated)+'</div></div>'+ 
      '<div class="card stat"><div class="label">Unallocated Client Funds</div><div class="value money orange">'+moneyPB(unallocated)+'</div><div class="sub">Available for future allocation</div></div>'+ 
      '</div>'+
      (data.length?'<div class="table-wrap"><table class="table"><thead><tr><th>Receipt</th><th>Client</th><th>Received</th><th>Allocated</th><th>Remaining</th><th>Date</th></tr></thead><tbody>'+data.map(function(r){return '<tr><td><strong>'+escPB(r.id)+'</strong></td><td>'+escPB(r.client)+'</td><td class="money">'+moneyPB(r.received)+'</td><td class="money">'+moneyPB(r.allocated)+'</td><td class="money '+(r.remaining>0?'orange':'green')+'"><strong>'+moneyPB(r.remaining)+'</strong></td><td>'+escPB(r.date)+'</td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">No client receipts recorded yet.</div>');
  }
  function observe(){
    var root=document.getElementById('content');
    if(!root){setTimeout(observe,300);return;}
    var obs=new MutationObserver(function(){
      var isPayments=document.querySelector('.tabs')&&document.getElementById('paymentList');
      if(isPayments && !document.getElementById('receiptBalancesPanel')) loadBalances();
    });
    obs.observe(root,{childList:true,subtree:true});
    if(document.querySelector('.tabs')&&document.getElementById('paymentList')&&!document.getElementById('receiptBalancesPanel')) loadBalances();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',observe); else observe();
})();
</script>
