<script>
(function(){
  function escS(v){return String(v==null?'':v).replace(/[&<>\'\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]});}
  function renderUsers(rows){
    rows=rows||[];var c=document.getElementById('content');if(!c)return;
    c.innerHTML='<div class="hero"><div><h1>Settings</h1><p>CRM configuration and authorised Google-account access.</p></div><button class="primary" onclick="openUserForm()">＋ Add User</button></div><div class="card panel"><h2>Users & Permissions</h2><p>Access is controlled server-side by role. Changing a user's status takes effect on the next request.</p><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Access</th><th></th></tr></thead><tbody>'+rows.map(function(u){var status=String(u.Status||'Inactive'),role=String(u.Role||'');return '<tr><td><strong>'+escS(u.Name)+'</strong></td><td>'+escS(u.Email)+'</td><td>'+escS(role)+'</td><td><span class="status '+(status==='Active'?'green':'red')+'">'+escS(status)+'</span></td><td>'+escS(roleAccess(role))+'</td><td><button class="secondary" onclick="toggleUser(\''+escS(u['User ID'])+'\',\''+(status==='Active'?'Inactive':'Active')+'\')">'+(status==='Active'?'Deactivate':'Activate')+'</button></td></tr>';}).join('')+'</tbody></table></div></div><div class="grid" style="margin-top:17px"><div class="card stat"><div class="label">Active Users</div><div class="value">'+rows.filter(function(u){return String(u.Status)==='Active';}).length+'</div></div><div class="card stat"><div class="label">Admins</div><div class="value">'+rows.filter(function(u){return String(u.Role)==='Admin';}).length+'</div></div><div class="card stat"><div class="label">Managers</div><div class="value">'+rows.filter(function(u){return String(u.Role)==='Manager';}).length+'</div></div><div class="card stat"><div class="label">Employees</div><div class="value">'+rows.filter(function(u){return String(u.Role)==='Employee';}).length+'</div></div></div>';
  }
  function roleAccess(r){return ({Admin:'Full CRM access',Partner:'Full CRM access',Manager:'Operations + activities',Employee:'Projects + deliverables + content + own finance'})[r]||'Custom';}
  window.openUserForm=function(){document.getElementById('modalTitle').textContent='Add User';document.getElementById('modalBody').innerHTML='<div class="form-grid"><div class="field"><label>Name</label><input id="suName"></div><div class="field"><label>Google Account Email</label><input id="suEmail" type="email" placeholder="name@gmail.com"></div><div class="field"><label>Role</label><select id="suRole"><option>Employee</option><option>Manager</option><option>Partner</option><option>Admin</option></select></div><div class="field"><label>Status</label><select id="suStatus"><option>Active</option><option>Inactive</option></select></div></div><div class="form-actions"><button class="save" onclick="saveSettingsUser()">Save User</button></div>';document.getElementById('modalBg').classList.add('show');};
  window.saveSettingsUser=function(){var data={name:document.getElementById('suName').value,email:document.getElementById('suEmail').value,role:document.getElementById('suRole').value,status:document.getElementById('suStatus').value};google.script.run.withSuccessHandler(function(){closeModal();toast('User saved','ok');settings();}).withFailureHandler(function(e){toast(e.message||String(e),'err')}).saveUser(data);};
  window.toggleUser=function(id,status){if(!confirm('Change this user to '+status+'?'))return;google.script.run.withSuccessHandler(function(){toast('User status updated','ok');settings();}).withFailureHandler(function(e){toast(e.message||String(e),'err')}).updateUserStatus(id,status);};
  window.settings=function(){var c=document.getElementById('content');if(!c)return;c.innerHTML='<div class="hero"><div><h1>Settings</h1><p>Loading users and permissions...</p></div></div><div class="loading">Loading settings...</div>';google.script.run.withSuccessHandler(renderUsers).withFailureHandler(function(e){c.innerHTML='<div class="card panel"><div class="notice err">Unable to load settings: '+escS(e&&e.message||e)+'</div></div>';}).getUsers();};
})();
</script>
