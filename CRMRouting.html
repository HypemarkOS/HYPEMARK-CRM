<style id="hm-crm-routing-style">
.hm-projects{display:grid;gap:18px}.hm-project-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.hm-project-toolbar{display:flex;gap:10px;margin-bottom:14px}.hm-project-toolbar input{flex:1}.hm-project-toolbar input,.hm-project-toolbar select{height:40px;border:1px solid var(--line);border-radius:9px;padding:0 12px;background:#fff;outline:none}.hm-project-toolbar input:focus,.hm-project-toolbar select:focus{border-color:#e51b23;box-shadow:0 0 0 3px rgba(229,27,35,.08)}.hm-project-table{width:100%;border-collapse:collapse;min-width:900px}.hm-project-table th{text-align:left;background:#fbfcfe;color:#8a94a4;text-transform:uppercase;font-size:9px;padding:12px;border-bottom:1px solid var(--line);letter-spacing:.5px}.hm-project-table td{padding:13px 12px;border-bottom:1px solid var(--line);font-size:11px}.hm-project-table tr:hover{background:#fafbff}.hm-project-title{font-weight:800}.hm-project-meta{font-size:9px;color:var(--muted);margin-top:3px}.hm-project-empty{text-align:center;padding:45px;color:var(--muted);font-size:11px}.hm-project-error{padding:16px;background:#fff0f2;color:#bd3c4d;border-radius:9px;font-size:11px}.hm-project-value{font-variant-numeric:tabular-nums}.hm-project-create{border:0;background:#e51b23;color:#fff;padding:10px 15px;border-radius:9px;font-weight:800;cursor:pointer}.hm-project-create:hover{background:#c9151c}@media(max-width:1050px){.hm-project-stats{grid-template-columns:1fr 1fr}}@media(max-width:700px){.hm-project-toolbar{flex-direction:column}.hm-project-stats{grid-template-columns:1fr 1fr}}
</style>
<script>
(function(){
  var previousShow=window.show;
  function escR(v){return String(v==null?'':v).replace(/[&<>\'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
  function moneyR(v){var n=Number(String(v==null?'':v).replace(/,/g,''));return '₹'+(isFinite(n)?n:0).toLocaleString('en-IN',{maximumFractionDigits:2})}
  function dateR(v){if(!v)return '-';var d=new Date(v);return isNaN(d)?escR(v):d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
  function projectData(p,k){return p[k]!==undefined?p[k]:p[k.replace(/ /g,'')];}
  function projectPage(){
    var c=document.getElementById('content');if(!c)return;
    document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('active',b.dataset.page==='projects')});
    document.getElementById('crumb').textContent='Workspace / Projects';
    c.innerHTML='<div class="hm-projects"><div class="hero"><div><h1>Projects</h1><p>Track client work, ownership, deadlines and commercial value.</p></div><button class="hm-project-create" onclick="hmProjectCreate()">＋ New Project</button></div><div id="hmProjectStats" class="hm-project-stats"><div class="card stat"><div class="label">Total Projects</div><div class="value">…</div></div><div class="card stat"><div class="label">Active</div><div class="value">…</div></div><div class="card stat"><div class="label">Due Soon</div><div class="value">…</div></div><div class="card stat"><div class="label">Project Value</div><div class="value money">…</div></div></div><div class="card panel"><div class="panel-head"><div><h2>Project Pipeline</h2><p>Projects connected to your clients.</p></div><button class="secondary" onclick="hmProjectLoad()">↻ Refresh</button></div><div class="hm-project-toolbar"><input id="hmProjectSearch" placeholder="Search project, client or owner..." oninput="hmProjectRender()"><select id="hmProjectStatus" onchange="hmProjectRender()"><option value="">All statuses</option><option>Active</option><option>Planned</option><option>In Progress</option><option>On Hold</option><option>Completed</option><option>Cancelled</option></select></div><div class="table-wrap"><table class="hm-project-table"><thead><tr><th>Project</th><th>Client</th><th>Status</th><th>Priority</th><th>Due Date</th><th>Value</th></tr></thead><tbody id="hmProjectRows"><tr><td colspan="6" class="hm-project-empty">Loading projects...</td></tr></tbody></table></div></div></div>';
    window.hmProjectLoad();
  }
  window.hmProjectLoad=function(){
    var rows=document.getElementById('hmProjectRows');
    if(!rows)return;
    if(typeof run!=='function'){rows.innerHTML='<tr><td colspan="6" class="hm-project-error">CRM runtime is not ready.</td></tr>';return;}
    run('getProjects',undefined,function(data){window.hmProjects=Array.isArray(data)?data:[];hmProjectRender();},function(err){rows.innerHTML='<tr><td colspan="6" class="hm-project-error">Unable to load Projects: '+escR(err&&err.message||err)+'</td></tr>';});
  };
  window.hmProjectRender=function(){
    var all=window.hmProjects||[],q=((document.getElementById('hmProjectSearch')||{}).value||'').toLowerCase().trim(),s=((document.getElementById('hmProjectStatus')||{}).value||'');
    var filtered=all.filter(function(p){var text=[p['Project Name'],p.Name,p['Client ID'],p.Client,p.ClientName,p.Owner,p['Assigned To']].join(' ').toLowerCase();var status=String(p.Status||'');return(!q||text.indexOf(q)>-1)&&(!s||status===s)});
    var rows=document.getElementById('hmProjectRows');if(!rows)return;
    var total=all.length,active=all.filter(function(p){return String(p.Status||'')==='Active'||String(p.Status||'')==='In Progress'}).length,value=all.reduce(function(n,p){return n+Number(p['Project Value']||p.Value||0)},0),now=new Date(),soon=new Date(now.getTime()+7*86400000),due=all.filter(function(p){var d=new Date(p['Due Date']||p.Deadline);return !isNaN(d)&&d>=now&&d<=soon&&['Completed','Cancelled','Closed'].indexOf(String(p.Status||''))<0}).length;
    var st=document.getElementById('hmProjectStats');if(st)st.innerHTML='<div class="card stat"><div class="label">Total Projects</div><div class="value">'+total+'</div><div class="sub">All projects</div></div><div class="card stat"><div class="label">Active</div><div class="value">'+active+'</div><div class="sub green">Running now</div></div><div class="card stat"><div class="label">Due Soon</div><div class="value">'+due+'</div><div class="sub">Next 7 days</div></div><div class="card stat"><div class="label">Project Value</div><div class="value money">'+moneyR(value)+'</div><div class="sub">Agreed project value</div></div>';
    if(!filtered.length){rows.innerHTML='<tr><td colspan="6" class="hm-project-empty">No projects match your filters.</td></tr>';return}
    rows.innerHTML=filtered.map(function(p){var status=String(p.Status||'Planned'),cls=status==='Active'||status==='Completed'?'green':status==='On Hold'||status==='In Progress'?'orange':status==='Cancelled'?'red':'';return '<tr><td><div class="hm-project-title">'+escR(p['Project Name']||p.Name||p['Project ID']||'Untitled')+'</div><div class="hm-project-meta">'+escR(p['Project ID']||'')+'</div></td><td>'+escR(p.Client||p.ClientName||p['Client ID']||'-')+'</td><td><span class="status '+cls+'">'+escR(status)+'</span></td><td>'+escR(p.Priority||'-')+'</td><td>'+dateR(p['Due Date']||p.Deadline)+'</td><td class="hm-project-value">'+moneyR(p['Project Value']||p.Value||0)+'</td></tr>'}).join('');
  };
  window.hmProjectCreate=function(){
    if(typeof run!=='function'){toast('CRM runtime is not ready.','err');return;}
    run('getClients',undefined,function(clients){clients=clients||[];var options=clients.map(function(c){var id=c['Client ID']||c.ID||c.clientId||'';var name=c['Business Name']||c['Client Name']||c.Name||id;return '<option value="'+escR(id)+'">'+escR(name)+'</option>'}).join('');document.getElementById('modalTitle').textContent='New Project';document.getElementById('modalBody').innerHTML='<form onsubmit="hmProjectSave(event)"><div class="form-grid"><div class="field"><label>Project Name *</label><input id="hmProjectName" required placeholder="e.g. Instagram Growth Campaign"></div><div class="field"><label>Client *</label><select id="hmProjectClient" required><option value="">Select client</option>'+options+'</select></div><div class="field"><label>Status</label><select id="hmProjectFormStatus"><option>Active</option><option>Planned</option><option>In Progress</option><option>On Hold</option><option>Completed</option><option>Cancelled</option></select></div><div class="field"><label>Priority</label><select id="hmProjectPriority"><option>Medium</option><option>Low</option><option>High</option><option>Critical</option></select></div><div class="field"><label>Project Value</label><input id="hmProjectValue" type="text" inputmode="decimal" placeholder="₹ 0" autocomplete="off"><div class="project-modal-note">Total agreed value. Actual receipts are tracked separately in Payments.</div></div><div class="field"><label>Due Date</label><input id="hmProjectDue" type="date"></div><div class="field full"><label>Notes</label><textarea id="hmProjectNotes" placeholder="Scope, priorities or internal notes"></textarea></div></div><div class="form-actions"><button class="save" type="submit">Create Project</button></div></form>';document.getElementById('modalBg').classList.add('show');},function(err){toast(err.message||String(err),'err')});
  };
  window.hmProjectSave=function(e){e.preventDefault();var raw=(document.getElementById('hmProjectValue').value||'').replace(/[₹,\s]/g,'');var value=raw===''?0:Number(raw);if(!isFinite(value)||value<0){toast('Enter a valid project value.','err');return}var data={'Project Name':document.getElementById('hmProjectName').value.trim(),'Client ID':document.getElementById('hmProjectClient').value,Status:document.getElementById('hmProjectFormStatus').value,Priority:document.getElementById('hmProjectPriority').value,'Project Value':value,'Due Date':document.getElementById('hmProjectDue').value,Notes:document.getElementById('hmProjectNotes').value.trim()};run('createProject',[data],function(){closeModal();toast('Project created successfully.','ok');hmProjectLoad()},function(err){toast(err.message||String(err),'err')});};
  window.show=function(page){if(page==='projects'){history.replaceState({},'',location.pathname+'?page=projects');projectPage();return}return previousShow.apply(this,arguments)};
  var initial=new URLSearchParams(location.search).get('page');if(initial==='projects')projectPage();
})();
</script>
