<script>
(function(){
  function esc(v){return String(v==null?'':v).replace(/[&<>\'\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]});}
  function call(name,args,ok,fail){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(fail||function(x){if(window.toast)toast(x.message||String(x),'err')});return args===undefined?r[name]():r[name].apply(r,args);}
  function isDeliverables(){var c=document.getElementById('crumb');return c&&/Deliverables/i.test(c.textContent||'');}
  function addStyles(){if(document.getElementById('hm-del-task-sync-style'))return;var s=document.createElement('style');s.id='hm-del-task-sync-style';s.textContent='.hm-task-progress{min-width:155px}.hm-task-progress .bar{height:7px;background:#eceff3;border-radius:8px;overflow:hidden;margin:6px 0 4px}.hm-task-progress .bar>span{display:block;height:100%;background:#e51b23;border-radius:8px}.hm-task-progress small{font-size:10px;color:#6f7785}.hm-task-progress.overdue{color:#b42318}.hm-task-progress .overdue{color:#b42318;font-weight:700}.hm-del-clickable{cursor:pointer}.hm-del-clickable:hover{background:#fafafa}.hm-del-detail{padding:4px}.hm-del-detail .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.hm-del-detail .metric{border:1px solid #e5e7eb;border-radius:12px;padding:14px;background:#fff}.hm-del-detail .metric b{display:block;font-size:20px;margin-top:5px}.hm-del-detail .tasks{margin-top:18px;border-top:1px solid #eee}.hm-del-detail .task{display:grid;grid-template-columns:1fr 130px 110px 110px;gap:12px;padding:12px 0;border-bottom:1px solid #eee;font-size:12px}.hm-del-detail .muted{color:#737b88;font-size:11px}.hm-del-detail .progress{height:8px;background:#eceff3;border-radius:8px;overflow:hidden;margin-top:7px}.hm-del-detail .progress span{display:block;height:100%;background:#e51b23}.hm-del-detail .empty{padding:24px;text-align:center;color:#737b88}@media(max-width:700px){.hm-del-detail .summary{grid-template-columns:1fr 1fr}.hm-del-detail .task{grid-template-columns:1fr 90px}.hm-del-detail .task .extra{display:none}}';document.head.appendChild(s);}
  function summary(tasks,id){var x={total:0,completed:0,inProgress:0,pendingReview:0,toDo:0,onHold:0,overdue:0,progress:0},today=new Date();today.setHours(0,0,0,0);(tasks||[]).forEach(function(t){if(String(t['Deliverable ID']||'').trim()!==String(id||'').trim())return;x.total++;var st=String(t.Status||'');if(st==='Completed')x.completed++;else if(st==='In Progress')x.inProgress++;else if(st==='Pending Review')x.pendingReview++;else if(st==='To Do')x.toDo++;else if(st==='On Hold')x.onHold++;if(st!=='Completed'&&t['Due Date']){var d=t['Due Date'] instanceof Date?new Date(t['Due Date']):new Date(t['Due Date']);if(!isNaN(d.getTime())){d.setHours(0,0,0,0);if(d<today)x.overdue++;}}});x.progress=x.total?Math.round(x.completed/x.total*100):0;return x;}
  function loadData(done){call('getDeliverables',undefined,function(ds){ds=Array.isArray(ds)?ds:[];call('getTasks',undefined,function(tasks){done(ds,tasks||[]);},function(){done(ds,[]);});},function(){done([],[]);});}
  function decorate(){if(!isDeliverables())return;addStyles();var table=document.getElementById('hmDelRows');if(!table)return;loadData(function(ds,tasks){var map={};ds.forEach(function(d){map[String(d['Deliverable ID']||'')]=summary(tasks,d['Deliverable ID']);});var head=document.querySelector('#hmDelRows')&&document.querySelector('#hmDelRows').closest('table');if(head){var hr=head.querySelector('thead tr');if(hr&&!hr.querySelector('.hm-task-head')){var th=document.createElement('th');th.className='hm-task-head';th.textContent='Task Progress';hr.appendChild(th);}}
      var rows=Array.prototype.slice.call(table.querySelectorAll('tr'));rows.forEach(function(row,index){var id='';var text=row.textContent||'';ds.some(function(d){var did=String(d['Deliverable ID']||'');if(did&&text.indexOf(did)>-1){id=did;return true;}return false;});if(!id&&ds[index])id=String(ds[index]['Deliverable ID']||'');if(!id)return;var d=ds.find(function(x){return String(x['Deliverable ID']||'')===id;});if(!d)return;var x=map[id]||summary([],id);row.classList.add('hm-del-clickable');row.title='Open deliverable details';row.dataset.deliverableId=id;if(!row.dataset.hmDelBound){row.dataset.hmDelBound='1';row.addEventListener('click',function(ev){if(ev.target&&ev.target.tagName==='SELECT')return;openDetail(d,tasks);});}var old=row.querySelector('.hm-task-progress');if(old)old.remove();var td=document.createElement('td');td.className='hm-task-progress'+(x.overdue?' overdue':'');td.innerHTML='<div><strong>'+x.completed+' / '+x.total+' completed</strong></div><div class="bar"><span style="width:'+x.progress+'%"></span></div><small>'+x.progress+'%'+(x.overdue?' · <span class="overdue">'+x.overdue+' overdue</span>':'')+'</small>';row.appendChild(td);});});}
  function openDetail(d,tasks){var related=(tasks||[]).filter(function(t){return String(t['Deliverable ID']||'').trim()===String(d['Deliverable ID']||'').trim();}),s=summary(tasks,d['Deliverable ID']);var html='<div class="hm-del-detail"><div><strong>'+esc(d.Type||'Deliverable')+'</strong><div class="muted">'+esc(d['Deliverable ID']||'')+'</div></div><div class="summary"><div class="metric">Tasks<b>'+s.total+'</b></div><div class="metric">Completed<b>'+s.completed+'</b></div><div class="metric">In Progress<b>'+s.inProgress+'</b></div><div class="metric">Progress<b>'+s.progress+'%</b><div class="progress"><span style="width:'+s.progress+'%"></span></div></div></div><div class="tasks"><h3>Related Tasks</h3>';if(!related.length)html+='<div class="empty">No tasks are linked to this deliverable yet.</div>';else related.forEach(function(t){html+='<div class="task"><div><strong>'+esc(t['Task Name']||'-')+'</strong><div class="muted">'+esc(t['Task ID']||'')+'</div></div><div>'+esc(t['Assigned To']||'-')+'</div><div class="extra">'+esc(t.Priority||'-')+'</div><div>'+esc(t.Status||'-')+'</div></div>';});html+='</div></div>';var title=document.getElementById('modalTitle'),body=document.getElementById('modalBody'),bg=document.getElementById('modalBg');if(title&&body&&bg){title.textContent='Deliverable Details';body.innerHTML=html;bg.classList.add('show');}else if(window.toast)toast('Unable to open deliverable details.','err');}
  var last='';function tick(){var sig=(location.search||'')+'|'+(document.getElementById('crumb')||{}).textContent+'|'+(document.getElementById('hmDelRows')||{}).innerHTML.length;if(sig!==last){last=sig;setTimeout(decorate,200);setTimeout(decorate,800);}}window.addEventListener('load',tick);window.addEventListener('popstate',function(){last='';tick();});setInterval(tick,1000);
})();
</script>
