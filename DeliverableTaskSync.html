<script>
(function(){
  function esc(v){return String(v==null?'':v).replace(/[&<>\'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]});}
  function call(name,args,ok,fail){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(fail||function(){});return args===undefined?r[name]():r[name].apply(r,args);}
  function isDeliverables(){var c=document.getElementById('crumb');return c&&/Deliverables/i.test(c.textContent||'');}
  function addStyles(){if(document.getElementById('hm-del-task-sync-style'))return;var s=document.createElement('style');s.id='hm-del-task-sync-style';s.textContent='.hm-task-progress{min-width:150px}.hm-task-progress .bar{height:6px;background:#eceff3;border-radius:8px;overflow:hidden;margin:6px 0 4px}.hm-task-progress .bar>span{display:block;height:100%;background:#e51b23;border-radius:8px}.hm-task-progress small{font-size:10px;color:#6f7785}.hm-task-progress.overdue{color:#b42318}.hm-task-progress .overdue{color:#b42318;font-weight:700}';document.head.appendChild(s);}
  function decorate(){if(!isDeliverables())return;addStyles();var table=document.querySelector('#hmDelRows')||document.querySelector('tbody');if(!table)return;var rows=Array.prototype.slice.call(table.querySelectorAll('tr'));if(!rows.length)return;call('getDeliverables',undefined,function(ds){ds=Array.isArray(ds)?ds:[];if(!ds.length)return;var jobs=ds.map(function(d){var id=String(d['Deliverable ID']||'');return{id:id,type:String(d.Type||''),project:String(d['Project ID']||'')};});var map={};var left=jobs.length;jobs.forEach(function(j){call('getDeliverableTaskSummary',[j.id],function(x){map[j.id]=x||{};if(!--left)render(rows,jobs,map);},function(){map[j.id]={};if(!--left)render(rows,jobs,map);});});});}
  function render(rows,jobs,map){var heads=document.querySelectorAll('table thead tr');if(heads.length){var h=heads[heads.length-1];if(!h.querySelector('.hm-task-head')){var th=document.createElement('th');th.className='hm-task-head';th.textContent='Task Progress';h.appendChild(th);}}
    rows.forEach(function(row){if(row.querySelector('.hm-task-progress'))return;var text=row.textContent||'';var j=jobs.find(function(x){return x.id&&text.indexOf(x.id)>-1;});if(!j){j=jobs.find(function(x){return x.type&&text.indexOf(x.type)>-1;});}if(!j)return;var x=map[j.id]||{},pct=Number(x.progress||0),total=Number(x.total||0),done=Number(x.completed||0),over=Number(x.overdue||0);var td=document.createElement('td');td.className='hm-task-progress'+(over?' overdue':'');td.innerHTML='<div><strong>'+esc(done)+' / '+esc(total)+' completed</strong></div><div class="bar"><span style="width:'+Math.max(0,Math.min(100,pct))+'%"></span></div><small>'+esc(pct)+'%'+(over?' · <span class="overdue">'+esc(over)+' overdue</span>':'')+'</small>';row.appendChild(td);});}
  var last='';function tick(){var sig=(location.search||'')+'|'+(document.getElementById('crumb')||{}).textContent;if(sig!==last){last=sig;setTimeout(decorate,250);setTimeout(decorate,900);}}
  window.addEventListener('load',tick);window.addEventListener('popstate',function(){last='';tick();});setInterval(tick,1000);
})();
</script>
