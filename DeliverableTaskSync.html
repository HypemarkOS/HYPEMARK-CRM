<script>
(function(){
  function e(v){return String(v==null?'':v).replace(/[&<>\'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]});}
  function call(name,args,ok,fail){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(fail||function(x){if(window.toast)toast(x.message||String(x),'err')});return args===undefined?r[name]():r[name].apply(r,args);}
  function isDel(){var c=document.getElementById('crumb');return c&&/Deliverables/i.test(c.textContent||'');}
  function bindCreate(){if(!isDel())return;var b=document.getElementById('hmNewDeliverable');if(!b||b.dataset.hmCreateBound)return;b.dataset.hmCreateBound='1';b.onclick=openCreate;}
  function openCreate(){call('getProjects',undefined,function(projects){call('getDeliverableAssignees',undefined,function(users){var po=(projects||[]).map(function(p){var id=p['Project ID']||p.ID||p.id||'';var n=p['Project Name']||p.Name||id;return '<option value="'+e(id)+'">'+e(n)+'</option>';}).join('');var u='<option value="">Unassigned</option>'+(users||[]).map(function(x){return '<option value="'+e(x.name)+'">'+e(x.name)+' · '+e(x.role)+'</option>';}).join('');document.getElementById('modalTitle').textContent='New Deliverable';document.getElementById('modalBody').innerHTML='<form id="hmDelFormFinal"><div class="form-grid"><div class="field full"><label>Project *</label><select id="hmDelProjectFinal" required><option value="">Select project</option>'+po+'</select></div><div class="field"><label>Deliverable Type *</label><input id="hmDelTypeFinal" required placeholder="e.g. Instagram Reel"></div><div class="field"><label>Quantity</label><input id="hmDelQtyFinal" type="number" min="1" step="1" value="1"></div><div class="field"><label>Assigned To</label><select id="hmDelAssigneeFinal">'+u+'</select></div><div class="field"><label>Priority</label><select id="hmDelPriorityFinal"><option>Low</option><option selected>Medium</option><option>High</option><option>Urgent</option></select></div><div class="field"><label>Start Date</label><input id="hmDelStartFinal" type="date"></div><div class="field"><label>Due Date</label><input id="hmDelDueFinal" type="date"></div><div class="field"><label>Status</label><select id="hmDelStFinal"><option>Planned</option><option>In Progress</option><option>Completed</option><option>On Hold</option></select></div><div class="field full"><label>Notes</label><textarea id="hmDelNotesFinal" placeholder="Scope, instructions or internal notes"></textarea></div></div><div class="form-actions"><button class="save" type="submit">Create Deliverable</button></div></form>';document.getElementById('hmDelFormFinal').onsubmit=saveCreate;document.getElementById('modalBg').classList.add('show');},function(err){toast(err.message||String(err),'err');});},function(err){toast(err.message||String(err),'err');});}
  function saveCreate(ev){ev.preventDefault();var d={projectId:document.getElementById('hmDelProjectFinal').value,type:document.getElementById('hmDelTypeFinal').value.trim(),quantity:Math.max(1,parseInt(document.getElementById('hmDelQtyFinal').value,10)||1),assignedTo:document.getElementById('hmDelAssigneeFinal').value,priority:document.getElementById('hmDelPriorityFinal').value,startDate:document.getElementById('hmDelStartFinal').value,dueDate:document.getElementById('hmDelDueFinal').value,status:document.getElementById('hmDelStFinal').value,notes:document.getElementById('hmDelNotesFinal').value.trim()};if(!d.projectId||!d.type){toast('Project and deliverable type are required.','err');return;}if(d.startDate&&d.dueDate&&d.dueDate<d.startDate){toast('Due Date cannot be before Start Date.','err');return;}call('createDeliverable',[d],function(){closeModal();toast('Deliverable created successfully.','ok');var b=document.getElementById('hmDelRefresh');if(b)b.click();},function(err){toast(err.message||String(err),'err');});}
  function style(){if(document.getElementById('hmDelDetailStyle'))return;var s=document.createElement('style');s.id='hmDelDetailStyle';s.textContent='.hm-del-row{cursor:pointer}.hm-del-row:hover{background:#fafafa}.hm-del-detail{padding:4px}.hm-del-detail .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.hm-del-detail .metric{border:1px solid #e5e7eb;border-radius:12px;padding:14px;background:#fff}.hm-del-detail .metric b{display:block;font-size:20px;margin-top:5px}.hm-del-detail .tasks{margin-top:18px;border-top:1px solid #eee}.hm-del-detail .task{display:grid;grid-template-columns:1fr 130px 110px 110px;gap:12px;padding:12px 0;border-bottom:1px solid #eee;font-size:12px}.hm-del-detail .muted{color:#737b88;font-size:11px}.hm-del-detail .progress{height:8px;background:#eceff3;border-radius:8px;overflow:hidden;margin-top:7px}.hm-del-detail .progress span{display:block;height:100%;background:#e51b23}.hm-del-detail .empty{padding:24px;text-align:center;color:#737b88}@media(max-width:700px){.hm-del-detail .summary{grid-template-columns:1fr 1fr}.hm-del-detail .task{grid-template-columns:1fr 90px}.hm-del-detail .task .extra{display:none}}';document.head.appendChild(s);}
  function summary(tasks,id){var x={total:0,completed:0,inProgress:0,overdue:0,progress:0},today=new Date();today.setHours(0,0,0,0);(tasks||[]).forEach(function(t){if(String(t['Deliverable ID']||'').trim()!==String(id||'').trim())return;x.total++;var st=String(t.Status||'');if(st==='Completed')x.completed++;else if(st==='In Progress')x.inProgress++;if(st!=='Completed'&&t['Due Date']){var d=new Date(t['Due Date']);if(!isNaN(d.getTime())){d.setHours(0,0,0,0);if(d<today)x.overdue++;}}});x.progress=x.total?Math.round(x.completed/x.total*100):0;return x;}
  function openDetail(d,tasks){var rel=(tasks||[]).filter(function(t){return String(t['Deliverable ID']||'').trim()===String(d['Deliverable ID']||'').trim();}),x=summary(tasks,d['Deliverable ID']);var h='<div class="hm-del-detail"><div><strong>'+e(d.Type||d['Deliverable Type']||'Deliverable')+'</strong><div class="muted">'+e(d['Deliverable ID']||'')+'</div></div><div class="summary"><div class="metric">Tasks<b>'+x.total+'</b></div><div class="metric">Completed<b>'+x.completed+'</b></div><div class="metric">In Progress<b>'+x.inProgress+'</b></div><div class="metric">Progress<b>'+x.progress+'%</b><div class="progress"><span style="width:'+x.progress+'%"></span></div></div></div><div class="tasks"><h3>Related Tasks</h3>';if(!rel.length)h+='<div class="empty">No tasks are linked to this deliverable yet.</div>';else rel.forEach(function(t){h+='<div class="task"><div><strong>'+e(t['Task Name']||t.Name||'-')+'</strong><div class="muted">'+e(t['Task ID']||'')+'</div></div><div>'+e(t['Assigned To']||'-')+'</div><div class="extra">'+e(t.Priority||'-')+'</div><div>'+e(t.Status||'-')+'</div></div>';});h+='</div></div>';var title=document.getElementById('modalTitle'),body=document.getElementById('modalBody'),bg=document.getElementById('modalBg');if(title&&body&&bg){title.textContent='Deliverable Details';body.innerHTML=h;bg.classList.add('show');}else if(window.toast)toast('Unable to open deliverable details.','err');}
  function decorate(){if(!isDel())return;style();bindCreate();var rows=document.getElementById('hmDelRows');if(!rows)return;var trs=Array.prototype.slice.call(rows.querySelectorAll('tr'));call('getDeliverables',undefined,function(ds){call('getTasks',undefined,function(tasks){trs.forEach(function(row,i){var id=row.dataset.deliverableId||'';var text=row.textContent||'';if(!id){for(var j=0;j<ds.length;j++){var did=String(ds[j]['Deliverable ID']||'');if(did&&text.indexOf(did)>-1){id=did;break;}}if(!id&&ds[i])id=String(ds[i]['Deliverable ID']||'');}if(!id)return;var d=ds.find(function(v){return String(v['Deliverable ID']||'')===id;});if(!d)return;row.dataset.deliverableId=id;row.classList.add('hm-del-row');if(!row.dataset.hmClick){row.dataset.hmClick='1';row.addEventListener('click',function(ev){if(ev.target&&ev.target.closest&&ev.target.closest('select,button,a,input'))return;openDetail(d,tasks||[]);});}});});});}
  var last='';function tick(){if(!isDel())return;var r=document.getElementById('hmDelRows');var sig=(r?r.innerHTML:'').length+'|'+(r?r.querySelectorAll('tr').length:0)+'|'+!!document.getElementById('hmNewDeliverable');if(sig!==last){last=sig;setTimeout(decorate,100);setTimeout(decorate,800);}}
  window.addEventListener('load',function(){tick();setInterval(tick,1000);});
})();
</script>
