<script>
(function(){
  function esc(v){return String(v==null?'':v).replace(/[&<>\'\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]});}
  function call(name,args,ok,fail){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(fail||function(x){if(window.toast)toast(x.message||String(x),'err')});return args===undefined?r[name]():r[name].apply(r,args);}
  function isDeliverables(){var c=document.getElementById('crumb');return c&&/Deliverables/i.test(c.textContent||'');}
  function addStyles(){if(document.getElementById('hm-del-task-sync-style'))return;var s=document.createElement('style');s.id='hm-del-task-sync-style';s.textContent='.hm-task-progress{min-width:150px}.hm-task-progress .bar{height:6px;background:#eceff3;border-radius:8px;overflow:hidden;margin:6px 0 4px}.hm-task-progress .bar>span{display:block;height:100%;background:#e51b23;border-radius:8px}.hm-task-progress small{font-size:10px;color:#6f7785}.hm-task-progress.overdue{color:#b42318}.hm-task-progress .overdue{color:#b42318;font-weight:700}.hm-del-clickable{cursor:pointer}.hm-del-clickable:hover{background:#fafafa}.hm-del-detail{padding:4px}.hm-del-detail .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.hm-del-detail .metric{border:1px solid #e5e7eb;border-radius:12px;padding:14px;background:#fff}.hm-del-detail .metric b{display:block;font-size:20px;margin-top:5px}.hm-del-detail .tasks{margin-top:18px;border-top:1px solid #eee}.hm-del-detail .task{display:grid;grid-template-columns:1fr 130px 110px 100px;gap:12px;padding:12px 0;border-bottom:1px solid #eee;font-size:12px}.hm-del-detail .muted{color:#737b88;font-size:11px}.hm-del-detail .progress{height:8px;background:#eceff3;border-radius:8px;overflow:hidden;margin-top:7px}.hm-del-detail .progress span{display:block;height:100%;background:#e51b23}.hm-del-detail .empty{padding:24px;text-align:center;color:#737b88}@media(max-width:700px){.hm-del-detail .summary{grid-template-columns:1fr 1fr}.hm-del-detail .task{grid-template-columns:1fr 90px}.hm-del-detail .task .extra{display:none}}';document.head.appendChild(s);}
  function normalizeSummary(x){x=x||{};return{total:Number(x['Task Count']||0),completed:Number(x['Completed Tasks']||0),inProgress:Number(x['In Progress Tasks']||0),pendingReview:Number(x['Pending Review Tasks']||0),toDo:Number(x['To Do Tasks']||0),onHold:Number(x['On Hold Tasks']||0),overdue:Number(x['Overdue Tasks']||0),progress:Number(x['Task Progress']||0)};}
  function decorate(){if(!isDeliverables())return;addStyles();var table=document.querySelector('#hmDelRows')||document.querySelector('tbody');if(!table)return;var rows=Array.prototype.slice.call(table.querySelectorAll('tr'));if(!rows.length)return;call('getDeliverables',undefined,function(ds){ds=Array.isArray(ds)?ds:[];if(!ds.length)return;var jobs=ds.map(function(d){return{id:String(d['Deliverable ID']||''),type:String(d.Type||''),project:String(d['Project ID']||''),data:d};});var map={};var left=jobs.length;jobs.forEach(function(j){call('getDeliverableTaskSummary',[j.id],function(x){map[j.id]=normalizeSummary(x);if(!--left)render(rows,jobs,map);},function(){map[j.id]=normalizeSummary({});if(!--left)render(rows,jobs,map);});});},function(){ });}
  function findJob(row,index,jobs){var text=row.textContent||'';var idMatch=jobs.find(function(x){return x.id&&text.indexOf(x.id)>-1;});if(idMatch)return idMatch;var typeMatch=jobs.find(function(x){return x.type&&text.indexOf(x.type)>-1;});if(typeMatch)return typeMatch;return jobs[index]||null;}
  function render(rows,jobs,map){var heads=document.querySelectorAll('table thead tr');if(heads.length){var h=heads[heads.length-1];if(!h.querySelector('.hm-task-head')){var th=document.createElement('th');th.className='hm-task-head';th.textContent='Task Progress';h.appendChild(th);}}
    rows.forEach(function(row,index){var j=findJob(row,index,jobs);if(!j)return;row.classList.add('hm-del-clickable');row.title='Open deliverable details';if(!row.dataset.hmDelBound){row.dataset.hmDelBound='1';row.addEventListener('click',function(ev){if(ev.target&&ev.target.tagName==='SELECT')return;openDetail(j);});}var old=row.querySelector('.hm-task-progress');if(old)old.remove();var x=map[j.id]||normalizeSummary({}),pct=Math.max(0,Math.min(100,x.progress)),td=document.createElement('td');td.className='hm-task-progress'+(x.overdue?' overdue':'');td.innerHTML='<div><strong>'+esc(x.completed)+' / '+esc(x.total)+' completed</strong></div><div class="bar"><span style="width:'+pct+'%"></span></div><small>'+esc(pct)+'%'+(x.overdue?' · <span class="overdue">'+esc(x.overdue)+' overdue</span>':'')+'</small>';row.appendChild(td);});}
  function openDetail(job){call('getTasks',undefined,function(tasks){tasks=Array.isArray(tasks)?tasks:[];var related=tasks.filter(function(t){return String(t['Deliverable ID']||'')===job.id;});var s=normalizeSummary({});if(related.length){s.total=related.length;related.forEach(function(t){var st=String(t.Status||'');if(st==='Completed')s.completed++;else if(st==='In Progress')s.inProgress++;else if(st==='Pending Review')s.pendingReview++;else if(st==='To Do')s.toDo++;else if(st==='On Hold')s.onHold++;});s.progress=Math.round((s.completed/s.total)*100);}var html='<div class="hm-del-detail"><div><strong>'+esc(job.data.Type||'Deliverable')+'</strong><div class="muted">'+esc(job.id)+'</div></div><div class="summary"><div class="metric">Tasks<b>'+s.total+'</b></div><div class="metric">Completed<b>'+s.completed+'</b></div><div class="metric">In Progress<b>'+s.inProgress+'</b></div><div class="metric">Progress<b>'+s.progress+'%</b><div class="progress"><span style="width:'+s.progress+'%"></span></div></div></div><div class="tasks"><h3>Related Tasks</h3>';
      if(!related.length)html+='<div class="empty">No tasks are linked to this deliverable yet.</div>';else related.forEach(function(t){html+='<div class="task"><div><strong>'+esc(t['Task Name']||'-')+'</strong><div class="muted">'+esc(t['Task ID']||'')+'</div></div><div>'+esc(t['Assigned To']||'-')+'</div><div class="extra">'+esc(t.Priority||'-')+'</div><div>'+esc(t.Status||'-')+'</div></div>';});
      html+='</div></div>';var title=document.getElementById('modalTitle'),body=document.getElementById('modalBody'),bg=document.getElementById('modalBg');if(title&&body&&bg){title.textContent='Deliverable Details';body.innerHTML=html;bg.classList.add('show');}else if(window.toast)toast('Unable to open deliverable details.','err');},function(err){if(window.toast)toast(err.message||String(err),'err');});}
  var last='';function tick(){var sig=(location.search||'')+'|'+(document.getElementById('crumb')||{}).textContent;if(sig!==last){last=sig;setTimeout(decorate,250);setTimeout(decorate,900);}}
  window.addEventListener('load',tick);window.addEventListener('popstate',function(){last='';tick();});setInterval(tick,1000);
})();
</script>
