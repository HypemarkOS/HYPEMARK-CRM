<script>
(function(){
  function e(v){return String(v==null?'':v).replace(/[&<>\'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]});}
  function call(name,args,ok,fail){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(fail||function(x){if(window.toast)toast(x.message||String(x),'err')});return args===undefined?r[name]():r[name].apply(r,args);}
  function isDeliverables(){var c=document.getElementById('crumb');return c&&/Deliverables/i.test(c.textContent||'');}
  function bindCreate(){if(!isDeliverables())return;var b=document.getElementById('hmNewDeliverable');if(!b||b.dataset.hmCreateBound)return;b.dataset.hmCreateBound='1';b.onclick=function(){openCreate();};}
  function openCreate(){
    call('getProjects',undefined,function(projects){
      call('getDeliverableAssignees',undefined,function(users){
        var projectOpts=(projects||[]).map(function(p){var id=p['Project ID']||p.ID||p.id||'';var name=p['Project Name']||p.Name||id;return '<option value="'+e(id)+'">'+e(name)+'</option>';}).join('');
        var userOpts='<option value="">Unassigned</option>'+(users||[]).map(function(u){return '<option value="'+e(u.name)+'">'+e(u.name)+' · '+e(u.role)+'</option>';}).join('');
        document.getElementById('modalTitle').textContent='New Deliverable';
        document.getElementById('modalBody').innerHTML='<form id="hmDelFormFinal"><div class="form-grid">'+
          '<div class="field full"><label>Project *</label><select id="hmDelProjectFinal" required><option value="">Select project</option>'+projectOpts+'</select></div>'+ 
          '<div class="field"><label>Deliverable Type *</label><input id="hmDelTypeFinal" required placeholder="e.g. Instagram Reel"></div>'+ 
          '<div class="field"><label>Quantity</label><input id="hmDelQtyFinal" type="number" min="1" step="1" value="1"></div>'+ 
          '<div class="field"><label>Assigned To</label><select id="hmDelAssigneeFinal">'+userOpts+'</select></div>'+ 
          '<div class="field"><label>Priority</label><select id="hmDelPriorityFinal"><option>Low</option><option selected>Medium</option><option>High</option><option>Urgent</option></select></div>'+ 
          '<div class="field"><label>Start Date</label><input id="hmDelStartFinal" type="date"></div>'+ 
          '<div class="field"><label>Due Date</label><input id="hmDelDueFinal" type="date"></div>'+ 
          '<div class="field"><label>Status</label><select id="hmDelStFinal"><option>Planned</option><option>In Progress</option><option>Completed</option><option>On Hold</option></select></div>'+ 
          '<div class="field full"><label>Notes</label><textarea id="hmDelNotesFinal" placeholder="Scope, instructions or internal notes"></textarea></div>'+ 
          '</div><div class="form-actions"><button class="save" type="submit">Create Deliverable</button></div></form>';
        document.getElementById('hmDelFormFinal').onsubmit=saveCreate;
        document.getElementById('modalBg').classList.add('show');
      },function(err){toast(err.message||String(err),'err');});
    },function(err){toast(err.message||String(err),'err');});
  }
  function saveCreate(ev){
    ev.preventDefault();
    var data={
      projectId:document.getElementById('hmDelProjectFinal').value,
      type:document.getElementById('hmDelTypeFinal').value.trim(),
      quantity:Math.max(1,parseInt(document.getElementById('hmDelQtyFinal').value,10)||1),
      assignedTo:document.getElementById('hmDelAssigneeFinal').value,
      priority:document.getElementById('hmDelPriorityFinal').value,
      startDate:document.getElementById('hmDelStartFinal').value,
      dueDate:document.getElementById('hmDelDueFinal').value,
      status:document.getElementById('hmDelStFinal').value,
      notes:document.getElementById('hmDelNotesFinal').value.trim()
    };
    if(!data.projectId||!data.type){toast('Project and deliverable type are required.','err');return;}
    if(data.startDate&&data.dueDate&&data.dueDate<data.startDate){toast('Due Date cannot be before Start Date.','err');return;}
    call('createDeliverable',[data],function(){closeModal();toast('Deliverable created successfully.','ok');var b=document.getElementById('hmDelRefresh');if(b)b.click();else{var nav=document.querySelector('.nav button[data-page="deliverables"]');if(nav)nav.click();}},function(err){toast(err.message||String(err),'err');});
  }
  var last='';function tick(){if(!isDeliverables())return;var b=document.getElementById('hmNewDeliverable');var sig=(b?b.outerHTML:'')+'|'+(document.getElementById('hmDelRows')||{}).innerHTML.length;if(sig!==last){last=sig;setTimeout(bindCreate,100);setTimeout(bindCreate,700);}}
  window.addEventListener('load',function(){setInterval(tick,500);tick();});
})();
</script>
