<style id="hm-premium-shell">

.content{padding:44px 38px 60px!important;max-width:1600px!important}.hero{margin-bottom:26px!important;align-items:center!important}.hero h1{font-size:38px!important;letter-spacing:-1.2px!important;color:#151922!important}.hero p{font-size:14px!important;color:#7c8491!important;margin-top:8px!important}.primary,.save{background:var(--hm-red)!important;border-radius:14px!important;padding:14px 20px!important;font-size:14px!important;box-shadow:0 12px 24px rgba(229,27,35,.20)!important;transition:all .18s ease!important}.primary:hover,.save:hover{background:var(--hm-red-dark)!important;transform:translateY(-2px)!important;box-shadow:0 16px 28px rgba(229,27,35,.24)!important}

</style>
<script>
(function(){
  function e(v){return String(v==null?'':v).replace(/[&<>\'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
  function call(name,args,ok,fail){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(fail||function(x){if(window.toast)toast(x.message||String(x),'err')});return args===undefined?r[name]():r[name].apply(r,args)}
  function projectPage(){
    var c=document.getElementById('content');if(!c)return;
    document.getElementById('crumb').textContent='Workspace / Projects';
    c.innerHTML='<div class="hero"><div><h1>Projects</h1><p>Track active work, ownership, deadlines and project value in one workspace.</p></div><button class="primary" id="hmNewProject">＋ New Project</button></div><div class="grid" id="hmProjectStats"><div class="card stat"><div class="label">Total Projects</div><div class="value">…</div><div class="sub">All projects</div></div><div class="card stat"><div class="label">Active</div><div class="value">…</div><div class="sub green">Currently running</div></div><div class="card stat"><div class="label">Due Soon</div><div class="value">…</div><div class="sub">Next 7 days</div></div><div class="card stat"><div class="label">Project Value</div><div class="value money">…</div><div class="sub">Total project value</div></div></div><div class="card panel"><div class="panel-head"><div><h2>Project Pipeline</h2><p>Every project, its client, owner and current status.</p></div><button class="secondary" id="hmProjectRefresh">↻ Refresh</button></div><div class="toolbar"><input id="hmProjectSearch" placeholder="Search project, client or owner..."><select id="hmProjectStatus"><option value="">All statuses</option><option>Planned</option><option>Active</option><option>On Hold</option><option>Completed</option><option>Cancelled</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Project</th><th>Client</th><th>Owner</th><th>Start</th><th>Deadline</th><th>Value</th><th>Status</th></tr></thead><tbody id="hmProjectRows"><tr><td colspan="7" class="loading">Loading projects...</td></tr></tbody></table></div></div>';
    document.getElementById('hmNewProject').onclick=openProject;document.getElementById('hmProjectRefresh').onclick=loadProjects;document.getElementById('hmProjectSearch').oninput=renderProjects;document.getElementById('hmProjectStatus').onchange=renderProjects;loadProjects();
  }
  function loadProjects(){call('getProjects',undefined,function(data){window.__hmProjects=Array.isArray(data)?data:[];renderProjects();renderStats();},function(err){var x=document.getElementById('hmProjectRows');if(x)x.innerHTML='<tr><td colspan="7" class="loading red">Unable to load projects: '+e(err.message||err)+'</td></tr>'})}
  function renderStats(){var a=window.__hmProjects||[],now=new Date(),next=new Date(now.getTime()+604800000),active=0,due=0,value=0;a.forEach(function(p){var s=String(p.Status||p.status||'');if(s==='Active')active++;value+=Number(p.Value||p.value||p['Project Value']||0);var d=new Date(p.Deadline||p['End Date']||p.endDate);if(!isNaN(d)&&d>=now&&d<=next&&s!=='Completed'&&s!=='Cancelled')due++});var x=document.getElementById('hmProjectStats');if(x)x.innerHTML='<div class="card stat"><div class="label">Total Projects</div><div class="value">'+a.length+'</div><div class="sub">All projects</div></div><div class="card stat"><div class="label">Active</div><div class="value">'+active+'</div><div class="sub green">Currently running</div></div><div class="card stat"><div class="label">Due Soon</div><div class="value">'+due+'</div><div class="sub">Next 7 days</div></div><div class="card stat"><div class="label">Project Value</div><div class="value money">₹'+value.toLocaleString('en-IN')+'</div><div class="sub">Total project value</div></div>'}
  function renderProjects(){var a=window.__hmProjects||[],q=((document.getElementById('hmProjectSearch')||{}).value||'').toLowerCase().trim(),s=((document.getElementById('hmProjectStatus')||{}).value||''),x=document.getElementById('hmProjectRows');if(!x)return;a=a.filter(function(p){var t=[p.Name,p['Project Name'],p.Client,p.ClientName,p.clientName,p.Owner,p.AssignedTo].join(' ').toLowerCase();return(!q||t.indexOf(q)>-1)&&(!s||String(p.Status||p.status||'')===s)});if(!a.length){x.innerHTML='<tr><td colspan="7" class="empty">No projects match your filters.</td></tr>';return}x.innerHTML=a.map(function(p){var st=String(p.Status||p.status||'Planned'),cl=st==='Active'?'green':st==='On Hold'?'orange':st==='Cancelled'?'red':'';return '<tr><td><strong>'+e(p.Name||p['Project Name']||p.ID||'Untitled')+'</strong><div class="sub">'+e(p.ID||'')+'</div></td><td>'+e(p.Client||p.ClientName||p.clientName||'-')+'</td><td>'+e(p.Owner||p.AssignedTo||p['Assigned To']||'-')+'</td><td>'+e(p['Start Date']||p.StartDate||p.Start||p.startDate||'-')+'</td><td>'+e(p.Deadline||p['End Date']||p.EndDate||p.endDate||'-')+'</td><td>₹'+Number(p.Value||p.value||p['Project Value']||0).toLocaleString('en-IN')+'</td><td><span class="status '+cl+'">'+e(st)+'</span></td></tr>'}).join('')}
  function openProject(){call('getClients',undefined,function(clients){var opts=(clients||[]).map(function(c){var id=c['Client ID']||c.ID||c.clientId||'';var name=c['Business Name']||c['Client Name']||c.Name||id;return '<option value="'+e(id)+'">'+e(name)+'</option>'}).join('');document.getElementById('modalTitle').textContent='New Project';document.getElementById('modalBody').innerHTML='<form id="hmProjectForm"><div class="form-grid"><div class="field"><label>Project Name *</label><input id="hmPN" required placeholder="e.g. Instagram Growth Campaign"></div><div class="field"><label>Client *</label><select id="hmPC" required><option value="">Select client</option>'+opts+'</select></div><div class="field"><label>Status</label><select id="hmPS"><option>Planned</option><option>Active</option><option>On Hold</option><option>Completed</option><option>Cancelled</option></select></div><div class="field"><label>Project Value</label><input id="hmPV" type="text" inputmode="decimal" placeholder="₹ 0" oninput="this.value=this.value.replace(/[^0-9,]/g,\'\')"><div class="sub">Total agreed project value. Payments are tracked separately.</div></div><div class="field"><label>Start Date</label><input id="hmPStart" type="date"></div><div class="field"><label>Deadline</label><input id="hmPEnd" type="date"></div><div class="field"><label>Owner / Assignee</label><input id="hmPOwner" placeholder="Team member"></div><div class="field full"><label>Notes</label><textarea id="hmPNotes" placeholder="Project scope, priorities or internal notes"></textarea></div></div><div class="form-actions"><button class="save" type="submit">Create Project</button></div></form>';document.getElementById('hmProjectForm').onsubmit=saveProject;document.getElementById('modalBg').classList.add('show')},function(err){if(window.toast)toast(err.message||String(err),'err')})}
  function saveProject(ev){ev.preventDefault();var raw=document.getElementById('hmPV').value.replace(/,/g,'').trim(),value=raw===''?0:Number(raw);if(!isFinite(value)||value<0){toast('Enter a valid project value.','err');return}var data={Name:document.getElementById('hmPN').value.trim(),ClientID:document.getElementById('hmPC').value,Status:document.getElementById('hmPS').value,Value:value,StartDate:document.getElementById('hmPStart').value,Deadline:document.getElementById('hmPEnd').value,Owner:document.getElementById('hmPOwner').value.trim(),Notes:document.getElementById('hmPNotes').value.trim()};call('createProject',[data],function(){closeModal();toast('Project created successfully.','ok');loadProjects()},function(err){toast(err.message||String(err),'err')})}
  function bindProjects(){var b=document.querySelector('.nav button[data-page="projects"]');if(!b)return;b.onclick=function(ev){ev.preventDefault();document.querySelectorAll('.nav button').forEach(function(x){x.classList.toggle('active',x===b)});history.replaceState({},'',location.pathname+'?page=projects');projectPage()};}
  window.addEventListener('load',function(){bindProjects();var p=new URLSearchParams(location.search).get('page');if(p==='projects')projectPage()});
})();
</script>
<script>
(function(){
  function e(v){return String(v==null?'':v).replace(/[&<>\'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
  function call(name,args,ok,fail){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(fail||function(x){if(window.toast)toast(x.message||String(x),'err')});return args===undefined?r[name]():r[name].apply(r,args)}
  var ds=[];
  function deliverablesPage(){
    var c=document.getElementById('content');if(!c)return;
    document.getElementById('crumb').textContent='Workspace / Deliverables';
    c.innerHTML='<div class="hero"><div><h1>Deliverables</h1><p>Turn projects into clear, trackable outputs with ownership and status.</p></div><button class="primary" id="hmNewDeliverable">＋ New Deliverable</button></div><div class="grid" id="hmDelStats"><div class="card stat"><div class="label">Total Deliverables</div><div class="value">…</div><div class="sub">Across projects</div></div><div class="card stat"><div class="label">In Progress</div><div class="value">…</div><div class="sub green">Currently active</div></div><div class="card stat"><div class="label">Completed</div><div class="value">…</div><div class="sub">Finished outputs</div></div><div class="card stat"><div class="label">Quantity</div><div class="value">…</div><div class="sub">Total planned units</div></div></div><div class="card panel"><div class="panel-head"><div><h2>Deliverable Tracker</h2><p>Every output linked to a project.</p></div><button class="secondary" id="hmDelRefresh">↻ Refresh</button></div><div class="toolbar"><input id="hmDelSearch" placeholder="Search project or deliverable type..."><select id="hmDelStatus"><option value="">All statuses</option><option>Planned</option><option>In Progress</option><option>Completed</option><option>On Hold</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Deliverable</th><th>Project</th><th>Quantity</th><th>Status</th><th>Action</th></tr></thead><tbody id="hmDelRows"><tr><td colspan="5" class="loading">Loading deliverables...</td></tr></tbody></table></div></div>';
    document.getElementById('hmNewDeliverable').onclick=openDeliverable;document.getElementById('hmDelRefresh').onclick=loadDeliverables;document.getElementById('hmDelSearch').oninput=renderDeliverables;document.getElementById('hmDelStatus').onchange=renderDeliverables;loadDeliverables();
  }
  function loadDeliverables(){call('getProjects',undefined,function(projects){window.__hmDelProjects=Array.isArray(projects)?projects:[];var jobs=window.__hmDelProjects.map(function(p){var id=p['Project ID']||p.ID||p.id;return new Promise(function(resolve){call('getDeliverables',[id],function(rows){(rows||[]).forEach(function(r){r.__projectName=p['Project Name']||p.Name||id;r.__projectId=id});resolve(rows||[])},function(){resolve([])})})});Promise.all(jobs).then(function(groups){ds=[].concat.apply([],groups);renderDeliverables();renderDelStats()})},function(err){toast(err.message||String(err),'err')})}
  function renderDelStats(){var total=ds.length,inprog=ds.filter(function(x){return String(x.Status)==='In Progress'}).length,done=ds.filter(function(x){return String(x.Status)==='Completed'}).length,qty=ds.reduce(function(n,x){return n+(Number(x.Quantity)||0)},0);var x=document.getElementById('hmDelStats');if(x)x.innerHTML='<div class="card stat"><div class="label">Total Deliverables</div><div class="value">'+total+'</div><div class="sub">Across projects</div></div><div class="card stat"><div class="label">In Progress</div><div class="value">'+inprog+'</div><div class="sub green">Currently active</div></div><div class="card stat"><div class="label">Completed</div><div class="value">'+done+'</div><div class="sub">Finished outputs</div></div><div class="card stat"><div class="label">Quantity</div><div class="value">'+qty+'</div><div class="sub">Total planned units</div></div>'}
  function renderDeliverables(){var q=((document.getElementById('hmDelSearch')||{}).value||'').toLowerCase().trim(),s=((document.getElementById('hmDelStatus')||{}).value||''),a=ds.filter(function(x){var t=[x.Type,x['Deliverable ID'],x.__projectName].join(' ').toLowerCase();return(!q||t.indexOf(q)>-1)&&(!s||String(x.Status||'')===s)}),x=document.getElementById('hmDelRows');if(!x)return;if(!a.length){x.innerHTML='<tr><td colspan="5" class="empty">No deliverables match your filters.</td></tr>';return}x.innerHTML=a.map(function(d){var st=String(d.Status||'Planned'),cl=st==='Completed'?'green':st==='On Hold'?'orange':'';return '<tr><td><strong>'+e(d.Type||'Untitled')+'</strong><div class="sub">'+e(d['Deliverable ID']||'')+'</div></td><td>'+e(d.__projectName||d['Project ID']||'-')+'</td><td>'+Number(d.Quantity||0)+'</td><td><span class="status '+cl+'">'+e(st)+'</span></td><td><select onchange="window.hmUpdateDeliverable(this.value,\''+e(d['Deliverable ID'])+'\')"><option value="">Change status</option><option>Planned</option><option>In Progress</option><option>Completed</option><option>On Hold</option></select></td></tr>'}).join('')}
  window.hmUpdateDeliverable=function(status,id){if(!status)return;call('updateDeliverableStatus',[id,status],function(){toast('Deliverable status updated.','ok');loadDeliverables()},function(err){toast(err.message||String(err),'err')})}
  function openDeliverable(){call('getProjects',undefined,function(projects){var opts=(projects||[]).map(function(p){var id=p['Project ID']||p.ID||p.id||'';var name=p['Project Name']||p.Name||id;return '<option value="'+e(id)+'">'+e(name)+'</option>'}).join('');document.getElementById('modalTitle').textContent='New Deliverable';document.getElementById('modalBody').innerHTML='<form id="hmDelForm"><div class="form-grid"><div class="field full"><label>Project *</label><select id="hmDelProject" required><option value="">Select project</option>'+opts+'</select></div><div class="field"><label>Deliverable Type *</label><input id="hmDelType" required placeholder="e.g. Instagram Reel"></div><div class="field"><label>Quantity</label><input id="hmDelQty" type="number" min="1" step="1" value="1"></div><div class="field"><label>Status</label><select id="hmDelSt"><option>Planned</option><option>In Progress</option><option>Completed</option><option>On Hold</option></select></div></div><div class="form-actions"><button class="save" type="submit">Create Deliverable</button></div></form>';document.getElementById('hmDelForm').onsubmit=saveDeliverable;document.getElementById('modalBg').classList.add('show')},function(err){toast(err.message||String(err),'err')})}
  function saveDeliverable(ev){ev.preventDefault();var qty=Math.max(1,parseInt(document.getElementById('hmDelQty').value,10)||1),data={projectId:document.getElementById('hmDelProject').value,type:document.getElementById('hmDelType').value.trim(),quantity:qty,status:document.getElementById('hmDelSt').value};if(!data.projectId||!data.type){toast('Project and deliverable type are required.','err');return}call('createDeliverable',[data],function(){closeModal();toast('Deliverable created successfully.','ok');loadDeliverables()},function(err){toast(err.message||String(err),'err')})}
  function bindDeliverables(){var b=document.querySelector('.nav button[data-page="deliverables"]');if(!b)return;b.onclick=function(ev){ev.preventDefault();document.querySelectorAll('.nav button').forEach(function(x){x.classList.toggle('active',x===b)});history.replaceState({},'',location.pathname+'?page=deliverables');deliverablesPage()}}
  window.addEventListener('load',function(){bindDeliverables();var p=new URLSearchParams(location.search).get('page');if(p==='deliverables')deliverablesPage()});
})();
</script>
