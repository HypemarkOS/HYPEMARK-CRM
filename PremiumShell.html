<style id="hm-premium-shell">
:root{--hm-red:#e51b23;--hm-red-dark:#c91018;--hm-bg:#f5f6f8;--hm-black:#0b0f14}
html,body{background:var(--hm-bg)!important;color:#151922!important;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif!important}
.side{width:304px!important;background:linear-gradient(180deg,#080b10,#0d1117 58%,#090c11)!important;padding:18px 16px 16px!important;box-shadow:12px 0 30px rgba(0,0,0,.08)!important}
.brand{height:184px!important;width:100%!important;margin:0 0 16px!important;padding:0!important;display:flex!important;align-items:center!important;justify-content:center!important;overflow:hidden!important;border-radius:24px!important;background:#fff!important;box-shadow:0 12px 30px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.9)!important;font-size:0!important;color:transparent!important}
.nav{gap:6px!important}.nav button{height:48px!important;border-radius:14px!important;padding:0 14px!important;color:#b9c0cb!important;font-size:14px!important;font-weight:650!important;transition:all .18s ease!important}.nav button:hover{background:rgba(255,255,255,.055)!important;color:#fff!important;transform:translateX(2px)}.nav button.active{background:linear-gradient(90deg,#e51b23,#d9141d)!important;color:#fff!important;box-shadow:0 10px 24px rgba(229,27,35,.22)!important}
.section{padding:20px 12px 7px!important;color:#687180!important;font-size:10px!important;letter-spacing:1.5px!important}.foot{color:#5d6673!important;padding:14px 10px 2px!important}
.main{margin-left:304px!important}.top{height:86px!important;padding:0 36px!important;background:rgba(255,255,255,.97)!important;border-bottom:1px solid #e8eaee!important}.crumb{font-size:12px!important;color:#7c8491!important}.title{font-size:25px!important;font-weight:850!important;color:#171b23!important}.search{width:280px!important;height:48px!important;border-radius:14px!important;background:#f7f8fa!important;border:1px solid #e4e7eb!important;font-size:15px!important}.user{height:44px!important;display:flex!important;align-items:center!important;background:#fff!important;border:1px solid #e4e7eb!important;padding:0 16px!important;border-radius:24px!important;font-size:12px!important;color:#6f7785!important;box-shadow:0 3px 12px rgba(0,0,0,.04)!important}
.content{padding:44px 38px 60px!important;max-width:1600px!important}.hero{margin-bottom:26px!important;align-items:center!important}.hero h1{font-size:38px!important;letter-spacing:-1.2px!important;color:#151922!important}.hero p{font-size:14px!important;color:#7c8491!important;margin-top:8px!important}.primary,.save{background:var(--hm-red)!important;border-radius:14px!important;padding:14px 20px!important;font-size:14px!important;box-shadow:0 12px 24px rgba(229,27,35,.20)!important;transition:all .18s ease!important}.primary:hover,.save:hover{background:var(--hm-red-dark)!important;transform:translateY(-2px)!important;box-shadow:0 16px 28px rgba(229,27,35,.24)!important}
.grid{gap:16px!important;margin-bottom:22px!important}.card{border:1px solid #e4e7eb!important;border-radius:18px!important;box-shadow:0 10px 30px rgba(16,24,40,.045)!important;background:#fff!important}.stat{padding:22px!important;min-height:128px}.label{font-size:10px!important;letter-spacing:1px!important}.value{font-size:32px!important;margin-top:13px!important}.sub{font-size:11px!important;margin-top:7px!important}.panels{gap:22px!important}.panel{padding:24px!important}.panel h2{font-size:19px!important}.panel p{font-size:12px!important;margin:7px 0 20px!important}.profit-row{padding:14px 8px!important;font-size:12px!important}.profit-head{font-size:10px!important}.pill{padding:5px 9px!important}.alert{padding:13px 14px!important;border-radius:12px!important}.activity .act{padding:13px 4px!important;font-size:12px!important}.activity .act small{font-size:10px!important}.loading{padding:36px!important}
@media(max-width:1050px){.side{width:260px!important}.main{margin-left:260px!important}.grid{grid-template-columns:1fr 1fr!important}.top{padding:0 24px!important}.content{padding:30px 24px 50px!important}}
@media(max-width:700px){.side{width:76px!important;padding:12px 8px!important}.brand{height:76px!important;border-radius:18px!important;margin-bottom:12px!important}.nav button{font-size:0!important;text-align:center!important;padding:0!important}.section,.foot{display:none!important}.main{margin-left:76px!important}.top{padding:0 14px!important;height:68px!important}.top-actions .search,.user{display:none!important}.content{padding:22px 14px 40px!important}.grid{grid-template-columns:1fr 1fr!important}.hero{align-items:flex-start!important}.hero h1{font-size:28px!important}}
</style>
<script>
(function(){
  function escP(v){return String(v==null?'':v).replace(/[&<>\'\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
  function runP(name,args,ok,err){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(err||function(e){if(window.toast)toast(e.message||String(e),'err')});return args===undefined?r[name]():r[name].apply(r,args)}
  function projectsPage(){
    var c=document.getElementById('content'); if(!c)return;
    document.getElementById('crumb').textContent='Workspace / Projects';
    c.innerHTML='<div class="hero"><div><h1>Projects</h1><p>Track active work, ownership, deadlines and project value in one workspace.</p></div><button class="primary" onclick="hmOpenProject()">＋ New Project</button></div>'+
      '<div class="grid" id="hmProjectStats"><div class="card stat"><div class="label">Total Projects</div><div class="value">…</div><div class="sub">All projects</div></div><div class="card stat"><div class="label">Active</div><div class="value">…</div><div class="sub green">Currently running</div></div><div class="card stat"><div class="label">Due Soon</div><div class="value">…</div><div class="sub">Next 7 days</div></div><div class="card stat"><div class="label">Project Value</div><div class="value money">…</div><div class="sub">Total project value</div></div></div>'+
      '<div class="card panel"><div class="panel-head"><div><h2>Project Pipeline</h2><p>Every project, its client, owner and current status.</p></div><button class="secondary" onclick="hmLoadProjects()">↻ Refresh</button></div><div class="toolbar"><input id="hmProjectSearch" placeholder="Search project, client or owner..." oninput="hmRenderProjects()"><select id="hmProjectStatus" onchange="hmRenderProjects()"><option value="">All statuses</option><option>Planned</option><option>Active</option><option>On Hold</option><option>Completed</option><option>Cancelled</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Project</th><th>Client</th><th>Owner</th><th>Start</th><th>Deadline</th><th>Value</th><th>Status</th></tr></thead><tbody id="hmProjectRows"><tr><td colspan="7" class="empty">Loading projects...</td></tr></tbody></table></div></div>';
    window.hmProjects=[]; hmLoadProjects();
  }
  window.hmLoadProjects=function(){runP('getProjects',undefined,function(data){window.hmProjects=Array.isArray(data)?data:[];hmRenderProjects();hmRenderProjectStats();},function(e){var el=document.getElementById('hmProjectRows');if(el)el.innerHTML='<tr><td colspan="7" class="empty">Unable to load projects: '+escP(e.message||e)+'</td></tr>'})};
  window.hmRenderProjectStats=function(){var a=window.hmProjects||[], now=new Date(), next=new Date(now.getTime()+7*86400000), active=0,due=0,value=0;a.forEach(function(p){var s=String(p.Status||p.status||'');if(s==='Active')active++;value+=Number(p.Value||p.value||p['Project Value']||0);var d=new Date(p.Deadline||p['End Date']||p.endDate);if(!isNaN(d)&&d>=now&&d<=next&&s!=='Completed'&&s!=='Cancelled')due++;});var x=document.getElementById('hmProjectStats');if(x)x.innerHTML='<div class="card stat"><div class="label">Total Projects</div><div class="value">'+a.length+'</div><div class="sub">All projects</div></div><div class="card stat"><div class="label">Active</div><div class="value">'+active+'</div><div class="sub green">Currently running</div></div><div class="card stat"><div class="label">Due Soon</div><div class="value">'+due+'</div><div class="sub">Next 7 days</div></div><div class="card stat"><div class="label">Project Value</div><div class="value money">₹'+value.toLocaleString('en-IN')+'</div><div class="sub">Total project value</div></div>'};
  window.hmRenderProjects=function(){var a=window.hmProjects||[],q=(document.getElementById('hmProjectSearch')||{}).value||'',s=(document.getElementById('hmProjectStatus')||{}).value||'';q=q.toLowerCase();a=a.filter(function(p){var text=[p.Name,p['Project Name'],p.Client,p.clientName,p.Owner,p.AssignedTo].join(' ').toLowerCase();return (!q||text.indexOf(q)>=0)&&(!s||String(p.Status||p.status||'')===s)});var el=document.getElementById('hmProjectRows');if(!el)return;if(!a.length){el.innerHTML='<tr><td colspan="7" class="empty">No projects match your filters.</td></tr>';return}el.innerHTML=a.map(function(p){var st=String(p.Status||p.status||'Planned'), cls=st==='Active'?'green':(st==='On Hold'?'orange':(st==='Cancelled'?'red':''));return '<tr><td><strong>'+escP(p.Name||p['Project Name']||p.ID||'Untitled')+'</strong><div class="sub">'+escP(p.ID||'')+'</div></td><td>'+escP(p.Client||p.clientName||p.ClientName||'-')+'</td><td>'+escP(p.Owner||p.AssignedTo||p['Assigned To']||'-')+'</td><td>'+escP(p['Start Date']||p.Start||p.startDate||'-')+'</td><td>'+escP(p.Deadline||p['End Date']||p.endDate||'-')+'</td><td>'+('₹'+Number(p.Value||p.value||p['Project Value']||0).toLocaleString('en-IN'))+'</td><td><span class="status '+cls+'">'+escP(st)+'</span></td></tr>'}).join('')};
  window.hmOpenProject=function(){
    var clients=[]; runP('getClients',undefined,function(a){clients=a||[];var opts=clients.map(function(c){return '<option value="'+escP(c.ID||c['Client ID']||c.clientId||'')+'">'+escP(c['Business Name']||c.Name||c['Client Name']||'Client')+'</option>'}).join('');document.getElementById('modalTitle').textContent='New Project';document.getElementById('modalBody').innerHTML='<form onsubmit="hmSaveProject(event)"><div class="form-grid"><div class="field"><label>Project Name *</label><input id="hmPName" required placeholder="e.g. Instagram Growth Campaign"></div><div class="field"><label>Client *</label><select id="hmPClient" required><option value="">Select client</option>'+opts+'</select></div><div class="field"><label>Status</label><select id="hmPStatus"><option>Planned</option><option>Active</option><option>On Hold</option><option>Completed</option><option>Cancelled</option></select></div><div class="field"><label>Project Value</label><input id="hmPValue" type="text" inputmode="decimal" autocomplete="off" pattern="[0-9,]*" placeholder="₹ 0" oninput="this.value=this.value.replace(/[^0-9,]/g,'')"></div><div class="field"><label>Start Date</label><input id="hmPStart" type="date"></div><div class="field"><label>Deadline</label><input id="hmPEnd" type="date"></div><div class="field"><label>Owner / Assignee</label><input id="hmPOwner" placeholder="Team member"></div><div class="field full"><label>Notes</label><textarea id="hmPNotes" placeholder="Project scope, priorities or internal notes"></textarea></div></div><div class="form-actions"><button type="submit" class="save">Create Project</button></div></form>';document.getElementById('modalBg').classList.add('show');},function(e){if(window.toast)toast(e.message||String(e),'err')});
  };
  window.hmSaveProject=function(e){e.preventDefault();var raw=document.getElementById('hmPValue').value.replace(/,/g,'').trim();var value=raw===''?0:Number(raw);if(!Number.isFinite(value)||value<0){if(window.toast)toast('Enter a valid project value','err');return}var data={Name:document.getElementById('hmPName').value.trim(),ClientID:document.getElementById('hmPClient').value,Status:document.getElementById('hmPStatus').value,Value:value,StartDate:document.getElementById('hmPStart').value,Deadline:document.getElementById('hmPEnd').value,Owner:document.getElementById('hmPOwner').value.trim(),Notes:document.getElementById('hmPNotes').value.trim()};runP('createProject',[data],function(){if(window.closeModal)closeModal();if(window.toast)toast('Project created','ok');hmLoadProjects()},function(e){if(window.toast)toast(e.message||String(e),'err')})};
  window.addEventListener('load',function(){var oldShow=window.show;window.show=function(page){if(page==='projects'){document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('active',b.dataset.page===page)});projectsPage();return}return oldShow.apply(this,arguments)}});
})();
</script>
