<script>
(function(){
  'use strict';
  function showMessage(message,type){
    if(typeof window.toast==='function'){
      window.toast(message,type||'err');
    }else{
      alert(message);
    }
  }
  function buildData(){
    return {
      title:(document.getElementById('hmEditTitle')||{}).value||'',
      platform:(document.getElementById('hmEditPlatform')||{}).value||'',
      contentType:(document.getElementById('hmEditType')||{}).value||'',
      creativeBrief:(document.getElementById('hmEditBrief')||{}).value||'',
      assetsInstructions:(document.getElementById('hmEditAssets')||{}).value||'',
      status:(document.getElementById('hmEditStatus')||{}).value||'',
      priority:(document.getElementById('hmEditPriority')||{}).value||'',
      assignedTo:(document.getElementById('hmEditAssigned')||{}).value||'',
      publishDate:(document.getElementById('hmEditPublish')||{}).value||''
    };
  }
  function directSave(btn,id){
    if(!window.google||!google.script||!google.script.run){showMessage('CRM connection is unavailable. Please refresh and try again.','err');return;}
    if(!id){showMessage('Content ID is missing. Refresh Content Bank and reopen the item.','err');return;}
    btn.disabled=true;btn.textContent='Saving...';
    google.script.run
      .withSuccessHandler(function(updated){
        btn.disabled=false;btn.textContent='Save Changes';
        showMessage('Content updated successfully.','ok');
        if(typeof window.closeModal==='function')window.closeModal();
        if(window.__hmContent&&updated){window.__hmContent=window.__hmContent.map(function(x){return String(x['Content ID'])===String(id)?updated:x;});}
        if(typeof window.renderContent==='function')window.renderContent();
        else if(typeof window.contentBank==='function')window.contentBank();
      })
      .withFailureHandler(function(e){
        btn.disabled=false;btn.textContent='Save Changes';
        var msg='Unable to save content: '+(e&&e.message?e.message:String(e));
        showMessage(msg,'err');
        console.error('Content save failed:',e);
      })
      .updateContent(id,buildData());
  }
  function wire(){
    var btn=document.getElementById('hmSaveContent');
    if(!btn||btn.__hmDirectSave)return;
    btn.__hmDirectSave=true;
    btn.style.pointerEvents='auto';
    btn.style.position='relative';
    btn.style.zIndex='99999';
    btn.onclick=function(ev){
      if(ev){ev.preventDefault();ev.stopImmediatePropagation();}
      directSave(btn,btn.getAttribute('data-content-id'));
    };
  }
  function start(){
    wire();
    var observer=new MutationObserver(wire);
    if(document.body)observer.observe(document.body,{childList:true,subtree:true});
    setInterval(wire,300);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
