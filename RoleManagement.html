<script>
(function(){
  var JOBS=['SMM','Editor','DOP','Graphic Designer','DOP + Editor'];
  function esc(v){return String(v==null?'':v).replace(/[&<>\'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]});}
  function run(n,a,ok,fail){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(fail||function(e){alert(e.message||e)});return a===undefined?r[n]():r[n].apply(r,a);}
  function panel(ctx){if(!ctx||ctx.role!=='Admin'||document.getElementById('hmRolePanel'))return;var host=document.getElementById('content');if(!host)return;var wrap=document.createElement('div');wrap.id='hmRolePanel';wrap.className='card panel';wrap.style.marginTop='17px';wrap.innerHTML='<div class="panel-head"><div><h2>User Roles & Job Functions</h2><p>Only Admin can change system roles. Employee Job Function controls operational access.</p></div></div><div id="hmRoleRows" class="activity">Loading users...</div>';host.appendChild(wrap);load();}
  function load(){run('getUsers',undefined,function(users){var box=document.getElementById('hmRoleRows');if(!box)return;if(!users.length){box.innerHTML='<div class="empty">No users found.</div>';return;}box.innerHTML=users.map(function(u,i){var role=String(u.Role||'Employee'),job=String(u['Job Function']||'');return '<div class="act" style="display:grid;grid-template-columns:1.2fr 1.1fr 1.3fr 1fr auto;gap:8px;align-items:center"><div><strong>'+esc(u.Name)+'</strong><small>'+esc(u.Email)+'</small></div><select id="hmRole'+i+'"><option>Admin</option><option>Partner</option><option>Employee</option></select><select id="hmJob'+i+'"><option value="">Not applicable</option>'+JOBS.map(function(j){return '<option>'+j+'</option>';}).join('')+'</select><select id="hmStatus'+i+'"><option>Active</option><option>Inactive</option></select><button class="primary" style="padding:7px 10px" onclick="window.hmSaveRole('+i+')">Save</button></div>';}).join('');users.forEach(function(u,i){document.getElementById('hmRole'+i).value=String(u.Role||'Employee')==='Manager'?'Employee':String(u.Role||'Employee');document.getElementById('hmJob'+i).value=String(u['Job Function']||'');document.getElementById('hmStatus'+i).value=String(u.Status||'Active');});box._users=users;});}
  window.hmSaveRole=function(i){var box=document.getElementById('hmRoleRows'),u=box&&box._users?box._users[i]:null;if(!u)return;var role=document.getElementById('hmRole'+i).value,job=document.getElementById('hmJob'+i).value,status=document.getElementById('hmStatus'+i).value;run('saveUser',[{name:u.Name,email:u.Email,role:role,jobFunction:job,status:status}],function(){alert('User access updated.');load();});};
  function watch(ctx){if(ctx.role!=='Admin')return;var last='';setInterval(function(){var c=document.getElementById('content');if(!c)return;var sig=(document.getElementById('crumb')||{}).textContent||'';if(/Settings/i.test(sig)&&sig!==last){last=sig;panel(ctx);}},500);}
  function init(){run('getAuthContext',undefined,function(ctx){watch(ctx);});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
