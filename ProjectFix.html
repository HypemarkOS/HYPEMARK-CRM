<script id="hm-project-create-fix">
(function(){
  function message(err){return err&&err.message?err.message:String(err||'Unknown error');}
  function showProjectError(text){
    var modalBody=document.getElementById('modalBody');
    if(!modalBody)return;
    var old=document.getElementById('hmProjectCreateError');
    if(!old){old=document.createElement('div');old.id='hmProjectCreateError';old.style.cssText='margin-top:14px;padding:12px 14px;border-radius:10px;background:#fff0f1;color:#c91018;font-size:13px;border:1px solid #ffd0d3';var form=document.getElementById('hmProjectForm');if(form)form.appendChild(old);}
    old.textContent=text;old.style.display='block';
  }
  function saveProjectFixed(ev){
    ev.preventDefault();
    var button=ev.submitter||document.querySelector('#hmProjectForm .save');
    var raw=(document.getElementById('hmPV')||{}).value||'';
    raw=String(raw).replace(/,/g,'').trim();
    var value=raw===''?0:Number(raw);
    if(!isFinite(value)||value<0){showProjectError('Enter a valid project value.');return false;}
    var data={
      projectName:(document.getElementById('hmPN')||{}).value||'',
      clientId:(document.getElementById('hmPC')||{}).value||'',
      status:(document.getElementById('hmPS')||{}).value||'Planned',
      projectValue:value,
      startDate:(document.getElementById('hmPStart')||{}).value||'',
      dueDate:(document.getElementById('hmPEnd')||{}).value||'',
      owner:(document.getElementById('hmPOwner')||{}).value||'',
      notes:(document.getElementById('hmPNotes')||{}).value||''
    };
    if(!data.projectName.trim()){showProjectError('Project Name is required.');return false;}
    if(!data.clientId){showProjectError('Client is required.');return false;}
    if(button){button.disabled=true;button.textContent='Creating...';}
    showProjectError('');
    google.script.run
      .withSuccessHandler(function(saved){
        if(typeof closeModal==='function')closeModal();
        if(window.toast)toast('Project created successfully.','ok');
        if(typeof loadProjects==='function')loadProjects();
      })
      .withFailureHandler(function(err){
        if(button){button.disabled=false;button.textContent='Create Project';}
        showProjectError('Unable to create project: '+message(err));
      })
      .createProject(data);
    return false;
  }
  function patch(){
    var form=document.getElementById('hmProjectForm');
    if(!form)return;
    if(form.__hmProjectFixInstalled)return;
    form.__hmProjectFixInstalled=true;
    form.onsubmit=saveProjectFixed;
    form.addEventListener('submit',saveProjectFixed,true);
  }
  function watch(){
    patch();
    if(document.body&&!window.__hmProjectFixObserver){
      window.__hmProjectFixObserver=new MutationObserver(function(){patch();});
      window.__hmProjectFixObserver.observe(document.body,{childList:true,subtree:true});
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',watch);else watch();
  window.addEventListener('load',watch);
})();
</script>
