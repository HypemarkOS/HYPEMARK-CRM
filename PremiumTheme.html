<style id="hm-premium-theme">
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');
:root{--ink:#14171d;--muted:#747b87;--line:#e9ebef;--surface:#fff;--soft:#f5f6f8;--brand:#d71920;--brand-dark:#a90f15;--brand-soft:#fff0f1;--green:#16a673;--orange:#e68a19;--red:#d71920;--nav:#090b0f;--shadow:0 14px 40px rgba(15,18,24,.07);--shadow-hover:0 20px 55px rgba(15,18,24,.12)}
html,body,button,input,select,textarea{font-family:'DM Sans',Inter,system-ui,-apple-system,'Segoe UI',Arial,sans-serif}body{background:linear-gradient(135deg,#f7f7f8,#f1f2f4)!important;color:var(--ink)!important}.app{background:transparent}.side{width:260px!important;background:linear-gradient(180deg,#080a0e,#111419 55%,#080a0e)!important;border-right:1px solid rgba(255,255,255,.07);box-shadow:12px 0 35px rgba(0,0,0,.1);padding:12px 14px 16px!important}.brand{height:124px!important;padding:6px 8px 12px!important;display:flex;align-items:center;justify-content:center;position:relative;font-size:0!important;overflow:visible}.brand:before{content:"";position:absolute;width:170px;height:34px;bottom:5px;border-radius:50%;background:radial-gradient(ellipse,rgba(215,25,32,.32),rgba(215,25,32,.08) 45%,transparent 72%);filter:blur(8px)}.brand:after{content:"";position:absolute;width:190px;height:116px;top:3px;border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.07),transparent 50%,rgba(215,25,32,.06));border:1px solid rgba(255,255,255,.05);pointer-events:none}.hm-logo{position:relative;z-index:2;width:176px!important;height:auto!important;max-height:112px;display:block;object-fit:contain;border-radius:12px;box-shadow:0 13px 28px rgba(0,0,0,.36),0 0 22px rgba(215,25,32,.12);transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s ease}.brand:hover .hm-logo{transform:perspective(700px) rotateY(-4deg) rotateX(1deg) translateY(-2px) scale(1.015);box-shadow:0 18px 34px rgba(0,0,0,.42),0 0 28px rgba(215,25,32,.22)}.nav{gap:5px!important}.section{color:#676d77!important;letter-spacing:1.5px!important;padding:16px 12px 6px!important}.nav button{color:#aeb3bd!important;padding:12px 13px!important;border-radius:11px!important;font-weight:600!important;transition:.25s ease}.nav button:hover{background:rgba(255,255,255,.055)!important;color:#fff!important;transform:translateX(3px)}.nav button.active{color:#fff!important;background:linear-gradient(90deg,#d71920,#b90f15)!important;box-shadow:0 8px 22px rgba(215,25,32,.25)!important}.foot{color:#5f646e!important}.main{margin-left:260px!important}.top{height:76px!important;padding:0 34px!important;background:rgba(255,255,255,.88)!important;border-bottom:1px solid rgba(220,223,228,.8)!important;box-shadow:0 8px 30px rgba(20,23,29,.035)}.title,.hero h1,.panel h2,.value{font-family:'Manrope',sans-serif!important}.title{font-weight:800!important}.search{width:330px!important;height:42px!important;border-radius:12px!important;background:#f7f7f8!important;border:1px solid #e5e7eb!important;transition:.25s ease}.search:focus{background:#fff!important;border-color:#d71920!important;box-shadow:0 0 0 4px rgba(215,25,32,.08)}.user{background:#fff!important;border:1px solid #e7e8eb!important;border-radius:999px!important;box-shadow:0 4px 14px rgba(20,23,29,.04);font-weight:600!important}.content{padding:34px!important;max-width:1650px!important}.hero{animation:hmFadeUp .5s ease both;margin-bottom:24px!important}.hero h1{font-size:32px!important;letter-spacing:-1.2px!important}.hero p{font-size:12px!important;color:#7b818b!important}.primary,.save{background:linear-gradient(135deg,#e01b22,#c61017)!important;border-radius:11px!important;box-shadow:0 10px 25px rgba(215,25,32,.2)!important;transition:.22s ease!important}.primary:hover,.save:hover{transform:translateY(-2px)!important;box-shadow:0 15px 32px rgba(215,25,32,.28)!important}.card{border:1px solid rgba(224,226,230,.95)!important;border-radius:17px!important;box-shadow:var(--shadow)!important;transition:.28s ease!important}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)!important}.stat{padding:20px!important;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;right:-34px;top:-38px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(215,25,32,.08),transparent 68%);pointer-events:none}.label{font-size:9px!important;letter-spacing:1px!important}.value{font-size:28px!important;letter-spacing:-.7px!important}.panels{gap:20px!important}.panel{padding:22px!important}.panel h2{font-size:16px!important}.table th{background:#f8f8f9!important}.table tr{transition:.18s ease}.table tr:hover{background:#fff5f5!important}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border-radius:11px!important;border-color:#e2e4e8!important;transition:.2s ease}.toolbar input:focus,.toolbar select:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#d71920!important;box-shadow:0 0 0 4px rgba(215,25,32,.07)!important}.tab{border-radius:999px!important;transition:.2s ease!important}.tab:hover{transform:translateY(-1px)}.tab.active{background:#fff0f1!important;color:#c61017!important;border-color:#f0b7ba!important}.modal-bg{background:rgba(7,9,13,.62)!important;backdrop-filter:blur(8px);animation:hmOverlay .25s ease}.modal{border-radius:20px!important;box-shadow:0 30px 90px rgba(0,0,0,.25)!important;animation:hmModal .35s cubic-bezier(.2,.8,.2,1)}.close{transition:.2s ease}.close:hover{transform:rotate(90deg);background:#ffe7e8;color:#b20e14}.toast{border-radius:12px!important;box-shadow:0 14px 35px rgba(0,0,0,.18)!important;animation:hmToast .35s ease}.status,.pill{transition:.18s ease}.status:hover,.pill:hover{transform:scale(1.04)}.page-enter{animation:hmFadeUp .38s cubic-bezier(.2,.8,.2,1) both}.hm-ripple{position:absolute;border-radius:999px;background:rgba(255,255,255,.35);transform:scale(0);animation:hmRipple .55s ease-out;pointer-events:none}.hm-toggle{width:46px;height:26px;border-radius:999px;border:1px solid #d8dbe0;background:#dfe2e6;display:inline-flex;align-items:center;padding:3px;cursor:pointer;transition:.25s ease}.hm-toggle i{width:18px;height:18px;background:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.16);transition:.25s ease}.hm-toggle.on{background:#d71920;border-color:#d71920;justify-content:flex-end}@keyframes hmFadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}@keyframes hmModal{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}@keyframes hmOverlay{from{opacity:0}to{opacity:1}}@keyframes hmToast{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes hmRipple{to{transform:scale(3);opacity:0}}@media(max-width:700px){.side{width:76px!important}.main{margin-left:76px!important}.brand{height:82px!important}.hm-logo{width:60px!important;max-height:60px}.brand:after{width:68px;height:68px}.content{padding:20px 15px!important}.top{padding:0 15px!important}.search{display:none}}
</style>
