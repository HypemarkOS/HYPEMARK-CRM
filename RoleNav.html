<script>
(function(){
  'use strict';
  var pagePermission={dashboard:'dashboard',clients:'clients',projects:'projects',tasks:'tasks',deliverables:'deliverables',content:'content',payments:'finance_all',reports:'reports',activities:'activities_all',settings:'settings'};
  var ADMIN_PAGES=['dashboard','clients','projects','tasks','deliverables','content','payments','reports','activities','settings'];
  var PARTNER_PAGES=['dashboard','clients','projects','tasks','deliverables','content','payments','reports'];
  var EMPLOYEE_PAGES=['dashboard','projects','tasks','deliverables','content'];
  function esc(v){return String(v==null?'':v).replace(/[&<>\\'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\\"':'&quot;'}[c]});}
  function employeeDashboard(ctx){google.script.run.withSuccessHandler(function(d){var c=document.getElementById('content');if(!c)return;if(typeof window.renderEmployeeDashboard==='function'){window.renderEmployeeDashboard(d);return;}var list=function(a,key){return a&&a.length?a.map(function(x){return '<div class="act"><strong>'+esc(x[key]||x['Task Name']||x.Title||x.Type||'-')+'</strong><small>'+esc(x.Status||'')+' · '+esc(x['Due Date']||x['Publish Date']||'')+'</small></div>';}).join(''):'<div class="empty">Nothing here yet.</div>';c.innerHTML='<div class="hero"><div><h1>My Dashboard</h1><p>'+esc(ctx.name)+' · '+esc(ctx.jobFunction||'Employee')+'</p></div></div><div class="grid"><div class="card stat"><div class="label">My Tasks</div><div class="value">'+(d.tasks||[]).length+'</div></div><div class="card stat"><div class="label">My Deliverables</div><div class="value">'+(d.deliverables||[]).length+'</div></div><div class="card stat"><div class="label">Pending Reviews</div><div class="value orange">'+(d.pendingReviews||[]).length+'</div></div><div class="card stat"><div class="label">Completed Work</div><div class="value green">'+(d.completedWork||[]).length+'</div></div></div><div class="panels"><div class="card panel"><h2>My Tasks</h2><p>Only work assigned to you.</p><div class="activity">'+list(d.tasks,'Task Name')+'</div></div><div class="card panel"><h2>Upcoming Deadlines</h2><p>Your next assigned deadlines.</p><div class="activity">'+list(d.upcomingDeadlines,'title')+'</div></div></div><div class="panels" style="margin-top:17px"><div class="card panel"><h2>My Deliverables</h2><p>Deliverables assigned to you.</p><div class="activity">'+list(d.deliverables,'Type')+'</div></div><div class="card panel"><h2>My Content</h2><p>Content assigned to you.</p><div class="activity">'+list(d.content,'Title')+'</div></div></div>';}).withFailureHandler(function(e){var c=document.getElementById('content');if(c)c.innerHTML='<div class="card panel"><h2>Dashboard could not load</h2><p>'+esc(e.message||e)+'</p></div>';}).getEmployeeDashboardService_(ctx);}
  function allowedPages(ctx){
    if(ctx.role==='Admin')return ADMIN_PAGES.reduce(function(o,p){o[p]=true;return o;},{});
    if(ctx.role==='Partner')return PARTNER_PAGES.reduce(function(o,p){o[p]=true;return o;},{});
    var allowed={};(ctx.permissions||[]).forEach(function(p){allowed[p]=true;});return EMPLOYEE_PAGES.reduce(function(o,p){var perm=pagePermission[p];if(p==='dashboard'||(perm&&allowed[perm]))o[p]=true;return o;},{});
  }
  function applyRoleNav(ctx){
    if(!ctx||!ctx.authenticated)return;
    var allowed=allowedPages(ctx);
    document.querySelectorAll('.nav button[data-page]').forEach(function(btn){var page=btn.getAttribute('data-page');if(!allowed[page])btn.remove();});
    document.querySelectorAll('.nav .section').forEach(function(section){var next=section.nextElementSibling,has=false;while(next&&!next.classList.contains('section')){if(next.matches&&next.matches('button[data-page]')){has=true;break;}next=next.nextElementSibling;}if(!has)section.remove();});
    var user=document.querySelector('.user');if(user)user.textContent=(ctx.name||'User')+' · '+(ctx.role||'')+(ctx.jobFunction?' · '+ctx.jobFunction:'');
    if(ctx.role==='Employee')employeeDashboard(ctx);
  }
  function init(){if(typeof google==='undefined'||!google.script||!google.script.run)return;google.script.run.withSuccessHandler(applyRoleNav).withFailureHandler(function(){}).getAuthContext();}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
