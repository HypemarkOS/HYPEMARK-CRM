<script>
(function(){
  'use strict';
  var pagePermission={dashboard:'dashboard',clients:'clients',projects:'projects',tasks:'tasks',deliverables:'deliverables',content:'content',payments:'finance_all',reports:'reports',activities:'activities_all',settings:'settings'};
  var ADMIN_PAGES=['dashboard','clients','projects','tasks','deliverables','content','payments','reports','activities','settings'];
  var PARTNER_PAGES=['dashboard','clients','projects','tasks','deliverables','content','payments','reports'];
  var EMPLOYEE_PAGES=['dashboard','projects','tasks','deliverables','content'];

  function esc(v){return String(v==null?'':v).replace(/[&<>\\'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\\"':'&quot;'}[c];});}

  function allowedPages(ctx){
    if(ctx.role==='Admin')return ADMIN_PAGES.reduce(function(o,p){o[p]=true;return o;},{});
    if(ctx.role==='Partner')return PARTNER_PAGES.reduce(function(o,p){o[p]=true;return o;},{});
    var allowed={};
    (ctx.permissions||[]).forEach(function(p){allowed[p]=true;});
    return EMPLOYEE_PAGES.reduce(function(o,p){var perm=pagePermission[p];if(p==='dashboard'||(perm&&allowed[perm]))o[p]=true;return o;},{});
  }

  function employeeDashboard(ctx){
    if(typeof window.renderEmployeeDashboard==='function'){
      google.script.run.withSuccessHandler(function(d){window.renderEmployeeDashboard(d||{});}).withFailureHandler(function(e){
        var c=document.getElementById('content');
        if(c)c.innerHTML='<div class="card panel"><h2>Dashboard could not load</h2><p>'+esc(e&&e.message||e)+'</p></div>';
      }).getDashboard();
    }
  }

  function applyRoleNav(ctx){
    if(!ctx||!ctx.authenticated)return;
    var allowed=allowedPages(ctx);
    document.querySelectorAll('.nav button[data-page]').forEach(function(btn){
      var page=btn.getAttribute('data-page');
      if(!allowed[page])btn.remove();
    });
    document.querySelectorAll('.nav .section').forEach(function(section){
      var next=section.nextElementSibling,has=false;
      while(next&&!next.classList.contains('section')){
        if(next.matches&&next.matches('button[data-page]')){has=true;break;}
        next=next.nextElementSibling;
      }
      if(!has)section.remove();
    });
    var user=document.querySelector('.user');
    if(user)user.textContent=(ctx.name||'User')+' · '+(ctx.role||'')+(ctx.jobFunction?' · '+ctx.jobFunction:'');
    window.__hmAuthContext=ctx;
  }

  function initRoleNav(){
    if(typeof google==='undefined'||!google.script||!google.script.run)return;
    google.script.run.withSuccessHandler(applyRoleNav).withFailureHandler(function(){}).getAuthContext();
  }

  function findPageHandler(page){
    var map={
      dashboard:['dashboard'],
      clients:['clients'],
      projects:['projects','projectPage'],
      tasks:['showTasksPage'],
      deliverables:['deliverables','deliverablesPage'],
      content:['contentBank','contentPage'],
      payments:['payments'],
      reports:['reports'],
      activities:['activities'],
      settings:['settings']
    };
    var names=map[page]||[];
    for(var i=0;i<names.length;i++){
      if(typeof window[names[i]]==='function')return window[names[i]];
    }
    return null;
  }

  function setNavState(page){
    document.querySelectorAll('.nav button[data-page]').forEach(function(btn){
      btn.classList.toggle('active',btn.getAttribute('data-page')===page);
    });
    var crumb=document.getElementById('crumb');
    if(crumb)crumb.textContent='Workspace / '+page.charAt(0).toUpperCase()+page.slice(1);
  }

  function route(page){
    page=String(page||'dashboard').toLowerCase();
    if(page==='home')page='dashboard';
    setNavState(page);
    try{history.replaceState({},'',location.pathname+'?page='+encodeURIComponent(page));}catch(e){}

    if(page==='tasks'&&typeof window.showTasksPage==='function'){
      window.showTasksPage();
      return true;
    }

    var handler=findPageHandler(page);
    if(handler){handler();return true;}

    var attempts=0;
    var retry=function(){
      attempts++;
      var h=findPageHandler(page);
      if(h){h();return;}
      if(attempts<20){setTimeout(retry,100);return;}
      var c=document.getElementById('content');
      if(c)c.innerHTML='<div class="card panel"><h2>Unable to open '+esc(page)+'</h2><div class="notice err">The page module did not finish loading. Please refresh once.</div></div>';
    };
    retry();
    return false;
  }

  function installRouter(){
    if(window.__hmCentralRouterInstalled)return;
    window.__hmCentralRouterInstalled=true;
    window.__hmOriginalShow=window.show;
    window.show=route;

    document.addEventListener('click',function(ev){
      var btn=ev.target&&ev.target.closest?ev.target.closest('.nav button[data-page]'):null;
      if(!btn)return;
      var page=btn.getAttribute('data-page');
      if(!page)return;
      ev.preventDefault();
      ev.stopImmediatePropagation();
      route(page);
    },true);

    window.addEventListener('popstate',function(){
      var page=new URLSearchParams(location.search).get('page')||'dashboard';
      route(page);
    });

    var initial=new URLSearchParams(location.search).get('page');
    if(initial){setTimeout(function(){route(initial);},0);}
  }

  function init(){installRouter();initRoleNav();}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
  window.addEventListener('load',function(){installRouter();initRoleNav();});
})();
</script>
