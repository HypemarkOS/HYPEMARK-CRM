<script>
(function(){
  function navEsc(v){return String(v==null?'':v).replace(/[&<>\'\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]})}
  function navCall(name,args,ok,fail){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(fail||function(e){if(window.toast)toast(e.message||String(e),'err')});return args===undefined?r[name]():r[name].apply(r,args)}
  function fmtDate(v){if(!v)return '-';var d=new Date(v);return isNaN(d)?String(v):String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear()}

  window.contentBank=function(){
    var c=document.getElementById('content');if(!c)return;
    document.getElementById('crumb').textContent='Workspace / Content Bank';
    c.innerHTML='<div class="hero"><div><h1>Content Bank</h1><p>Plan, assign and track every content item.</p></div><div><button class="secondary" id="navContentRefresh">↻ Refresh</button> <button class="primary" id="navNewContent">＋ New Content</button></div></div><div class="grid" id="navContentStats"><div class="card stat">Loading...</div></div><div class="card panel"><div class="toolbar"><input id="navContentSearch" placeholder="Search title, deliverable, platform or assignee..."><select id="navContentStatus"><option value="">All statuses</option><option>Planned</option><option>In Progress</option><option>Pending Review</option><option>Approved</option><option>Published</option><option>On Hold</option><option>Cancelled</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Content</th><th>Platform</th><th>Deliverable</th><th>Assigned To</th><th>Priority</th><th>Publish Date</th><th>Status</th></tr></thead><tbody id="navContentRows"><tr><td colspan="7" class="loading">Loading content...</td></tr></tbody></table></div></div>';
    document.getElementById('navContentRefresh').onclick=loadContent;document.getElementById('navNewContent').onclick=function(){openContentForm()};document.getElementById('navContentSearch').oninput=renderContent;document.getElementById('navContentStatus').onchange=renderContent;loadContent();
  };
  var contentRows=[];
  function loadContent(){navCall('getContent',undefined,function(rows){contentRows=Array.isArray(rows)?rows:[];renderContent();renderContentStats()},function(e){var x=document.getElementById('navContentRows');if(x)x.innerHTML='<tr><td colspan="7" class="notice err">Unable to load content: '+navEsc(e.message||e)+'</td></tr>'})}
  function renderContentStats(){var a=contentRows||[],count=function(s){return a.filter(function(x){return String(x.Status||'')===s}).length},x=document.getElementById('navContentStats');if(x)x.innerHTML='<div class="card stat"><div class="label">Total Content</div><div class="value">'+a.length+'</div></div><div class="card stat"><div class="label">Planned</div><div class="value">'+count('Planned')+'</div></div><div class="card stat"><div class="label">In Progress</div><div class="value">'+count('In Progress')+'</div></div><div class="card stat"><div class="label">Pending Review</div><div class="value orange">'+count('Pending Review')+'</div></div>'}
  function renderContent(){var q=((document.getElementById('navContentSearch')||{}).value||'').toLowerCase().trim(),s=((document.getElementById('navContentStatus')||{}).value||''),x=document.getElementById('navContentRows');if(!x)return;var a=contentRows.filter(function(v){var t=[v.Title,v['Content ID'],v['Deliverable ID'],v['Assigned To'],v.Platform,v['Content Type'],v.Status,v.Priority].join(' ').toLowerCase();return(!q||t.indexOf(q)>-1)&&(!s||String(v.Status||'')===s)});x.innerHTML=a.length?a.map(function(v){return '<tr style="cursor:pointer" onclick="window.navigationEditContent(\''+String(v['Content ID']||'').replace(/'/g,"\\'")+'\')"><td><strong>'+navEsc(v.Title||'Untitled')+'</strong><div class="sub">'+navEsc(v['Content Type']||'')+' · '+navEsc(v['Content ID']||'')+'</div></td><td>'+navEsc(v.Platform||'-')+'</td><td>'+navEsc(v['Deliverable ID']||'-')+'</td><td>'+navEsc(v['Assigned To']||'-')+'</td><td>'+navEsc(v.Priority||'-')+'</td><td>'+navEsc(fmtDate(v['Publish Date']))+'</td><td><span class="status">'+navEsc(v.Status||'Planned')+'</span></td></tr>'}).join(''):'<tr><td colspan="7" class="empty">No content items match your filters.</td></tr>'}
  window.navigationEditContent=function(id){var v=contentRows.find(function(x){return String(x['Content ID'])===String(id)});if(!v)return;document.getElementById('modalTitle').textContent='Edit Content';document.getElementById('modalBody').innerHTML='<form id="navEditContentForm"><div class="form-grid"><div class="field full"><label>Content Title *</label><input id="neTitle" required value="'+navEsc(v.Title)+'"></div><div class="field"><label>Platform</label><select id="nePlatform"><option>Instagram</option><option>Facebook</option><option>YouTube</option><option>LinkedIn</option><option>WhatsApp</option><option>Website</option><option>Other</option></select></div><div class="field"><label>Content Type</label><input id="neType" value="'+navEsc(v['Content Type'])+'"></div><div class="field"><label>Status</label><select id="neStatus"><option>Planned</option><option>In Progress</option><option>Pending Review</option><option>Approved</option><option>Published</option><option>On Hold</option><option>Cancelled</option></select></div><div class="field"><label>Priority</label><select id="nePriority"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></div><div class="field full"><label>Assigned To</label><input id="neAssigned" value="'+navEsc(v['Assigned To'])+'"></div><div class="field full"><label>Creative Brief</label><textarea id="neBrief">'+navEsc(v['Creative Brief'])+'</textarea></div><div class="field full"><label>Assets / Instructions</label><textarea id="neAssets">'+navEsc(v['Assets / Instructions'])+'</textarea></div></div><div class="form-actions"><button class="save" type="submit">Save Changes</button></div></form>';document.getElementById('nePlatform').value=v.Platform||'Instagram';document.getElementById('neStatus').value=v.Status||'Planned';document.getElementById('nePriority').value=v.Priority||'Medium';document.getElementById('navEditContentForm').onsubmit=function(ev){ev.preventDefault();var data={title:document.getElementById('neTitle').value.trim(),platform:document.getElementById('nePlatform').value,contentType:document.getElementById('neType').value.trim(),status:document.getElementById('neStatus').value,priority:document.getElementById('nePriority').value,assignedTo:document.getElementById('neAssigned').value.trim(),creativeBrief:document.getElementById('neBrief').value.trim(),assetsInstructions:document.getElementById('neAssets').value.trim()};navCall('updateContent',[id,data],function(){closeModal();toast('Content updated successfully.','ok');loadContent()},function(e){toast(e.message||String(e),'err')})};document.getElementById('modalBg').classList.add('show')};
  function openContentForm(){navCall('getDeliverables',undefined,function(items){items=items||[];if(!items.length){toast('Create a deliverable first, then add content.','err');return}var opts=items.map(function(d){var id=d['Deliverable ID']||'';return '<option value="'+navEsc(id)+'">'+navEsc((d.Type||'Deliverable')+' · '+id)+'</option>'}).join('');document.getElementById('modalTitle').textContent='New Content';document.getElementById('modalBody').innerHTML='<form id="navNewContentForm"><div class="form-grid"><div class="field full"><label>Deliverable *</label><select id="ncDel" required><option value="">Select deliverable</option>'+opts+'</select></div><div class="field full"><label>Content Title *</label><input id="ncTitle" required></div><div class="field"><label>Platform</label><select id="ncPlatform"><option>Instagram</option><option>Facebook</option><option>YouTube</option><option>LinkedIn</option><option>WhatsApp</option><option>Website</option><option>Other</option></select></div><div class="field"><label>Content Type</label><input id="ncType" placeholder="Reel / Story / Post"></div><div class="field"><label>Status</label><select id="ncStatus"><option>Planned</option><option>In Progress</option><option>Pending Review</option><option>Approved</option><option>Published</option><option>On Hold</option><option>Cancelled</option></select></div><div class="field"><label>Priority</label><select id="ncPriority"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></div><div class="field full"><label>Assigned To</label><input id="ncAssigned"></div><div class="field full"><label>Creative Brief</label><textarea id="ncBrief"></textarea></div><div class="field full"><label>Assets / Instructions</label><textarea id="ncAssets"></textarea></div></div><div class="form-actions"><button class="save" type="submit">Create Content</button></div></form>';document.getElementById('navNewContentForm').onsubmit=function(ev){ev.preventDefault();navCall('createContent',[{deliverableId:document.getElementById('ncDel').value,title:document.getElementById('ncTitle').value.trim(),platform:document.getElementById('ncPlatform').value,contentType:document.getElementById('ncType').value.trim(),status:document.getElementById('ncStatus').value,priority:document.getElementById('ncPriority').value,assignedTo:document.getElementById('ncAssigned').value.trim(),creativeBrief:document.getElementById('ncBrief').value.trim(),assetsInstructions:document.getElementById('ncAssets').value.trim()}],function(){closeModal();toast('Content created successfully.','ok');loadContent()},function(e){toast(e.message||String(e),'err')})};document.getElementById('modalBg').classList.add('show')},function(e){toast(e.message||String(e),'err')})}

  window.payments=function(){
    var c=document.getElementById('content');if(!c)return;document.getElementById('crumb').textContent='Finance / Payments';
    c.innerHTML='<div class="hero"><div><h1>Payments & Profitability</h1><p>Track receipts, employee / partner payments, business expenses and remaining client funds.</p></div><button class="secondary" id="navPayRefresh">↻ Refresh</button></div><div class="grid" id="navPayStats"><div class="card stat">Loading...</div></div><div class="tabs"><button class="tab active" data-paytab="receipt">Client Receipts</button><button class="tab" data-paytab="employee">Employee / Partner Payments</button><button class="tab" data-paytab="expense">Business Expenses</button></div><div id="navPayPanel" class="card panel"></div><div class="card panel" style="margin-top:16px"><h2>Receipt Balances</h2><div id="navReceiptTable" class="loading">Loading...</div></div>';
    document.getElementById('navPayRefresh').onclick=loadPayments;document.querySelectorAll('[data-paytab]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-paytab]').forEach(function(x){x.classList.remove('active')});b.classList.add('active');renderPaymentPanel(b.getAttribute('data-paytab'))}});loadPayments();
  };
  var payClients=[],payOpts={},payReceipts=[];
  function loadPayments(){navCall('getClients',undefined,function(c){payClients=c||[];navCall('getPaymentOptions',undefined,function(o){payOpts=o||{};navCall('getReceiptOptions',undefined,function(r){payReceipts=r||[];renderPayStats();renderPaymentPanel(document.querySelector('[data-paytab].active').getAttribute('data-paytab'));renderReceiptTable()})})})}
  function clientOptions(allowGeneral){return '<option value="">'+(allowGeneral?'General / No client':'Select client')+'</option>'+payClients.map(function(c){return '<option value="'+navEsc(c['Client ID'])+'">'+navEsc(c['Business Name']||c['Client Name'])+'</option>'}).join('')}
  function receiptOptions(){return '<option value="">Not linked / General funds</option>'+payReceipts.map(function(r){return '<option value="'+navEsc(r.receiptId)+'">'+navEsc(r.receiptId)+' · ₹'+Number(r.remaining||0).toLocaleString('en-IN')+' remaining</option>'}).join('')}
  function renderPayStats(){navCall('getDashboard',undefined,function(d){var un=payReceipts.reduce(function(a,r){return a+Number(r.remaining||0)},0),x=document.getElementById('navPayStats');if(x)x.innerHTML='<div class="card stat"><div class="label">Client Receipts</div><div class="value money">'+money(d.clientReceipts)+'</div></div><div class="card stat"><div class="label">Employee / Partner</div><div class="value money">'+money(d.employeePayments)+'</div></div><div class="card stat"><div class="label">Business Expenses</div><div class="value money">'+money(d.miscExpenses)+'</div></div><div class="card stat"><div class="label">Unallocated Funds</div><div class="value money orange">'+money(un)+'</div></div>'},function(e){})}
  function renderPaymentPanel(type){var p=document.getElementById('navPayPanel');if(!p)return;if(type==='receipt')p.innerHTML='<h2>Record Client Receipt</h2><div class="form-grid"><div class="field"><label>Client *</label><select id="prClient">'+clientOptions(false)+'</select></div><div class="field"><label>Amount *</label><input id="prAmount" type="number" min="0" step="0.01"></div><div class="field"><label>Payment Date</label><input id="prDate" type="date"></div><div class="field"><label>Received By / Account</label><select id="prPaidTo">'+optsList(payOpts.paymentAccounts,'Select account')+'</select></div><div class="field"><label>Payment Mode</label><select id="prMode">'+optsList(payOpts.paymentModes,'Select mode')+'</select></div><div class="field"><label>Status</label><select id="prStatus"><option>Received</option><option>Pending</option><option>Partially Received</option></select></div><div class="field full"><label>Reference / Notes</label><textarea id="prNotes"></textarea></div></div><div class="form-actions"><button class="save" id="prSave">Record Client Receipt</button></div>';else if(type==='employee')p.innerHTML='<h2>Record Employee / Partner Payment</h2><div class="form-grid"><div class="field"><label>Employee / Partner *</label><select id="peEmployee">'+optsList(payOpts.employees,'Select employee / partner')+'</select></div><div class="field"><label>Payment Type *</label><select id="peType">'+optsList(payOpts.employeePaymentTypes,'Select payment type')+'</select></div><div class="field"><label>Client</label><select id="peClient">'+clientOptions(true)+'</select></div><div class="field"><label>Source Client Receipt</label><select id="peReceipt">'+receiptOptions()+'</select></div><div class="field"><label>Amount *</label><input id="peAmount" type="number" min="0" step="0.01"></div><div class="field"><label>Payment Date</label><input id="peDate" type="date"></div><div class="field"><label>Paid From / Account</label><select id="peFrom">'+optsList(payOpts.paymentAccounts,'Select account')+'</select></div><div class="field"><label>Payment Mode</label><select id="peMode">'+optsList(payOpts.paymentModes,'Select mode')+'</select></div><div class="field full"><label>Reference / Notes</label><textarea id="peNotes"></textarea></div></div><div class="form-actions"><button class="save" id="peSave">Record Payment</button></div>';else p.innerHTML='<h2>Record Business Expense</h2><div class="form-grid"><div class="field"><label>Client</label><select id="pxClient">'+clientOptions(true)+'</select></div><div class="field"><label>Source Client Receipt</label><select id="pxReceipt">'+receiptOptions()+'</select></div><div class="field"><label>Expense Category</label><select id="pxCategory">'+optsList(payOpts.expenseCategories,'Select category')+'</select></div><div class="field"><label>Related To</label><select id="pxRelated">'+optsList(payOpts.expenseContexts,'Select context')+'</select></div><div class="field"><label>Amount *</label><input id="pxAmount" type="number" min="0" step="0.01"></div><div class="field"><label>Expense Date</label><input id="pxDate" type="date"></div><div class="field"><label>Paid By</label><select id="pxPaidBy">'+optsList(payOpts.paidBy,'Select account')+'</select></div><div class="field"><label>Paid To</label><input id="pxPaidTo"></div><div class="field"><label>Payment Mode</label><select id="pxMode">'+optsList(payOpts.paymentModes,'Select mode')+'</select></div><div class="field full"><label>Description</label><textarea id="pxDesc"></textarea></div></div><div class="form-actions"><button class="save" id="pxSave">Record Business Expense</button></div>';bindPaymentSave(type)}
  function optsList(a,p){return '<option value="">'+navEsc(p)+'</option>'+(a||[]).map(function(x){return '<option value="'+navEsc(x)+'">'+navEsc(x)+'</option>'}).join('')}
  function bindPaymentSave(type){if(type==='receipt')document.getElementById('prSave').onclick=function(){navCall('createPayment',[{type:'Client Receipt',clientId:prClient.value,amount:prAmount.value,paymentDate:prDate.value,receivedBy:prPaidTo.value,paymentMode:prMode.value,status:prStatus.value,notes:prNotes.value}],paymentSaved,function(e){toast(e.message||String(e),'err')})};if(type==='employee')document.getElementById('peSave').onclick=function(){navCall('createPayment',[{type:'Employee Payment',employee:peEmployee.value,paymentType:peType.value,clientId:peClient.value,receiptId:peReceipt.value,amount:peAmount.value,paymentDate:peDate.value,paidFrom:peFrom.value,paymentMode:peMode.value,notes:peNotes.value}],paymentSaved,function(e){toast(e.message||String(e),'err')})};if(type==='expense')document.getElementById('pxSave').onclick=function(){navCall('createPayment',[{type:'Business Expense',clientId:pxClient.value,receiptId:pxReceipt.value,expenseCategory:pxCategory.value,relatedTo:pxRelated.value,amount:pxAmount.value,paymentDate:pxDate.value,paidBy:pxPaidBy.value,paidTo:pxPaidTo.value,paymentMode:pxMode.value,description:pxDesc.value}],paymentSaved,function(e){toast(e.message||String(e),'err')})}}
  function paymentSaved(){toast('Payment recorded successfully.','ok');loadPayments()}
  function renderReceiptTable(){var x=document.getElementById('navReceiptTable');if(!x)return;if(!payReceipts.length){x.innerHTML='<div class="empty">No unallocated client receipts.</div>';return}x.innerHTML='<div class="table-wrap"><table class="table"><thead><tr><th>Receipt</th><th>Client</th><th>Received</th><th>Remaining</th></tr></thead><tbody>'+payReceipts.map(function(r){var c=payClients.find(function(v){return String(v['Client ID'])===String(r.clientId)});return '<tr><td>'+navEsc(r.receiptId)+'</td><td>'+navEsc(c?(c['Business Name']||c['Client Name']):r.clientId)+'</td><td>'+money(r.amount)+'</td><td class="orange"><strong>'+money(r.remaining)+'</strong></td></tr>'}).join('')+'</tbody></table></div>'}
})();
</script>
