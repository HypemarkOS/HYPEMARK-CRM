<style id="hm-content-pro">
.hm-content-meta{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.hm-content-chip{background:#f7f8fa;border:1px solid #e4e7eb;border-radius:999px;padding:7px 11px;font-size:11px;color:#6f7785}.hm-content-chip strong{color:#171b23}.hm-content-actions{display:flex;gap:10px;align-items:center}.hm-content-table td:first-child{min-width:240px}.hm-content-title{font-weight:800;color:#171b23}.hm-content-sub{font-size:10px;color:#7c8491;margin-top:4px}.hm-content-status{border:1px solid #dfe3e9;background:#fff;border-radius:8px;padding:7px 9px;font-size:11px;font-weight:700}.hm-content-brief{max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#5f6672}.hm-content-form textarea{min-height:90px;resize:vertical}
</style>
<script>
(function(){
  function e(v){return String(v==null?'':v).replace(/[&<>\'\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]})}
  function call(name,args,ok,fail){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(fail||function(x){if(window.toast)toast(x.message||String(x),'err')});return args===undefined?r[name]():r[name].apply(r,args)}
  function contentPage(){var c=document.getElementById('content');if(!c)return;document.getElementById('crumb').textContent='Workspace / Content Bank';c.innerHTML='<div class="hero"><div><h1>Content Bank</h1><p>Plan and track every content item against its deliverable, brief, assets and assigned team member.</p></div><div class="hm-content-actions"><button class="secondary" id="hmContentRefresh">↻ Refresh</button><button class="primary" id="hmNewContent">＋ New Content</button></div></div><div class="hm-content-meta" id="hmContentStats"><span class="hm-content-chip">Total: <strong>…</strong></span><span class="hm-content-chip">Planned: <strong>…</strong></span><span class="hm-content-chip">In Progress: <strong>…</strong></span><span class="hm-content-chip">Pending Review: <strong>…</strong></span><span class="hm-content-chip">Published: <strong>…</strong></span></div><div class="card panel"><div class="toolbar"><input id="hmContentSearch" placeholder="Search title, deliverable, platform or assignee..."><select id="hmContentStatus"><option value="">All statuses</option><option>Planned</option><option>In Progress</option><option>Pending Review</option><option>Approved</option><option>Published</option><option>On Hold</option><option>Cancelled</option></select></div><div class="table-wrap"><table class="table hm-content-table"><thead><tr><th>Content</th><th>Platform</th><th>Deliverable</th><th>Assigned To</th><th>Priority</th><th>Publish Date</th><th>Status</th></tr></thead><tbody id="hmContentRows"><tr><td colspan="7" class="loading">Loading content...</td></tr></tbody></table></div></div>';document.getElementById('hmContentRefresh').onclick=loadContent;document.getElementById('hmNewContent').onclick=openContent;document.getElementById('hmContentSearch').oninput=renderContent;document.getElementById('hmContentStatus').onchange=renderContent;loadContent();}
  function loadContent(){call('getContent',undefined,function(data){window.__hmContent=Array.isArray(data)?data:[];renderContent();renderStats()},function(err){var x=document.getElementById('hmContentRows');if(x)x.innerHTML='<tr><td colspan="7" class="loading red">Unable to load content: '+e(err.message||err)+'</td></tr>'})}
  function renderStats(){var a=window.__hmContent||[],count=function(s){return a.filter(function(x){return String(x.Status||'')===s}).length};var x=document.getElementById('hmContentStats');if(x)x.innerHTML='<span class="hm-content-chip">Total: <strong>'+a.length+'</strong></span><span class="hm-content-chip">Planned: <strong>'+count('Planned')+'</strong></span><span class="hm-content-chip">In Progress: <strong>'+count('In Progress')+'</strong></span><span class="hm-content-chip">Pending Review: <strong>'+count('Pending Review')+'</strong></span><span class="hm-content-chip">Published: <strong>'+count('Published')+'</strong></span>'}
  function renderContent(){var a=window.__hmContent||[],q=((document.getElementById('hmContentSearch')||{}).value||'').toLowerCase().trim(),s=((document.getElementById('hmContentStatus')||{}).value||''),x=document.getElementById('hmContentRows');if(!x)return;a=a.filter(function(v){var t=[v.Title,v['Content ID'],v['Deliverable ID'],v['Assigned To'],v.Platform,v['Content Type'],v.Status,v.Priority].join(' ').toLowerCase();return(!q||t.indexOf(q)>-1)&&(!s||String(v.Status||'')===s)});if(!a.length){x.innerHTML='<tr><td colspan="7" class="empty">No content items match your filters.</td></tr>';return}x.innerHTML=a.map(function(v){var st=String(v.Status||'Planned'),cl=st==='Approved'||st==='Published'?'green':st==='On Hold'?'orange':st==='Cancelled'?'red':'';return '<tr><td><div class="hm-content-title">'+e(v.Title||'Untitled content')+'</div><div class="hm-content-sub">'+e(v['Content Type']||'')+' · '+e(v['Content ID']||'')+'</div><div class="hm-content-brief" title="'+e(v['Creative Brief']||'')+'">'+e(v['Creative Brief']||'')+'</div></td><td>'+e(v.Platform||'-')+'</td><td>'+e(v['Deliverable ID']||'-')+'</td><td>'+e(v['Assigned To']||'-')+'</td><td>'+e(v.Priority||'-')+'</td><td>'+e(formatDate(v['Publish Date']))+'</td><td><span class="status '+cl+'">'+e(st)+'</span></td></tr>'}).join('')}
  function formatDate(v){if(!v)return '-';var d=new Date(v);if(isNaN(d))return String(v);return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear()}
  function openContent(){call('getDeliverables',undefined,function(items){items=Array.isArray(items)?items:[];if(!items.length){toast('Create a deliverable first, then add content to it.','err');return}var opts=items.map(function(d){var id=d['Deliverable ID']||'';var label=(d.Type||'Deliverable')+' · '+id;return '<option value="'+e(id)+'">'+e(label)+'</option>'}).join('');call('getContentAssignees',undefined,function(assignees){assignees=Array.isArray(assignees)?assignees:[];var assigneeOpts='<option value="">Select team member</option>'+assignees.map(function(a){return '<option value="'+e(a.name)+'">'+e(a.name)+(a.role?' · '+e(a.role):'')+(a.jobFunction?' · '+e(a.jobFunction):'')+'</option>'}).join('');document.getElementById('modalTitle').textContent='New Content';document.getElementById('modalBody').innerHTML='<form id="hmContentForm" class="hm-content-form"><div class="form-grid"><div class="field full"><label>Deliverable *</label><select id="hmCD" required><option value="">Select deliverable</option>'+opts+'</select></div><div class="field full"><label>Content Title *</label><input id="hmCT" required placeholder="e.g. FeedBazaar Farmer Testimonial Reel"></div><div class="field"><label>Platform *</label><select id="hmCPlatform"><option>Instagram</option><option>Facebook</option><option>YouTube</option><option>LinkedIn</option><option>WhatsApp</option><option>Website</option><option>Other</option></select></div><div class="field"><label>Content Type</label><input id="hmCType" placeholder="Reel / Story / Post / Video"></div><div class="field"><label>Status</label><select id="hmCS"><option>Planned</option><option>In Progress</option><option>Pending Review</option><option>Approved</option><option>Published</option><option>On Hold</option><option>Cancelled</option></select></div><div class="field"><label>Priority</label><select id="hmCPriority"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></div><div class="field"><label>Assigned To</label><select id="hmCA">'+assigneeOpts+'</select></div><div class="field"><label>Publish Date</label><input id="hmCDate" type="date"></div><div class="field full"><label>Creative Brief</label><textarea id="hmCBrief" placeholder="What needs to be created, the objective, message, hook, audience and creative direction..."></textarea></div><div class="field full"><label>Assets / Instructions</label><textarea id="hmCAssets" placeholder="Drive links, reference assets, product files, footage, dimensions, brand instructions and other execution notes..."></textarea></div></div><div class="form-actions"><button class="save" type="submit">Create Content</button></div></form>';document.getElementById('hmContentForm').onsubmit=saveContent;document.getElementById('modalBg').classList.add('show')},function(err){toast(err.message||String(err),'err')})},function(err){toast(err.message||String(err),'err')})}
  function saveContent(ev){ev.preventDefault();var data={deliverableId:document.getElementById('hmCD').value,title:document.getElementById('hmCT').value.trim(),platform:document.getElementById('hmCPlatform').value,contentType:document.getElementById('hmCType').value.trim(),status:document.getElementById('hmCS').value,priority:document.getElementById('hmCPriority').value,assignedTo:document.getElementById('hmCA').value,publishDate:document.getElementById('hmCDate').value,creativeBrief:document.getElementById('hmCBrief').value.trim(),assetsInstructions:document.getElementById('hmCAssets').value.trim()};if(!data.deliverableId){toast('Select a deliverable.','err');return}if(!data.title){toast('Enter a content title.','err');return}call('createContent',[data],function(){closeModal();toast('Content created successfully.','ok');loadContent()},function(err){toast(err.message||String(err),'err')})}
  function bind(){var b=document.querySelector('.nav button[data-page="content"]');if(!b)return;b.onclick=function(ev){ev.preventDefault();document.querySelectorAll('.nav button').forEach(function(x){x.classList.toggle('active',x===b)});history.replaceState({},'',location.pathname+'?page=content');contentPage()}}
  window.addEventListener('load',function(){bind();var p=new URLSearchParams(location.search).get('page');if(p==='content')contentPage()});
})();
</script>
