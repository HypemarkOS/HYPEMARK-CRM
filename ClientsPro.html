<style>
.crm-clients-pro{--cx-red:#e11d2e;--cx-red-dark:#b91423;--cx-ink:#151923;--cx-muted:#7b8494;--cx-line:#e8ebf0;--cx-soft:#f7f8fa;--cx-green:#129a6b}.crm-clients-pro .client-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}.crm-clients-pro .client-hero h1{font-size:32px;letter-spacing:-1px}.crm-clients-pro .client-hero p{font-size:12px;color:var(--cx-muted)}.crm-clients-pro .client-actions{display:flex;gap:9px}.crm-clients-pro .cx-btn{border:1px solid var(--cx-line);background:#fff;color:var(--cx-ink);padding:10px 14px;border-radius:10px;font-weight:750;cursor:pointer}.crm-clients-pro .cx-btn.primary{background:var(--cx-red);border-color:var(--cx-red);color:#fff;box-shadow:0 8px 20px rgba(225,29,46,.18)}.crm-clients-pro .cx-btn.primary:hover{background:var(--cx-red-dark)}.crm-clients-pro .client-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.crm-clients-pro .cx-stat{background:#fff;border:1px solid var(--cx-line);border-radius:14px;padding:16px;box-shadow:0 6px 22px rgba(20,25,35,.035)}.crm-clients-pro .cx-stat-label{text-transform:uppercase;font-size:9px;letter-spacing:.8px;color:var(--cx-muted);font-weight:800}.crm-clients-pro .cx-stat-value{font-size:25px;font-weight:850;margin-top:8px}.crm-clients-pro .cx-stat-sub{font-size:10px;color:var(--cx-muted);margin-top:4px}.crm-clients-pro .cx-stat-sub.green{color:var(--cx-green)}.crm-clients-pro .client-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}.crm-clients-pro .client-toolbar input{flex:1;border:1px solid var(--cx-line);background:#fff;border-radius:11px;height:42px;padding:0 13px;outline:none}.crm-clients-pro .client-toolbar select{height:42px;border:1px solid var(--cx-line);background:#fff;border-radius:11px;padding:0 12px;outline:none}.crm-clients-pro .client-table-card{background:#fff;border:1px solid var(--cx-line);border-radius:15px;overflow:hidden;box-shadow:0 7px 24px rgba(20,25,35,.04)}.crm-clients-pro .cx-table{width:100%;border-collapse:collapse}.crm-clients-pro .cx-table th{background:#fafbfc;text-align:left;color:#8a93a2;text-transform:uppercase;font-size:9px;letter-spacing:.5px;padding:13px 16px;border-bottom:1px solid var(--cx-line)}.crm-clients-pro .cx-table td{padding:15px 16px;border-bottom:1px solid var(--cx-line);font-size:11px}.crm-clients-pro .cx-table tbody tr{cursor:pointer;transition:background .18s,transform .18s}.crm-clients-pro .cx-table tbody tr:hover{background:#fff8f8}.crm-clients-pro .cx-client-name{font-weight:800;color:var(--cx-ink)}.crm-clients-pro .cx-business{font-size:9px;color:var(--cx-muted);margin-top:3px}.crm-clients-pro .cx-status{display:inline-flex;padding:5px 9px;border-radius:20px;font-size:9px;font-weight:800}.crm-clients-pro .cx-status.active{background:#eaf8f2;color:#12835d}.crm-clients-pro .cx-status.inactive{background:#fff0f2;color:#bd3949}.crm-clients-pro .cx-empty{padding:55px;text-align:center;color:var(--cx-muted);font-size:12px}.cx-drawer-bg{position:fixed;inset:0;background:rgba(15,20,30,.38);z-index:55;display:none}.cx-drawer-bg.show{display:block}.cx-drawer{position:absolute;right:0;top:0;height:100%;width:min(520px,94vw);background:#fff;box-shadow:-18px 0 50px rgba(10,15,25,.18);overflow:auto;animation:cxSlide .24s ease}.cx-drawer-head{padding:22px;border-bottom:1px solid var(--cx-line);display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.cx-drawer-head h2{margin:0;font-size:22px}.cx-drawer-head p{margin:5px 0 0;color:var(--cx-muted);font-size:10px}.cx-close{border:0;background:#f1f3f6;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}.cx-drawer-body{padding:22px}.cx-profile{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}.cx-profile-item{background:#f8f9fb;border-radius:11px;padding:12px}.cx-profile-item.full{grid-column:1/-1}.cx-profile-item label{display:block;color:#8a93a2;text-transform:uppercase;font-size:8px;font-weight:800;letter-spacing:.5px;margin-bottom:5px}.cx-profile-item div{font-size:11px;font-weight:650;word-break:break-word}.cx-section-title{font-size:13px;font-weight:850;margin:22px 0 10px}.cx-engagement{border:1px solid var(--cx-line);border-radius:11px;padding:13px;margin-bottom:9px}.cx-engagement-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cx-engagement-grid div{font-size:10px}.cx-engagement-grid span{display:block;color:var(--cx-muted);font-size:8px;text-transform:uppercase;margin-bottom:3px}.cx-loading{padding:30px;text-align:center;color:var(--cx-muted);font-size:11px}@keyframes cxSlide{from{transform:translateX(30px);opacity:.6}to{transform:translateX(0);opacity:1}}@media(max-width:900px){.crm-clients-pro .client-stats{grid-template-columns:1fr 1fr}.crm-clients-pro .cx-table{min-width:760px}.crm-clients-pro .client-table-card{overflow:auto}}@media(max-width:600px){.crm-clients-pro .client-hero{align-items:flex-start}.crm-clients-pro .client-stats{grid-template-columns:1fr 1fr}.crm-clients-pro .client-toolbar{flex-direction:column;align-items:stretch}.crm-clients-pro .client-toolbar input,.crm-clients-pro .client-toolbar select{width:100%}.cx-profile{grid-template-columns:1fr}.cx-profile-item.full{grid-column:auto}}
</style>
<div id="cxDrawerBg" class="cx-drawer-bg" onclick="if(event.target===this)closeClientDrawer()"><aside class="cx-drawer"><div class="cx-drawer-head"><div><h2 id="cxDrawerTitle">Client</h2><p id="cxDrawerSub">Client overview</p></div><button class="cx-close" onclick="closeClientDrawer()">×</button></div><div id="cxDrawerBody" class="cx-drawer-body"></div></aside></div>
<script>
(function(){
  function escx(v){return String(v==null?'':v).replace(/[&<>\'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
  function install(){
    if(typeof window.clientsProInstalled==='undefined')window.clientsProInstalled=false;
    if(window.clientsProInstalled)return;
    window.clientsProInstalled=true;
    window.clients=function(){
      var box=document.getElementById('content');
      box.innerHTML='<div class="crm-clients-pro"><div class="client-hero"><div><h1>Clients</h1><p>One workspace for relationships, contacts and commercial history.</p></div><div class="client-actions"><button class="cx-btn" onclick="refreshClientsPro()">↻ Refresh</button><button class="cx-btn primary" onclick="openClient()">＋ Add Client</button></div></div><div id="cxStats" class="client-stats"></div><div class="client-toolbar"><input id="cxSearch" placeholder="Search client, business, contact, mobile or email..." oninput="renderClientsPro()"><select id="cxStatus" onchange="renderClientsPro()"><option value="">All statuses</option><option>Active</option><option>Inactive</option></select></div><div class="client-table-card"><div id="cxTable" class="cx-empty">Loading clients...</div></div></div>';
      renderClientsPro();
      if(!state.clients||!state.clients.length)run('getClients',undefined,function(d){state.clients=d||[];renderClientsPro();});
    };
    window.refreshClientsPro=function(){document.getElementById('cxTable').innerHTML='<div class="cx-empty">Refreshing...</div>';run('getClients',undefined,function(d){state.clients=d||[];renderClientsPro();toast('Clients refreshed.','ok')})};
    window.renderClientsPro=function(){
      var list=state.clients||[],q=((document.getElementById('cxSearch')||{}).value||'').toLowerCase(),s=((document.getElementById('cxStatus')||{}).value||'');
      var filtered=list.filter(function(c){var text=[c['Client Name'],c['Business Name'],c['Contact Person'],c.Mobile,c.Email,c.GST].join(' ').toLowerCase();return(!q||text.indexOf(q)>-1)&&(!s||String(c.Status||'')===s)});
      var active=list.filter(function(c){return c.Status==='Active'}).length;
      var inactive=list.length-active;
      document.getElementById('cxStats').innerHTML='<div class="cx-stat"><div class="cx-stat-label">Total Clients</div><div class="cx-stat-value">'+list.length+'</div><div class="cx-stat-sub">All client records</div></div><div class="cx-stat"><div class="cx-stat-label">Active</div><div class="cx-stat-value">'+active+'</div><div class="cx-stat-sub green">Currently active</div></div><div class="cx-stat"><div class="cx-stat-label">Inactive</div><div class="cx-stat-value">'+inactive+'</div><div class="cx-stat-sub">Archived / paused</div></div><div class="cx-stat"><div class="cx-stat-label">Showing</div><div class="cx-stat-value">'+filtered.length+'</div><div class="cx-stat-sub">Matching your filters</div></div>';
      var table=document.getElementById('cxTable');
      if(!filtered.length){table.innerHTML='<div class="cx-empty">No clients match your search.</div>';return}
      table.innerHTML='<table class="cx-table"><thead><tr><th>Client</th><th>Contact</th><th>Mobile</th><th>Email</th><th>Status</th><th>Created</th></tr></thead><tbody>'+filtered.map(function(c){var id=escx(c['Client ID']).replace(/'/g,"\\'");return '<tr onclick="openClientDrawer(\''+id+'\')"><td><div class="cx-client-name">'+escx(c['Client Name']||'-')+'</div><div class="cx-business">'+escx(c['Business Name']||'-')+'</div></td><td>'+escx(c['Contact Person']||'-')+'</td><td>'+escx(c.Mobile||'-')+'</td><td>'+escx(c.Email||'-')+'</td><td><span class="cx-status '+(c.Status==='Active'?'active':'inactive')+'">'+escx(c.Status||'-')+'</span></td><td>'+escx(c['Created On']||'-')+'</td></tr>'}).join('')+'</tbody></table>';
    };
    window.openClientDrawer=function(id){
      var c=(state.clients||[]).find(function(x){return String(x['Client ID'])===String(id)});if(!c)return;
      document.getElementById('cxDrawerTitle').textContent=c['Client Name']||'Client';document.getElementById('cxDrawerSub').textContent=c['Business Name']||'Client overview';document.getElementById('cxDrawerBg').classList.add('show');
      var keys=['Client ID','Client Name','Business Name','Contact Person','Mobile','Email','GST','Address','Status','Created On'];
      document.getElementById('cxDrawerBody').innerHTML='<div style="display:flex;gap:8px;margin-bottom:18px"><button class="cx-btn primary" onclick="closeClientDrawer();openClient(\''+escx(id).replace(/'/g,"\\'")+'\')">Edit Client</button></div><div class="cx-profile">'+keys.filter(function(k){return c[k]!=null&&String(c[k])!==''}).map(function(k){return '<div class="cx-profile-item '+(k==='Address'?'full':'')+'"><label>'+escx(k)+'</label><div>'+escx(c[k])+'</div></div>'}).join('')+'</div><div class="cx-section-title">Engagements</div><div id="cxEngagements" class="cx-loading">Loading engagement history...</div>';
      run('getEngagements',[id],function(rows){rows=rows||[];var el=document.getElementById('cxEngagements');if(!el)return;if(!rows.length){el.innerHTML='<div class="cx-empty" style="padding:25px">No engagements recorded yet.</div>';return}el.innerHTML=rows.map(function(r){var pairs=Object.keys(r).filter(function(k){return r[k]!=null&&String(r[k])!==''}).slice(0,8);return '<div class="cx-engagement"><div class="cx-engagement-grid">'+pairs.map(function(k){return '<div><span>'+escx(k)+'</span>'+escx(r[k])+'</div>'}).join('')+'</div></div>'}).join('')});
    };
    window.closeClientDrawer=function(){document.getElementById('cxDrawerBg').classList.remove('show')};
  }
  if(document.readyState==='loading')window.addEventListener('load',install);else setTimeout(install,0);
})();
</script>
