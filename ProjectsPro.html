<style id="hm-projects-pro">
.project-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}.project-toolbar{display:flex;gap:10px;margin:0 0 16px}.project-toolbar input{flex:1}.project-toolbar input,.project-toolbar select{border:1px solid #d9dfe8;background:#fff;border-radius:10px;padding:11px 13px;outline:none}.project-toolbar input:focus,.project-toolbar select:focus{border-color:#e51b23;box-shadow:0 0 0 3px rgba(229,27,35,.08)}.project-table{width:100%;border-collapse:collapse;min-width:900px}.project-table th{text-align:left;background:#fbfcfe;color:#8a94a4;text-transform:uppercase;font-size:9px;padding:13px 12px;border-bottom:1px solid #e7ebf1;letter-spacing:.5px}.project-table td{padding:14px 12px;border-bottom:1px solid #e7ebf1;font-size:12px}.project-table tbody tr:hover{background:#fafbff}.project-title{font-weight:800}.project-meta{font-size:10px;color:#8a94a4;margin-top:4px}.project-empty{padding:50px;text-align:center;color:#7c8491;font-size:12px}.project-modal-note{font-size:10px;color:#7c8491;margin-top:5px}.project-value-input{font-variant-numeric:tabular-nums}@media(max-width:1050px){.project-stats{grid-template-columns:1fr 1fr}}@media(max-width:700px){.project-stats{grid-template-columns:1fr 1fr}.project-toolbar{flex-direction:column}}
</style>
<script>
(function(){
  var originalShow=window.show;
  function escP(v){return String(v==null?'':v).replace(/[&<>\'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
  function projectMoney(v){return '₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
  function projectDate(v){if(!v)return '-';var d=new Date(v);if(isNaN(d))return String(v);return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
  function projectStatusClass(s){s=String(s||'');return s==='Active'?'green':s==='On Hold'?'orange':s==='Cancelled'?'red':''}
  function projectsPage(){
    var c=document.getElementById('content');if(!c)return;
    document.getElementById('crumb').textContent='Workspace / Projects';
    c.innerHTML='<div class="hero"><div><h1>Projects</h1><p>Track active work, ownership, deadlines and project value in one workspace.</p></div><button class="primary" onclick="openProjectModal()">＋ New Project</button></div>'+
      '<div id="projectStats" class="project-stats"><div class="card stat"><div class="label">Total Projects</div><div class="value">…</div><div class="sub">All projects</div></div><div class="card stat"><div class="label">Active</div><div class="value">…</div><div class="sub green">Currently running</div></div><div class="card stat"><div class="label">Due Soon</div><div class="value">…</div><div class="sub">Next 7 days</div></div><div class="card stat"><div class="label">Project Value</div><div class="value money">…</div><div class="sub">Total project value</div></div></div>'+ 
      '<div class="card panel"><div class="panel-head"><div><h2>Project Pipeline</h2><p>Every project, its client, owner and current status.</p></div><button class="secondary" onclick="loadProjectsPro()">↻ Refresh</button></div><div class="project-toolbar"><input id="projectSearchPro" placeholder="Search project, client or owner..." oninput="renderProjectsPro()"><select id="projectStatusPro" onchange="renderProjectsPro()"><option value="">All statuses</option><option>Planned</option><option>Active</option><option>On Hold</option><option>Completed</option><option>Cancelled</option></select></div><div class="table-wrap"><table class="project-table"><thead><tr><th>Project</th><th>Client</th><th>Owner</th><th>Start</th><th>Deadline</th><th>Value</th><th>Status</th></tr></thead><tbody id="projectRowsPro"><tr><td colspan="7" class="project-empty">Loading projects...</td></tr></tbody></table></div></div>';
    state.projects=[];loadProjectsPro();
  }
  function renderStats(){
    var a=state.projects||[],active=0,due=0,value=0,now=new Date(),next=new Date(now.getTime()+7*86400000);
    a.forEach(function(p){var s=String(p.Status||p.status||'');if(s==='Active')active++;value+=Number(p.Value||p.value||p['Project Value']||0);var d=new Date(p.Deadline||p['End Date']||p.endDate);if(!isNaN(d)&&d>=now&&d<=next&&s!=='Completed'&&s!=='Cancelled')due++;});
    document.getElementById('projectStats').innerHTML='<div class="card stat"><div class="label">Total Projects</div><div class="value">'+a.length+'</div><div class="sub">All projects</div></div><div class="card stat"><div class="label">Active</div><div class="value">'+active+'</div><div class="sub green">Currently running</div></div><div class="card stat"><div class="label">Due Soon</div><div class="value">'+due+'</div><div class="sub">Next 7 days</div></div><div class="card stat"><div class="label">Project Value</div><div class="value money">'+projectMoney(value)+'</div><div class="sub">Total project value</div></div>';
  }
  window.loadProjectsPro=function(){run('getProjects',undefined,function(data){state.projects=Array.isArray(data)?data:[];renderProjectsPro();renderStats()},function(e){var el=document.getElementById('projectRowsPro');if(el)el.innerHTML='<tr><td colspan="7" class="project-empty red">Unable to load projects: '+escP(e.message||e)+'</td></tr>'})};
  window.renderProjectsPro=function(){var a=state.projects||[],q=(document.getElementById('projectSearchPro')||{}).value||'',s=(document.getElementById('projectStatusPro')||{}).value||'';q=q.toLowerCase().trim();a=a.filter(function(p){var t=[p.Name,p['Project Name'],p.Client,p.ClientName,p.clientName,p.Owner,p.AssignedTo].join(' ').toLowerCase();return(!q||t.indexOf(q)>-1)&&(!s||String(p.Status||p.status||'')===s)});var el=document.getElementById('projectRowsPro');if(!el)return;if(!a.length){el.innerHTML='<tr><td colspan="7" class="project-empty">No projects match your filters.</td></tr>';return}el.innerHTML=a.map(function(p){var st=String(p.Status||p.status||'Planned'),cls=projectStatusClass(st);return '<tr><td><div class="project-title">'+escP(p.Name||p['Project Name']||p.ID||'Untitled')+'</div><div class="project-meta">'+escP(p.ID||'')+'</div></td><td>'+escP(p.Client||p.ClientName||p.clientName||'-')+'</td><td>'+escP(p.Owner||p.AssignedTo||p['Assigned To']||'-')+'</td><td>'+escP(projectDate(p['Start Date']||p.StartDate||p.Start||p.startDate))+'</td><td>'+escP(projectDate(p.Deadline||p['End Date']||p.EndDate||p.endDate))+'</td><td>'+projectMoney(p.Value||p.value||p['Project Value'])+'</td><td><span class="status '+cls+'">'+escP(st)+'</span></td></tr>'}).join('')};
  window.openProjectModal=function(){run('getClients',undefined,function(clients){clients=clients||[];var opts=clients.map(function(c){var id=c['Client ID']||c.ID||c.clientId||'';var name=c['Business Name']||c['Client Name']||c.Name||'Client';return '<option value="'+escP(id)+'">'+escP(name)+'</option>'}).join('');document.getElementById('modalTitle').textContent='New Project';document.getElementById('modalBody').innerHTML='<form id="projectFormPro" onsubmit="saveProjectPro(event)"><div class="form-grid"><div class="field"><label>Project Name *</label><input id="projectNamePro" required placeholder="e.g. Instagram Growth Campaign"></div><div class="field"><label>Client *</label><select id="projectClientPro" required><option value="">Select client</option>'+opts+'</select></div><div class="field"><label>Status</label><select id="projectStatusFormPro"><option>Planned</option><option>Active</option><option>On Hold</option><option>Completed</option><option>Cancelled</option></select></div><div class="field"><label>Project Value</label><input id="projectValuePro" class="project-value-input" type="text" inputmode="decimal" autocomplete="off" placeholder="₹ 0" oninput="this.value=this.value.replace(/[^0-9,]/g,'')"><div class="project-modal-note">Total agreed value of this project. Payments received are tracked separately.</div></div><div class="field"><label>Start Date</label><input id="projectStartPro" type="date"></div><div class="field"><label>Deadline</label><input id="projectEndPro" type="date"></div><div class="field"><label>Owner / Assignee</label><input id="projectOwnerPro" placeholder="Team member"></div><div class="field full"><label>Notes</label><textarea id="projectNotesPro" placeholder="Project scope, priorities or internal notes"></textarea></div></div><div class="form-actions"><button type="submit" class="save">Create Project</button></div></form>';document.getElementById('modalBg').classList.add('show')},function(e){toast(e.message||String(e),'err')})};
  window.saveProjectPro=function(e){e.preventDefault();var raw=document.getElementById('projectValuePro').value.replace(/,/g,'').trim(),value=raw===''?0:Number(raw);if(!Number.isFinite(value)||value<0){toast('Enter a valid project value.','err');return}var data={Name:document.getElementById('projectNamePro').value.trim(),ClientID:document.getElementById('projectClientPro').value,Status:document.getElementById('projectStatusFormPro').value,Value:value,StartDate:document.getElementById('projectStartPro').value,Deadline:document.getElementById('projectEndPro').value,Owner:document.getElementById('projectOwnerPro').value.trim(),Notes:document.getElementById('projectNotesPro').value.trim()};run('createProject',[data],function(){closeModal();toast('Project created successfully.','ok');loadProjectsPro()},function(err){toast(err.message||String(err),'err')})};
  window.show=function(page){if(page==='projects'){document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('active',b.dataset.page===page)});projectsPage();return}return originalShow.apply(this,arguments)};
  var initial=new URLSearchParams(location.search).get('page');if(initial==='projects')projectsPage();
})();
</script>
