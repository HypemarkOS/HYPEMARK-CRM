<script>
(function(){
  'use strict';
  var selectedContentId='';
  function esc(v){return String(v==null?'':v).replace(/[&<>\\"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[c];});}
  function call(name,args,ok,fail){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(fail||function(e){if(window.toast)toast(e.message||String(e),'err');});return args===undefined?r[name]():r[name].apply(r,args);}
  function inject(){
    var dl=document.getElementById('fDeliverable');
    if(!dl||document.getElementById('fContent'))return;
    var wrap=document.createElement('div');wrap.className='field full';
    wrap.innerHTML='<label>Content</label><select id="fContent"><option value="">No content link</option></select><small style="display:block;margin-top:5px;color:#7b8491">Link this task to the exact content item it executes.</small>';
    dl.closest('.field').parentNode.insertBefore(wrap,dl.closest('.field').nextSibling);
    var load=function(){var did=dl.value,sel=document.getElementById('fContent');if(!sel)return;if(!did){sel.innerHTML='<option value="">No content link</option>';return;}call('getContentForDeliverable',[did],function(items){items=Array.isArray(items)?items:[];sel.innerHTML='<option value="">No content link</option>'+items.map(function(x){return'<option value="'+esc(x['Content ID'])+'">'+esc(x.Title||x['Content ID'])+' · '+esc(x.Status||'')+'</option>';}).join('');if(selectedContentId)sel.value=selectedContentId;});};
    dl.addEventListener('change',function(){selectedContentId='';load();});load();
  }
  function captureSave(ev){
    var b=ev.target.closest&&ev.target.closest('#fSave');if(!b)return;
    var content=document.getElementById('fContent');if(!content||!content.value)return;
    ev.preventDefault();ev.stopImmediatePropagation();selectedContentId=content.value;
    var taskId=b.getAttribute('data-task-id')||'';
    var name=document.getElementById('fName'),client=document.getElementById('fClient'),project=document.getElementById('fProject'),deliverable=document.getElementById('fDeliverable'),assign=document.getElementById('fAssign'),priority=document.getElementById('fPriority'),status=document.getElementById('fStatus'),start=document.getElementById('fStart'),due=document.getElementById('fDue'),notes=document.getElementById('fNotes');
    var d={taskName:name?name.value.trim():'',clientId:client?client.value:'',projectId:project?project.value:'',deliverableId:deliverable?deliverable.value:'',assignedTo:assign?assign.value:'',priority:priority?priority.value:'Medium',status:status?status.value:'To Do',startDate:start?start.value:'',dueDate:due?due.value:'',notes:notes?notes.value:'',UpdateNotes:notes?notes.value:''};
    b.disabled=true;b.textContent=taskId?'Saving...':'Creating...';
    var ok=function(saved){var id=saved&&saved['Task ID'];if(!id){if(window.toast)toast('Task saved, but no Task ID was returned.','err');b.disabled=false;return;}call('linkContentTask',[selectedContentId,id],function(){if(typeof closeModal==='function')closeModal();if(window.showTasksPage)window.showTasksPage();if(window.toast)toast('Task saved and linked to content.','ok');},function(e){if(typeof closeModal==='function')closeModal();if(window.showTasksPage)window.showTasksPage();if(window.toast)toast('Task saved, but content link failed: '+(e.message||e),'err');});};
    var fail=function(e){b.disabled=false;b.textContent=taskId?'Save Update':'Create Task';if(window.toast)toast(e.message||String(e),'err');};
    if(taskId)call('updateTask',[taskId,d],ok,fail);else call('createTask',[d],ok,fail);
  }
  function watch(){var m=document.getElementById('modalBg');if(!m)return;var obs=new MutationObserver(function(){if(m.classList.contains('show'))setTimeout(inject,50);});obs.observe(m,{attributes:true,attributeFilter:['class']});document.addEventListener('click',captureSave,true);}
  window.addEventListener('load',watch);
})();
</script>
