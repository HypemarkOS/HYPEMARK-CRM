<style>
.hm-content-clickable{cursor:pointer}.hm-content-clickable:hover{background:#fafbff!important}.hm-content-detail{display:grid;gap:16px}.hm-content-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hm-content-detail-item{border:1px solid #e6eaf0;border-radius:9px;padding:11px;background:#fbfcfe}.hm-content-detail-label{font-size:9px;text-transform:uppercase;color:#8a94a4;font-weight:800;margin-bottom:5px}.hm-content-detail-value{font-size:12px;color:#172033;white-space:pre-wrap}.hm-content-task{border:1px solid #e6eaf0;border-radius:9px;padding:12px}.hm-content-task strong{font-size:12px}.hm-content-task small{display:block;color:#748094;margin-top:5px}.hm-content-empty{padding:16px;border:1px dashed #d9dfe8;border-radius:9px;color:#748094;font-size:11px}.hm-content-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hm-content-edit-grid label{display:block;font-size:10px;font-weight:800;color:#596579;margin-bottom:5px}.hm-content-edit-grid input,.hm-content-edit-grid select,.hm-content-edit-grid textarea{width:100%;box-sizing:border-box;border:1px solid #d7deea;border-radius:8px;padding:9px;font:inherit;background:#fff}.hm-content-edit-grid textarea{min-height:90px;resize:vertical}.hm-content-edit-full{grid-column:1/-1}.hm-content-actions{position:relative;z-index:20;display:flex;justify-content:flex-end;gap:8px;pointer-events:auto}.hm-content-actions button{position:relative;z-index:21;pointer-events:auto;cursor:pointer}@media(max-width:700px){.hm-content-detail-grid,.hm-content-edit-grid{grid-template-columns:1fr}.hm-content-edit-full{grid-column:auto}}
</style>
<script>
(function(){
'use strict';
function esc(v){return String(v==null?'':v).replace(/[&<>\\"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[c];});}
function notify(message,type){if(window.toast){window.toast(message,type||'err');}else{alert(message);}}
function call(name,args,ok,fail){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(fail||function(e){notify(e&&e.message?e.message:String(e),'err');});return args===undefined?r[name]():r[name].apply(r,args);}
function findContentId(row){var id=row.getAttribute('data-content-id');if(id)return id;var sub=row.querySelector('.hm-content-sub');var text=sub?sub.textContent:'';var m=text.match(/(CNT-[A-Za-z0-9_-]+)/);return m?m[1]:'';}
function bindRows(){var rows=document.querySelectorAll('#hmContentRows tr');Array.prototype.forEach.call(rows,function(row){if(row.dataset.hmContentBound)return;var id=findContentId(row);if(!id)return;row.dataset.hmContentBound='1';row.classList.add('hm-content-clickable');row.title='Open content details';row.addEventListener('click',function(){open(id);});});}
function open(id){var item=(window.__hmContent||[]).find(function(x){return String(x['Content ID'])===String(id);});if(!item){notify('Content item could not be found. Refresh Content Bank and try again.','err');return;}document.getElementById('modalTitle').textContent='Edit Content';var b=document.getElementById('modalBody');if(!b)return;var publish=formatInputDate(item['Publish Date']);call('getContentAssignees',[],function(users){var opts='<option value="">Unassigned</option>'+users.map(function(u){return'<option value="'+esc(u.name)+'"'+(String(u.name)===String(item['Assigned To'])?' selected':'')+'>'+esc(u.name)+(u.jobFunction?' · '+esc(u.jobFunction):'')+'</option>';}).join('');b.innerHTML='<div class="hm-content-detail"><div class="hm-content-edit-grid"><div><label>Content Title *</label><input id="hmEditTitle" value="'+esc(item.Title)+'"></div><div><label>Platform</label><select id="hmEditPlatform">'+selectOpts(['Instagram','Facebook','YouTube','LinkedIn','WhatsApp','Website','Other'],item.Platform)+'</select></div><div><label>Content Type</label><input id="hmEditType" value="'+esc(item['Content Type'])+'"></div><div><label>Status</label><select id="hmEditStatus">'+selectOpts(['Planned','In Progress','Pending Review','Approved','Published','On Hold','Cancelled'],item.Status)+'</select></div><div><label>Priority</label><select id="hmEditPriority">'+selectOpts(['Low','Medium','High','Urgent'],item.Priority)+'</select></div><div><label>Assigned To</label><select id="hmEditAssigned">'+opts+'</select></div><div><label>Publish Date</label><input id="hmEditPublish" type="date" value="'+esc(publish)+'"></div><div class="hm-content-edit-full"><label>Creative Brief</label><textarea id="hmEditBrief">'+esc(item['Creative Brief']||'')+'</textarea></div><div class="hm-content-edit-full"><label>Assets / Instructions</label><textarea id="hmEditAssets">'+esc(item['Assets / Instructions']||'')+'</textarea></div></div><div><div class="hm-content-detail-label" style="margin-bottom:8px">Linked Tasks</div><div id="hmContentLinkedTasks" class="hm-content-empty">Loading linked tasks...</div></div><div class="form-actions hm-content-actions"><button type="button" class="secondary" id="hmCancelContent">Cancel</button><button type="button" class="primary" id="hmSaveContent" data-content-id="'+esc(id)+'">Save Changes</button></div></div>';
var cancel=document.getElementById('hmCancelContent');if(cancel)cancel.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();closeModal();});
call('getContentTaskBundle',[id],function(bundle){renderTasks(bundle);},function(){var x=document.getElementById('hmContentLinkedTasks');if(x)x.textContent='Linked tasks could not be loaded.';});},function(e){notify(e&&e.message?e.message:String(e),'err');});}
function renderTasks(bundle){var x=document.getElementById('hmContentLinkedTasks');if(!x)return;var tasks=bundle&&Array.isArray(bundle.tasks)?bundle.tasks:[];if(!tasks.length){x.innerHTML='No tasks linked to this content yet.';return;}x.className='';x.innerHTML=tasks.map(function(t){return'<div class="hm-content-task"><strong>'+esc(t['Task Name']||'-')+'</strong><small>Status: '+esc(t.Status||'-')+' · Assigned to: '+esc(t['Assigned To']||'-')+' · Due: '+esc(t['Due Date']||'-')+'</small></div>';}).join('');}
function saveContent(id){var btn=document.getElementById('hmSaveContent');if(!btn){notify('Save button could not be found.','err');return;}btn.disabled=true;btn.textContent='Saving...';var data={title:document.getElementById('hmEditTitle').value,platform:document.getElementById('hmEditPlatform').value,contentType:document.getElementById('hmEditType').value,creativeBrief:document.getElementById('hmEditBrief').value,assetsInstructions:document.getElementById('hmEditAssets').value,status:document.getElementById('hmEditStatus').value,priority:document.getElementById('hmEditPriority').value,assignedTo:document.getElementById('hmEditAssigned').value,publishDate:document.getElementById('hmEditPublish').value};call('updateContent',[id,data],function(updated){notify('Content updated successfully.','ok');closeModal();window.__hmContent=(window.__hmContent||[]).map(function(x){return String(x['Content ID'])===String(id)?updated:x;});if(typeof window.renderContent==='function')window.renderContent();else if(typeof window.contentBank==='function')window.contentBank();},function(e){btn.disabled=false;btn.textContent='Save Changes';notify('Unable to save content: '+(e&&e.message?e.message:String(e)),'err');});}
function selectOpts(arr,current){return arr.map(function(x){return'<option value="'+esc(x)+'"'+(String(x)===String(current)?' selected':'')+'>'+esc(x)+'</option>';}).join('');}
function formatInputDate(v){if(!v)return'';var s=String(v);if(/^\\d{4}-\\d{2}-\\d{2}$/.test(s))return s;var d=new Date(v);if(isNaN(d))return'';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
var obs=new MutationObserver(function(){bindRows();});window.addEventListener('load',function(){var c=document.getElementById('content');if(c)obs.observe(c,{childList:true,subtree:true});setTimeout(bindRows,500);});
document.addEventListener('click',function(ev){var btn=ev.target&&ev.target.closest?ev.target.closest('#hmSaveContent'):null;if(!btn)return;ev.preventDefault();ev.stopPropagation();var id=btn.getAttribute('data-content-id');saveContent(id);},true);
window.saveContent=saveContent;window.openContentDetail=open;
})();
</script>
