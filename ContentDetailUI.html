<style>
.hm-content-clickable{cursor:pointer}.hm-content-clickable:hover{background:#fafbff!important}.hm-content-detail{display:grid;gap:16px}.hm-content-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hm-content-detail-item{border:1px solid #e6eaf0;border-radius:9px;padding:11px;background:#fbfcfe}.hm-content-detail-label{font-size:9px;text-transform:uppercase;color:#8a94a4;font-weight:800;margin-bottom:5px}.hm-content-detail-value{font-size:12px;color:#172033;white-space:pre-wrap}.hm-content-task{border:1px solid #e6eaf0;border-radius:9px;padding:12px}.hm-content-task strong{font-size:12px}.hm-content-task small{display:block;color:#748094;margin-top:5px}.hm-content-empty{padding:16px;border:1px dashed #d9dfe8;border-radius:9px;color:#748094;font-size:11px}@media(max-width:700px){.hm-content-detail-grid{grid-template-columns:1fr}}
</style>
<script>
(function(){
  'use strict';
  function esc(v){return String(v==null?'':v).replace(/[&<>\\"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[c];});}
  function call(name,args,ok,fail){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(fail||function(e){if(window.toast)toast(e.message||String(e),'err');});return args===undefined?r[name]():r[name].apply(r,args);}
  function findContentId(row){var sub=row.querySelector('.hm-content-sub');var text=sub?sub.textContent:'';var m=text.match(/(CNT-[A-Za-z0-9_-]+)/);return m?m[1]:'';}
  function bindRows(){var rows=document.querySelectorAll('#hmContentRows tr');Array.prototype.forEach.call(rows,function(row){if(row.dataset.hmContentBound)return;var id=findContentId(row);if(!id)return;row.dataset.hmContentBound='1';row.classList.add('hm-content-clickable');row.title='Open content details';row.addEventListener('click',function(){open(id);});});}
  function open(id){var item=(window.__hmContent||[]).find(function(x){return String(x['Content ID'])===String(id);});if(!item)return;document.getElementById('modalTitle').textContent='Content Details';var b=document.getElementById('modalBody');if(!b)return;b.innerHTML='<div class="hm-content-detail"><div class="hm-content-detail-grid">'+field('Content Title',item.Title)+field('Content ID',item['Content ID'])+field('Platform',item.Platform)+field('Content Type',item['Content Type'])+field('Status',item.Status)+field('Priority',item.Priority)+field('Assigned To',item['Assigned To'])+field('Publish Date',formatDate(item['Publish Date']))+'</div><div class="hm-content-detail-item"><div class="hm-content-detail-label">Creative Brief</div><div class="hm-content-detail-value">'+esc(item['Creative Brief']||'-')+'</div></div><div class="hm-content-detail-item"><div class="hm-content-detail-label">Assets / Instructions</div><div class="hm-content-detail-value">'+esc(item['Assets / Instructions']||'-')+'</div></div><div><div class="hm-content-detail-label" style="margin-bottom:8px">Linked Tasks</div><div id="hmContentLinkedTasks" class="hm-content-empty">Loading linked tasks...</div></div><div class="form-actions"><button class="secondary" onclick="closeModal()">Close</button></div></div>';document.getElementById('modalBg').classList.add('show');call('getContentTaskBundle',[id],function(bundle){var x=document.getElementById('hmContentLinkedTasks');if(!x)return;var tasks=bundle&&Array.isArray(bundle.tasks)?bundle.tasks:[];if(!tasks.length){x.innerHTML='No tasks linked to this content yet.';return;}x.className='';x.innerHTML=tasks.map(function(t){return'<div class="hm-content-task"><strong>'+esc(t['Task Name']||'-')+'</strong><small>Status: '+esc(t.Status||'-')+' · Assigned to: '+esc(t['Assigned To']||'-')+' · Due: '+esc(t['Due Date']||'-')+'</small></div>';}).join('');},function(err){var x=document.getElementById('hmContentLinkedTasks');if(x)x.innerHTML='Unable to load linked tasks: '+esc(err.message||err);});}
  function field(label,value){return'<div class="hm-content-detail-item"><div class="hm-content-detail-label">'+esc(label)+'</div><div class="hm-content-detail-value">'+esc(value||'-')+'</div></div>';}
  function formatDate(v){if(!v)return '-';var d=new Date(v);if(isNaN(d))return String(v);return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear();}
  var obs=new MutationObserver(function(){bindRows();});
  window.addEventListener('load',function(){var c=document.getElementById('content');if(c)obs.observe(c,{childList:true,subtree:true});setTimeout(bindRows,500);});
})();
</script>
