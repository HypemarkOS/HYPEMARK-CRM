<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HYPEMARK CRM</title>
  <style>
    :root{--ink:#172033;--muted:#748094;--line:#e6eaf0;--surface:#fff;--soft:#f5f7fb;--brand:#6d4aff;--brand2:#5840d8;--green:#16a673;--orange:#e48a18;--red:#d84b5b;--nav:#111827;--nav2:#1b2433}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--soft);color:var(--ink)}button,input,select,textarea{font:inherit}.app{display:flex;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:248px;background:var(--nav);color:#fff;padding:18px 14px;display:flex;flex-direction:column;z-index:10}.brand{padding:9px 12px 24px;font-size:21px;font-weight:850}.brand span{color:#9d8cff}.nav{display:grid;gap:4px}.section{padding:16px 12px 5px;color:#69778d;text-transform:uppercase;font-size:9px;font-weight:800;letter-spacing:1px}.nav button{width:100%;border:0;background:transparent;color:#aeb8c8;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer;font-size:13px}.nav button:hover,.nav button.active{background:var(--nav2);color:#fff}.foot{margin-top:auto;color:#657289;font-size:10px;padding:12px}.main{margin-left:248px;flex:1;min-width:0}.top{position:sticky;top:0;height:72px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;z-index:8}.crumb{font-size:11px;color:var(--muted)}.title{font-size:20px;font-weight:800;margin-top:3px}.top-actions{display:flex;gap:10px;align-items:center}.search{width:250px;height:38px;border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:0 12px;outline:none}.user{background:var(--soft);border:1px solid var(--line);padding:9px 13px;border-radius:20px;font-size:11px;color:var(--muted)}.content{padding:28px 30px 50px;max-width:1550px}.hero{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}.hero h1{margin:0;font-size:30px;letter-spacing:-.8px}.hero p{margin:6px 0 0;color:var(--muted);font-size:12px}.primary,.save{border:0;background:var(--brand);color:#fff;padding:11px 16px;border-radius:9px;font-weight:750;cursor:pointer;box-shadow:0 8px 18px rgba(109,74,255,.18)}.primary:hover,.save:hover{background:var(--brand2)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 5px 18px rgba(24,32,42,.035)}.stat{padding:17px}.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.55px;font-weight:750}.value{font-size:25px;font-weight:850;margin-top:10px}.sub{font-size:10px;color:var(--muted);margin-top:5px}.green{color:var(--green)}.orange{color:var(--orange)}.red{color:var(--red)}.money{font-variant-numeric:tabular-nums}.panels{display:grid;grid-template-columns:1.25fr .75fr;gap:17px}.panel{padding:18px}.panel h2{font-size:15px;margin:0}.panel p{font-size:10px;color:var(--muted);margin:5px 0 15px}.panel-head{display:flex;justify-content:space-between;align-items:flex-start}.profit-row{display:grid;grid-template-columns:1.3fr repeat(4,.8fr);gap:9px;padding:11px 0;border-bottom:1px solid var(--line);font-size:11px;align-items:center}.profit-head{font-size:9px;text-transform:uppercase;color:#8a94a4;font-weight:800}.pill{display:inline-flex;padding:4px 7px;border-radius:14px;font-size:9px;font-weight:800}.pill.green{background:#eaf8f2}.pill.orange{background:#fff4df}.pill.red{background:#fff0f2}.attention{display:grid;gap:8px}.alert{padding:11px 12px;border-radius:9px;font-size:11px;display:flex;justify-content:space-between;gap:10px;align-items:center}.alert.green{background:#eaf8f2}.alert.orange{background:#fff4df}.alert.red{background:#fff0f2}.activity{display:grid}.act{padding:10px 0;border-bottom:1px solid var(--line);font-size:11px}.act small{display:block;color:var(--muted);margin-top:4px;font-size:9px}.empty,.loading{padding:28px;text-align:center;color:var(--muted);font-size:11px}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid #d9dfe8;background:#fff;border-radius:8px;padding:10px 11px;outline:none}.toolbar input{flex:1}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th{text-align:left;background:#fbfcfe;color:#8a94a4;text-transform:uppercase;font-size:9px;padding:12px;border-bottom:1px solid var(--line)}.table td{padding:12px;border-bottom:1px solid var(--line);font-size:11px}.table tr:hover{background:#fafbff}.tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 13px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700}.tab.active{background:#eeeaff;color:var(--brand);border-color:#c9c0ff}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;font-weight:750;color:#4f5a6d}.field textarea{min-height:70px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;margin-top:15px}.secondary{border:0;background:#eef0f4;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}.notice{padding:10px 12px;border-radius:8px;font-size:10px;margin-top:12px}.notice.ok{background:#eaf8f2;color:#137b59}.notice.err{background:#fff0f2;color:#bd3c4d}.module-card{padding:18px}.status{display:inline-flex;padding:4px 8px;border-radius:14px;font-size:9px;font-weight:800}.status.green{background:#eaf8f2}.status.orange{background:#fff4df}.status.red{background:#fff0f2}.modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.48);display:none;align-items:center;justify-content:center;padding:25px;z-index:30}.modal-bg.show{display:flex}.modal{width:min(900px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px}.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-body{padding:20px}.close{border:0;background:#eef0f4;border-radius:50%;width:32px;height:32px;cursor:pointer}.toast{position:fixed;right:24px;bottom:24px;background:#172033;color:#fff;padding:11px 15px;border-radius:9px;font-size:11px;display:none;z-index:40}.toast.show{display:block}.toast.ok{background:#13815d}.toast.err{background:#c43c4d}
    @media(max-width:1050px){.grid{grid-template-columns:1fr 1fr}.panels{grid-template-columns:1fr}}@media(max-width:700px){.side{width:68px;padding:12px 8px}.brand{font-size:0;text-align:center}.brand span{font-size:18px}.nav button{font-size:0;text-align:center}.section,.foot{display:none}.main{margin-left:68px}.top{padding:0 15px}.top-actions .search{display:none}.content{padding:20px 14px}.grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{align-items:flex-start;gap:10px}.hero h1{font-size:24px}}
  </style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">HYPE<span>MARK</span></div><nav class="nav">
<button data-page="dashboard" onclick="show('dashboard')">▦ &nbsp; Dashboard</button>
<div class="section">Workspace</div><button data-page="clients" onclick="show('clients')">◉ &nbsp; Clients</button><button data-page="projects" onclick="show('projects')">▣ &nbsp; Projects</button><button data-page="deliverables" onclick="show('deliverables')">✓ &nbsp; Deliverables</button><button data-page="content" onclick="show('content')">▤ &nbsp; Content Bank</button>
<div class="section">Finance</div><button data-page="payments" onclick="show('payments')">₹ &nbsp; Payments</button><button data-page="reports" onclick="show('reports')">◒ &nbsp; Reports</button>
<div class="section">Control</div><button data-page="activities" onclick="show('activities')">◌ &nbsp; Activities</button><button data-page="settings" onclick="show('settings')">⚙ &nbsp; Settings</button>
</nav><div class="foot">HYPEMARK CRM v1.0 · Internal Workspace</div></aside>
<main class="main"><header class="top"><div><div id="crumb" class="crumb">Workspace / Dashboard</div><div class="title">HYPEMARK CRM</div></div><div class="top-actions"><input id="globalSearch" class="search" placeholder="Search CRM..." oninput="globalSearch()"><div class="user">Internal Workspace</div></div></header><section id="content" class="content"></section></main>
</div>
<div id="modalBg" class="modal-bg"><div class="modal"><div class="modal-head"><strong id="modalTitle">Add Client</strong><button class="close" onclick="closeModal()">×</button></div><div class="modal-body" id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
var state={clients:[],options:null,receipts:[],payments:[],activities:[],loaded:false};
function esc(v){return String(v==null?'':v).replace(/[&<>\'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
function money(v){return '₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function run(name,args,ok,err){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(err||function(e){toast(e.message||String(e),'err')});return args===undefined?r[name]():r[name].apply(r,args)}
function show(page){history.replaceState({},'',location.pathname+'?page='+page);document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('active',b.dataset.page===page)});document.getElementById('crumb').textContent='Workspace / '+page.charAt(0).toUpperCase()+page.slice(1);if(page==='dashboard')dashboard();else if(page==='clients')clients();else if(page==='payments')payments();else if(page==='activities')activities();else placeholder(page)}
function dashboard(){document.getElementById('content').innerHTML='<div class="hero"><div><h1>Dashboard</h1><p>Your business at a glance. Finance, clients and operations in one place.</p></div><button class="primary" onclick="openClient()">＋ Add Client</button></div><div id="stats" class="grid"><div class="card stat">Loading...</div></div><div class="panels"><div class="card panel"><h2>Client Profitability</h2><p>Revenue minus client-linked employee payments and business expenses.</p><div id="profits" class="loading">Loading...</div></div><div class="card panel"><h2>Attention Required</h2><p>Items that need action first.</p><div id="attention" class="attention"><div class="loading">Checking...</div></div></div></div><div class="card panel" style="margin-top:17px"><h2>Recent Activity</h2><p>Latest CRM actions, including edits.</p><div id="dashActs" class="activity loading">Loading...</div></div>';run('getDashboard',undefined,renderDashboard)}
function renderDashboard(d){d=d||{};document.getElementById('stats').innerHTML='<div class="card stat"><div class="label">Total Clients</div><div class="value">'+(d.totalClients||0)+'</div><div class="sub green">'+(d.activeClients||0)+' active</div></div><div class="card stat"><div class="label">Active Projects</div><div class="value">'+(d.totalProjects||0)+'</div><div class="sub">Across all clients</div></div><div class="card stat"><div class="label">Money Received</div><div class="value money">'+money(d.clientReceipts)+'</div><div class="sub green">Client receipts</div></div><div class="card stat"><div class="label">Total Costs</div><div class="value money">'+money(Number(d.employeePayments||0)+Number(d.miscExpenses||0))+'</div><div class="sub">Employee + business expenses</div></div>';var rows=d.clientProfitability||[];document.getElementById('profits').innerHTML=rows.length?'<div class="profit-row profit-head"><div>Client</div><div>Revenue</div><div>Cost</div><div>Profit</div><div>Margin</div></div>'+rows.slice(0,8).map(function(r){var p=Number(r.profit||0),c=p<0?'red':p===0?'orange':'green';return '<div class="profit-row"><strong>'+esc(r.clientName||r.clientId)+'</strong><span>'+money(r.revenue)+'</span><span>'+money(r.cost)+'</span><span class="'+c+'">'+money(p)+'</span><span class="pill '+c+'">'+Number(r.margin||0).toFixed(1)+'%</span></div>'}).join(''):'<div class="empty">No client finance data yet.</div>';var a=[];if(Number(d.unallocatedBalance||0)>0)a.push('<div class="alert orange"><span>Unallocated client receipts</span><strong>'+money(d.unallocatedBalance)+'</strong></div>');if(!a.length)a.push('<div class="alert green"><span>Finance</span><strong>On track</strong></div>');document.getElementById('attention').innerHTML=a.join('');var acts=d.recentActivities||[];document.getElementById('dashActs').className='activity';document.getElementById('dashActs').innerHTML=acts.length?acts.slice(0,8).map(activityRow).join(''):'<div class="empty">No activity yet.</div>'}
function activityRow(x){return '<div class="act"><strong>'+esc(x.Action||'Activity')+'</strong><small>'+esc(x.Entity||'')+' · '+esc(x['Entity ID']||'')+' · '+esc(x.User||'')+' · '+esc(x['Date Time']||'')+'</small></div>'}
function clients(){document.getElementById('content').innerHTML='<div class="hero"><div><h1>Clients</h1><p>Manage every client relationship from one clean workspace.</p></div><button class="primary" onclick="openClient()">＋ Add Client</button></div><div class="toolbar"><input id="clientSearch" placeholder="Search client, business, contact, mobile or email..." oninput="renderClients()"><select id="clientStatus" onchange="renderClients()"><option value="">All statuses</option><option>Active</option><option>Inactive</option></select></div><div class="card table-wrap"><div id="clientTable" class="loading">Loading clients...</div></div>';if(state.clients.length)renderClients();else run('getClients',undefined,function(d){state.clients=d||[];renderClients()})}
function renderClients(){var q=(document.getElementById('clientSearch').value||'').toLowerCase(),s=document.getElementById('clientStatus').value,list=state.clients.filter(function(c){var t=[c['Client Name'],c['Business Name'],c['Contact Person'],c.Mobile,c.Email].join(' ').toLowerCase();return(!q||t.indexOf(q)>-1)&&(!s||c.Status===s)});document.getElementById('clientTable').innerHTML=list.length?'<table class="table"><thead><tr><th>Client</th><th>Contact</th><th>Mobile</th><th>Email</th><th>Status</th><th>Created</th></tr></thead><tbody>'+list.map(function(c){return '<tr onclick="openClient(\''+esc(c['Client ID']).replace(/'/g,"\\'")+'\')"><td><strong>'+esc(c['Client Name'])+'</strong><div style="color:var(--muted);font-size:9px">'+esc(c['Business Name'])+'</div></td><td>'+esc(c['Contact Person']||'-')+'</td><td>'+esc(c.Mobile||'-')+'</td><td>'+esc(c.Email||'-')+'</td><td><span class="status '+(c.Status==='Active'?'green':'red')+'">'+esc(c.Status||'-')+'</span></td><td>'+esc(c['Created On']||'-')+'</td></tr>'}).join('')+'</tbody></table>':'<div class="empty">No clients found.</div>'}
function openClient(id){var c=id?state.clients.find(function(x){return String(x['Client ID'])===String(id)}):null;document.getElementById('modalTitle').textContent=c?'Edit Client':'Add Client';document.getElementById('modalBody').innerHTML='<form id="clientForm"><input type="hidden" id="cid" value="'+esc(c?c['Client ID']:'')+'"><div class="form-grid"><div class="field"><label>Client Name *</label><input id="cn" required value="'+esc(c?c['Client Name']:'')+'"></div><div class="field"><label>Business Name *</label><input id="bn" required value="'+esc(c?c['Business Name']:'')+'"></div><div class="field"><label>Contact Person</label><input id="cp" value="'+esc(c?c['Contact Person']:'')+'"></div><div class="field"><label>Mobile</label><input id="mob" value="'+esc(c?c.Mobile:'')+'"></div><div class="field"><label>Email</label><input id="em" type="email" value="'+esc(c?c.Email:'')+'"></div><div class="field"><label>GST</label><input id="gst" value="'+esc(c?c.GST:'')+'"></div><div class="field full"><label>Address</label><textarea id="addr">'+esc(c?c.Address:'')+'</textarea></div></div><div class="form-actions"><button class="save" type="submit">Save Changes</button></div></form>';document.getElementById('modalBg').classList.add('show');document.getElementById('clientForm').onsubmit=function(e){e.preventDefault();var data={clientName:cn.value,businessName:bn.value,contactPerson:cp.value,mobile:mob.value,email:em.value,gst:gst.value,address:addr.value},idv=cid.value;run(idv?'updateClient':'createClient',idv?[idv,data]:[data],function(saved){var i=state.clients.findIndex(function(x){return String(x['Client ID'])===String(saved['Client ID'])});if(i>-1)state.clients[i]=saved;else state.clients.push(saved);closeModal();toast(idv?'Client updated.':'Client created.','ok');if(document.querySelector('[data-page="clients"].active'))renderClients()})}}
function payments(){document.getElementById('content').innerHTML='<div class="hero"><div><h1>Payments</h1><p>Track money received, employee/partner payments, commissions and business expenses.</p></div></div><div class="tabs"><button class="tab active" onclick="paymentTab(\'Client Receipt\',this)">Money Received</button><button class="tab" onclick="paymentTab(\'Employee Payment\',this)">Employee & Partner Payments</button><button class="tab" onclick="paymentTab(\'Business Expense\',this)">Business Expenses</button></div><div id="paymentForm" class="card panel"></div><div id="paymentList" class="card panel" style="margin-top:15px"><div class="loading">Loading finance data...</div></div>';loadPaymentData(function(){paymentTab('Client Receipt',document.querySelector('.tab.active'))})}
function loadPaymentData(done){run('getPaymentOptions',undefined,function(o){state.options=o;run('getReceiptOptions',undefined,function(r){state.receipts=r||[];run('getPayments',undefined,function(p){state.payments=p||[];done()})})})}
function clientOptions(selected){return '<option value="">Select client</option>'+state.clients.map(function(c){return '<option value="'+esc(c['Client ID'])+'" '+(selected===c['Client ID']?'selected':'')+'>'+esc(c['Client Name'])+' · '+esc(c['Business Name'])+'</option>'}).join('')}
function selectOptions(arr){return (arr||[]).map(function(x){return '<option>'+esc(x)+'</option>'}).join('')}
function paymentTab(type,btn){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});if(btn)btn.classList.add('active');var o=state.options||{};var html='';if(type==='Client Receipt')html='<form onsubmit="savePayment(event,\'Client Receipt\')"><div class="form-grid"><div class="field"><label>Client *</label><select id="pclient" required>'+clientOptions()+'</select></div><div class="field"><label>Amount *</label><input id="pamount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Received By</label><select id="preceived"><option value="">Select account</option>'+selectOptions(o.paymentAccounts)+'</select></div><div class="field"><label>Payment Mode</label><select id="pmode"><option value="">Select</option>'+selectOptions(o.paymentModes)+'</select></div><div class="field"><label>Payment Date</label><input id="pdate" type="date"></div><div class="field"><label>Reference</label><input id="pref"></div><div class="field full"><label>Notes</label><textarea id="pnotes"></textarea></div></div><div class="form-actions"><button class="save">Record Receipt</button></div></form>';else if(type==='Employee Payment')html='<form onsubmit="savePayment(event,\'Employee Payment\')"><div class="form-grid"><div class="field"><label>Employee / Partner *</label><select id="pemployee" required><option value="">Select recipient</option>'+selectOptions(o.employees)+'</select></div><div class="field"><label>Client</label><select id="pclient">'+clientOptions()+'</select></div><div class="field"><label>Payment Type *</label><select id="ptype" onchange="toggleCommission()" required>'+selectOptions(o.employeePaymentTypes)+'</select></div><div class="field"><label>Amount</label><input id="pamount" type="number" min="0.01" step="0.01"></div><div class="field"><label>Receipt / Source</label><select id="preceipt"><option value="">Not linked</option>'+state.receipts.map(function(r){return '<option value="'+esc(r.receiptId)+'">'+esc(r.receiptId)+' · '+money(r.remaining)+' remaining</option>'}).join('')+'</select></div><div class="field"><label>Paid From</label><select id="ppaidfrom"><option value="">Select account</option>'+selectOptions(o.paymentAccounts)+'</select></div><div id="commissionFields" class="field full" style="display:none"><div class="form-grid"><div class="field"><label>Commission %</label><input id="cpercent" type="number" min="0" max="100" step="0.01"></div><div class="field"><label>Commission Base Amount</label><input id="cbase" type="number" min="0" step="0.01"></div></div></div><div class="field"><label>Payment Date</label><input id="pdate" type="date"></div><div class="field"><label>Payment Mode</label><select id="pmode"><option value="">Select</option>'+selectOptions(o.paymentModes)+'</select></div><div class="field full"><label>Notes</label><textarea id="pnotes"></textarea></div></div><div class="form-actions"><button class="save">Record Payment</button></div></form>';else html='<form onsubmit="savePayment(event,\'Business Expense\')"><div class="form-grid"><div class="field"><label>Client</label><select id="pclient">'+clientOptions()+'</select></div><div class="field"><label>Expense Category *</label><select id="pcat" required>'+selectOptions(o.expenseCategories)+'</select></div><div class="field"><label>Related To *</label><select id="prelated" required>'+selectOptions(o.expenseContexts)+'</select></div><div class="field"><label>Amount *</label><input id="pamount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Paid By</label><select id="paidby"><option value="">Select person</option>'+selectOptions(o.paidBy)+'</select></div><div class="field"><label>Paid To / Vendor</label><input id="paidto"></div><div class="field"><label>Receipt / Source</label><select id="preceipt"><option value="">Not linked</option>'+state.receipts.map(function(r){return '<option value="'+esc(r.receiptId)+'">'+esc(r.receiptId)+' · '+money(r.remaining)+' remaining</option>'}).join('')+'</select></div><div class="field"><label>Payment Date</label><input id="pdate" type="date"></div><div class="field"><label>Payment Mode</label><select id="pmode"><option value="">Select</option>'+selectOptions(o.paymentModes)+'</select></div><div class="field"><label>Reference</label><input id="pref"></div><div class="field full"><label>Description</label><textarea id="pnotes" placeholder="e.g. Petrol for FeedBazaar shoot / client meeting transport"></textarea></div></div><div class="form-actions"><button class="save">Record Expense</button></div></form>';document.getElementById('paymentForm').innerHTML=html;renderPayments()}
function toggleCommission(){var show=document.getElementById('ptype').value==='Commission';document.getElementById('commissionFields').style.display=show?'block':'none';if(show)document.getElementById('pamount').placeholder='Auto-calculated from commission'}
function savePayment(e,type){e.preventDefault();var d={type:type,clientId:(document.getElementById('pclient')||{}).value||'',amount:(document.getElementById('pamount')||{}).value||'',paymentDate:(document.getElementById('pdate')||{}).value||'',paymentMode:(document.getElementById('pmode')||{}).value||'',reference:(document.getElementById('pref')||{}).value||'',notes:(document.getElementById('pnotes')||{}).value||''};if(type==='Client Receipt')d.receivedBy=preceived.value;else if(type==='Employee Payment'){d.employee=pemployee.value;d.paymentType=ptype.value;d.receiptId=preceipt.value;d.paidFrom=ppaidfrom.value;d.commissionPercent=(document.getElementById('cpercent')||{}).value||'';d.commissionBaseAmount=(document.getElementById('cbase')||{}).value||''}else{d.expenseCategory=pcat.value;d.relatedTo=prelated.value;d.receiptId=preceipt.value;d.paidBy=paidby.value;d.paidTo=paidto.value;d.description=pnotes.value}run('createPayment',[d],function(){toast('Payment recorded successfully.','ok');payments()})}
function renderPayments(){var rows=state.payments||[];if(!rows.length){document.getElementById('paymentList').innerHTML='<div class="empty">No payment records yet.</div>';return}var names={};state.clients.forEach(function(c){names[c['Client ID']]=c['Client Name']});document.getElementById('paymentList').innerHTML='<h2>Recent Finance Records</h2><p>Every receipt, employee/partner payment and business expense is retained for reporting.</p><div class="table-wrap"><table class="table"><thead><tr><th>Type</th><th>Client</th><th>Amount</th><th>Details</th><th>Date</th><th>Status</th></tr></thead><tbody>'+rows.slice(-30).reverse().map(function(r){var detail=r.Type==='Employee Payment'?(r.Employee+' · '+r['Payment Type']):r.Type==='Business Expense'?(r['Expense Category']+' · '+r['Related To']):('Received by '+(r['Received By']||'-'));return '<tr><td>'+esc(r.Type)+'</td><td>'+esc(names[r['Client ID']]||'-')+'</td><td class="money">'+money(r.Amount)+'</td><td>'+esc(detail)+'</td><td>'+esc(r['Payment Date']||r['Expense Date']||'-')+'</td><td><span class="status green">'+esc(r.Status||'Recorded')+'</span></td></tr>'}).join('')+'</tbody></table></div>'}
function activities(){document.getElementById('content').innerHTML='<div class="hero"><div><h1>Activities</h1><p>A complete audit trail of CRM actions and edits.</p></div></div><div class="card panel"><div id="activityList" class="loading">Loading activity...</div></div>';run('getActivities',undefined,function(a){state.activities=a||[];document.getElementById('activityList').className='activity';document.getElementById('activityList').innerHTML=state.activities.length?state.activities.map(activityRow).join(''):'<div class="empty">No activity yet.</div>'})}
function placeholder(page){var titles={projects:'Projects',deliverables:'Deliverables',content:'Content Bank',reports:'Reports',settings:'Settings'};document.getElementById('content').innerHTML='<div class="hero"><div><h1>'+titles[page]+'</h1><p>This module is connected to the CRM shell and will use the same interactive workspace.</p></div></div><div class="card module-card"><div class="alert green"><span>Module shell ready</span><strong>Next build stage</strong></div><p style="color:var(--muted);font-size:11px">No blank pages. This area is reserved for the next functional module.</p></div>'}
function globalSearch(){var q=document.getElementById('globalSearch').value.trim();if(q.length>1&&document.querySelector('[data-page="clients"].active')){document.getElementById('clientSearch').value=q;renderClients()}}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}
function toast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+(type||'');setTimeout(function(){t.className='toast'},2500)}
document.getElementById('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()});
run('getClients',undefined,function(d){state.clients=d||[];state.loaded=true;var p=new URLSearchParams(location.search).get('page')||'dashboard';show(p)})
</script>
</body>
</html>
