<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HYPEMARK CRM Dashboard</title>
  <style>
    :root{--ink:#18202a;--muted:#718096;--line:#e7ebf0;--surface:#fff;--soft:#f6f8fb;--brand:#6d4aff;--green:#16a673;--orange:#d98a00;--red:#d94b5b;--blue:#3978d7;--dark:#111827}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--ink);background:#f5f7fa}.app{display:flex;min-height:100vh}.sidebar{width:235px;background:var(--dark);color:#fff;padding:24px 16px;display:flex;flex-direction:column}.logo{font-size:20px;font-weight:800;padding:8px 10px 28px}.logo span{color:#9c88ff}.nav{display:grid;gap:6px}.nav a{border:0;background:transparent;color:#aeb7c7;text-align:left;padding:12px 13px;border-radius:10px;cursor:pointer;text-decoration:none;font-size:14px}.nav a.active,.nav a:hover{background:#20293a;color:#fff}.sidebar-foot{margin-top:auto;color:#68758a;font-size:11px;padding:12px}.main{flex:1;min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.crumb{font-size:13px;color:var(--muted)}.title{font-size:22px;font-weight:750;margin-top:3px}.user-pill{background:var(--soft);border:1px solid var(--line);padding:9px 13px;border-radius:20px;font-size:12px;color:var(--muted)}.content{padding:28px 32px 42px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.hero h1{margin:0;font-size:28px;letter-spacing:-.7px}.hero p{margin:7px 0 0;color:var(--muted);font-size:13px}.primary{border:0;background:var(--brand);color:#fff;padding:11px 16px;border-radius:9px;font-weight:700;cursor:pointer;box-shadow:0 8px 18px rgba(109,74,255,.2)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:0 5px 18px rgba(24,32,42,.03)}.stat{padding:18px}.label{font-size:12px;color:var(--muted)}.value{font-size:25px;font-weight:800;margin-top:7px}.note{font-size:11px;margin-top:5px;color:var(--muted)}.green{color:var(--green)}.orange{color:var(--orange)}.red{color:var(--red)}.blue{color:var(--blue)}.section{padding:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section-title{font-size:15px;font-weight:800}.section-sub{font-size:11px;color:var(--muted)}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-bottom:18px}.bar{height:9px;background:#edf0f4;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;border-radius:10px;background:var(--brand)}.profit-row{display:grid;grid-template-columns:1.5fr .8fr .8fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}.profit-row:last-child{border-bottom:0}.money{font-weight:800;text-align:right}.attention{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}.dot{width:9px;height:9px;border-radius:50%;flex:none}.activity{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:11px}.activity:last-child{border-bottom:0}.muted{color:var(--muted)}.loading{text-align:center;padding:60px;color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:700px){.sidebar{width:72px}.logo{font-size:0}.logo span{font-size:18px}.nav a{font-size:0;text-align:center}.content{padding:20px 14px}.topbar{padding:0 16px}.grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">HYPE<span>MARK</span></div>
    <nav class="nav">
      <a class="active" href="?page=dashboard">▦ &nbsp; Dashboard</a>
      <a href="?page=clients">◉ &nbsp; Clients</a>
      <a href="?page=projects">▣ &nbsp; Projects</a>
      <a href="?page=deliverables">✓ &nbsp; Deliverables</a>
      <a href="?page=payments">₹ &nbsp; Payments</a>
      <a href="?page=activities">◌ &nbsp; Activities</a>
    </nav>
    <div class="sidebar-foot">HYPEMARK CRM v1.0</div>
  </aside>
  <main class="main">
    <header class="topbar"><div><div class="crumb">Workspace / Dashboard</div><div class="title">HYPEMARK CRM</div></div><div class="user-pill">Internal Workspace</div></header>
    <section class="content">
      <div class="hero"><div><h1>Dashboard</h1><p>One screen to understand what is happening across HYPEMARK.</p></div><a class="primary" href="?page=clients" style="text-decoration:none">＋ Add / Manage Clients</a></div>
      <div id="app"><div class="loading">Loading dashboard...</div></div>
    </section>
  </main>
</div>
<script>
function money(v){return '₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:0})}
function esc(v){return String(v==null?'':v).replace(/[&<>\'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
function render(d){
  var p=d.clientProfitability||[], activities=d.recentActivities||[];
  var top=p.slice(0,5), attention=[];
  if(Number(d.unallocatedAmount||0)>0) attention.push(['orange','₹'+Number(d.unallocatedAmount).toLocaleString('en-IN')+' remains unallocated from client receipts.']);
  if(Number(d.overdueProjects||0)>0) attention.push(['red',d.overdueProjects+' project(s) are overdue.']);
  if(Number(d.pendingReceipts||0)>0) attention.push(['orange',d.pendingReceipts+' client receipt(s) need attention.']);
  if(!attention.length) attention.push(['green','Everything currently recorded is on track.']);
  var max=Math.max.apply(null,top.map(function(x){return Math.abs(Number(x.profit||0));}).concat([1]));
  var html='<div class="grid">'+
    stat('Total Clients',d.totalClients,'All recorded clients','green')+
    stat('Active Clients',d.activeClients,'Currently active','green')+
    stat('Active Projects',d.activeProjects,'of '+d.totalProjects+' total projects','blue')+
    stat('Overdue Projects',d.overdueProjects,'Needs immediate attention',d.overdueProjects?'red':'green')+
    stat('Money Received',money(d.clientReceipts),'Client receipts','green')+
    stat('Employee / Partner Payouts',money(d.employeePayments),'Salary, commission, freelance etc.','orange')+
    stat('Business Expenses',money(d.miscExpenses),'Client + general expenses','orange')+
    stat('Unallocated Balance',money(d.unallocatedAmount),'Still available from receipts',d.unallocatedAmount?'orange':'green')+
  '</div>';
  html+='<div class="two"><div class="card section"><div class="section-head"><div><div class="section-title">Client Profitability</div><div class="section-sub">Revenue minus employee/partner payments and business expenses</div></div></div>';
  if(top.length){top.forEach(function(x){var cls=x.profit>=0?'green':'red';html+='<div class="profit-row"><div><strong>'+esc(x.clientName)+'</strong><div class="muted">'+esc(x.businessName||'')+'</div></div><div class="money">'+money(x.revenue)+'</div><div class="money '+cls+'">'+money(x.profit)+'</div></div><div style="padding:4px 0 10px"><div class="bar"><span style="width:'+Math.min(100,Math.round(Math.abs(x.profit)/max*100))+'%"></span></div></div>'})}else html+='<div class="empty">Profitability will appear once client finance data is recorded.</div>';
  html+='</div><div class="card section"><div class="section-head"><div><div class="section-title">Attention Required</div><div class="section-sub">Items that deserve a look</div></div></div>';
  attention.forEach(function(a){html+='<div class="attention"><span class="dot" style="background:'+({green:'#16a673',orange:'#d98a00',red:'#d94b5b'}[a[0]])+'"></span><span>'+esc(a[1])+'</span></div>'});
  html+='</div></div>';
  html+='<div class="two"><div class="card section"><div class="section-head"><div><div class="section-title">Finance Snapshot</div><div class="section-sub">Current recorded movement</div></div></div>'+
    finance('Revenue received',d.clientReceipts,'green')+finance('Total costs',d.totalExpenses,'orange')+finance('Net contribution',d.netContribution,d.netContribution>=0?'green':'red')+finance('Allocated from receipts',d.allocatedAmount,'blue')+
    '</div><div class="card section"><div class="section-head"><div><div class="section-title">Recent Activity</div><div class="section-sub">Latest recorded actions</div></div></div>';
  if(activities.length) activities.forEach(function(a){html+='<div class="activity"><div class="muted">'+esc(a['Date Time']||'')+'</div><div><strong>'+esc(a.Action||'Activity')+'</strong><div class="muted">'+esc(a.Entity||'')+' '+esc(a['Entity ID']||'')+'</div></div></div>'});else html+='<div class="empty">No activity recorded yet.</div>';
  html+='</div></div>';
  document.getElementById('app').innerHTML=html;
}
function stat(label,value,note,cls){return '<div class="card stat"><div class="label">'+label+'</div><div class="value">'+value+'</div><div class="note '+cls+'">'+note+'</div></div>'}
function finance(label,value,cls){return '<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e7ebf0;font-size:13px"><span class="muted">'+label+'</span><strong class="'+cls+'">'+money(value)+'</strong></div>'}
google.script.run.withSuccessHandler(render).withFailureHandler(function(e){document.getElementById('app').innerHTML='<div class="card empty"><strong>Dashboard could not load</strong><br>'+esc(e.message||e)+'</div>'}).getDashboard();
</script>
</body>
</html>
