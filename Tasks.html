<script>
(function(){
  var tasks=[],opt={};
  var baseShow=window.show;
  window.tasks=function(){render();load();};
  window.show=function(page){if(page==='tasks'){history.replaceState({},'',location.pathname+'?page=tasks');tasks();return;}return baseShow.apply(this,arguments);};
  function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c];});}
  function call(n,a,ok){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(function(e){if(window.toast)toast(e.message||String(e),'err');});return a===undefined?r[n]():r[n].apply(r,a);}
  function render(){var c=document.getElementById('content');if(!c)return;c.innerHTML='<div class="hero"><div><h1>Tasks</h1><p>Assign, execute and review work across clients and projects.</p></div><button id="taskAdd" class="primary">＋ Create Task</button></div><div id="taskStats" class="grid"><div class="card stat"><div class="label">Today\'s Work</div><div class="value">...</div></div><div class="card stat"><div class="label">Due Today</div><div class="value">...</div></div><div class="card stat"><div class="label">Overdue</div><div class="value">...</div></div><div class="card stat"><div class="label">Completed This Week</div><div class="value">...</div></div></div><div class="card panel"><div class="toolbar"><input id="taskQ" placeholder="Search tasks..." oninput="window.__taskRender()"><select id="taskS" onchange="window.__taskRender()"><option value="">All statuses</option><option>To Do</option><option>In Progress</option><option>Pending Review</option><option>Completed</option><option>On Hold</option></select><select id="taskP" onchange="window.__taskRender()"><option value="">All priorities</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select><span id="taskCount" class="count">Loading...</span></div><div id="taskTable" class="table-wrap loading">Loading tasks...</div></div>';document.getElementById('taskAdd').onclick=function(){openTask();};window.__taskRender=table;}
  function load(){call('getTaskOptions',undefined,function(o){opt=o||{};call('getTasks',undefined,function(x){tasks=x||[];table();stats();});});}
  function stats(){call('getTaskDashboardStats',undefined,function(s){document.getElementById('taskStats').innerHTML='<div class="card stat"><div class="label">Today\'s Work</div><div class="value">'+(s.today||0)+'</div></div><div class="card stat"><div class="label">Due Today</div><div class="value orange">'+(s.dueToday||0)+'</div></div><div class="card stat"><div class="label">Overdue</div><div class="value red">'+(s.overdue||0)+'</div></div><div class="card stat"><div class="label">Completed This Week</div><div class="value green">'+(s.completedWeek||0)+'</div></div>';});}
  function client(id){var x=(opt.clients||[]).find(function(a){return String(a['Client ID'])===String(id);});return x?(x['Business Name']||x['Client Name']):id||'-';}
  function project(id){var x=(opt.projects||[]).find(function(a){return String(a['Project ID'])===String(id);});return x?x['Project Name']:id||'-';}
  function table(){var q=((document.getElementById('taskQ')||{}).value||'').toLowerCase(),s=(document.getElementById('taskS')||{}).value||'',p=(document.getElementById('taskP')||{}).value||'',list=tasks.filter(function(t){return(!q||JSON.stringify([t['Task Name'],client(t['Client ID']),project(t['Project ID']),t['Assigned To'],t.Notes]).toLowerCase().indexOf(q)>=0)&&(!s||t.Status===s)&&(!p||t.Priority===p);});document.getElementById('taskCount').textContent=list.length+' task'+(list.length===1?'':'s');var el=document.getElementById('taskTable');if(!list.length){el.innerHTML='<div class="empty">No tasks found.</div>';return;}el.className='table-wrap';el.innerHTML='<table class="table"><thead><tr><th>Task</th><th>Client / Project</th><th>Assigned To</th><th>Priority</th><th>Status</th><th>Due</th><th></th></tr></thead><tbody>'+list.map(function(t){return '<tr><td><strong>'+esc(t['Task Name'])+'</strong><div class="business">'+esc(t['Task ID'])+'</div></td><td>'+esc(client(t['Client ID']))+'<div class="business">'+esc(project(t['Project ID']))+'</div></td><td>'+esc(t['Assigned To'])+'</td><td>'+esc(t.Priority)+'</td><td><span class="status '+(t.Status==='Completed'?'green':t.Status==='Pending Review'?'orange':t.Status==='On Hold'?'red':'green')+'">'+esc(t.Status)+'</span></td><td>'+esc(t['Due Date']||'-')+'</td><td><button class="secondary" data-id="'+esc(t['Task ID'])+'">Open</button></td></tr>';}).join('')+'</tbody></table>';el.querySelectorAll('[data-id]').forEach(function(b){b.onclick=function(){openTask(b.getAttribute('data-id'));};});}
  function openTask(id){var t=id?tasks.find(function(x){return String(x['Task ID'])===String(id);}):null,manage=opt.currentUser&&['Admin','Manager'].indexOf(opt.currentUser.role)>=0,m=document.getElementById('modalBg'),body=document.getElementById('modalBody');if(!m||!body)return;document.getElementById('modalTitle').textContent=t?'Task Details':'Create Task';var clients=(opt.clients||[]).map(function(x){return'<option value="'+esc(x['Client ID'])+'">'+esc(x['Business Name']||x['Client Name'])+'</option>';}).join(''),ass=(opt.assignees||[]).map(function(x){return'<option value="'+esc(x.name)+'">'+esc(x.name)+' · '+esc(x.role)+'</option>';}).join('');body.innerHTML='<div class="form-grid"><div class="field full"><label>Task Name *</label><input id="fName" value="'+esc(t?t['Task Name']:'')+'" '+(t&&!manage?'disabled':'')+'></div><div class="field"><label>Client *</label><select id="fClient" '+(t&&!manage?'disabled':'')+'><option value="">Select client</option>'+clients+'</select></div><div class="field"><label>Project *</label><select id="fProject" '+(t&&!manage?'disabled':'')+'></select></div><div class="field"><label>Deliverable</label><select id="fDeliverable" '+(t&&!manage?'disabled':'')+'><option value="">None</option></select></div><div class="field"><label>Assigned To</label><select id="fAssign" '+(t&&!manage?'disabled':'')+'>'+ass+'</select></div><div class="field"><label>Priority</label><select id="fPriority" '+(t&&!manage?'disabled':'')+'><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></div><div class="field"><label>Status</label><select id="fStatus"><option>To Do</option><option>In Progress</option><option>Pending Review</option><option>Completed</option><option>On Hold</option></select></div><div class="field"><label>Start Date</label><input id="fStart" type="date" '+(t&&!manage?'disabled':'')+'></div><div class="field"><label>Due Date</label><input id="fDue" type="date" '+(t&&!manage?'disabled':'')+'></div><div class="field full"><label>Progress / Notes</label><textarea id="fNotes" placeholder="Add progress, blockers or handoff notes..."></textarea></div><div class="field full"><div id="fHistory" class="notice" style="background:#f7f8fb;color:#5d6673">Loading update history...</div></div></div><div class="form-actions"><button id="fClose" class="secondary">Close</button>'+(t&&opt.currentUser.role==='Admin'?'<button id="fDelete" class="secondary">Delete</button>':'')+(t&&manage&&t.Status==='Pending Review'?'<button id="fReject" class="secondary">Return for Revision</button><button id="fApprove" class="primary">Approve & Complete</button>':'')+'<button id="fSave" class="primary">'+(t?'Save Update':'Create Task')+'</button></div>';m.classList.add('show');document.getElementById('fClose').onclick=close;
    var cl=document.getElementById('fClient'),pr=document.getElementById('fProject'),dl=document.getElementById('fDeliverable');function projects(sel){var a=(opt.projects||[]).filter(function(x){return String(x['Client ID'])===String(cl.value);});pr.innerHTML='<option value="">Select project</option>'+a.map(function(x){return'<option value="'+esc(x['Project ID'])+'">'+esc(x['Project Name'])+'</option>';}).join('');if(sel)pr.value=sel;deliverables(t?t['Deliverable ID']:'');}function deliverables(sel){var a=(opt.deliverables||[]).filter(function(x){return String(x['Project ID'])===String(pr.value);});dl.innerHTML='<option value="">None</option>'+a.map(function(x){return'<option value="'+esc(x['Deliverable ID'])+'">'+esc(x.Type)+'</option>';}).join('');if(sel)dl.value=sel;}cl.value=t?t['Client ID']:'';cl.onchange=function(){projects('');};pr.onchange=function(){deliverables('');};projects(t?t['Project ID']:'');if(t){document.getElementById('fAssign').value=t['Assigned To'];document.getElementById('fPriority').value=t.Priority;document.getElementById('fStatus').value=t.Status;document.getElementById('fStart').value=dateInput(t['Start Date']);document.getElementById('fDue').value=dateInput(t['Due Date']);call('getTaskUpdates',[t['Task ID']],function(u){document.getElementById('fHistory').innerHTML=u.length?'<strong>Update history</strong><br>'+u.slice().reverse().slice(0,10).map(function(x){return'<div style="padding:6px 0;border-bottom:1px solid #e5e7eb"><strong>'+esc(x['Update By'])+'</strong> · '+esc(x.Status)+'<br><small>'+esc(x['Update Date'])+' · '+esc(x.Notes||'')+'</small></div>';}).join(''):'No updates yet.';}));}else{document.getElementById('fPriority').value='Medium';document.getElementById('fStatus').value='To Do';}document.getElementById('fSave').onclick=function(){save(t);};if(document.getElementById('fDelete'))document.getElementById('fDelete').onclick=function(){if(confirm('Delete this task permanently?'))call('deleteTask',[t['Task ID']],function(){close();tasks();toast('Task deleted.','ok');});};if(document.getElementById('fApprove'))document.getElementById('fApprove').onclick=function(){call('approveTask',[t['Task ID'],true,document.getElementById('fNotes').value],function(){close();tasks();toast('Task approved and completed.','ok');});};if(document.getElementById('fReject'))document.getElementById('fReject').onclick=function(){call('approveTask',[t['Task ID'],false,document.getElementById('fNotes').value],function(){close();tasks();toast('Task returned for revision.','ok');});};}
  function save(t){var d={taskName:document.getElementById('fName').value.trim(),clientId:document.getElementById('fClient').value,projectId:document.getElementById('fProject').value,deliverableId:document.getElementById('fDeliverable').value,assignedTo:document.getElementById('fAssign').value,priority:document.getElementById('fPriority').value,status:document.getElementById('fStatus').value,startDate:document.getElementById('fStart').value,dueDate:document.getElementById('fDue').value,notes:document.getElementById('fNotes').value,UpdateNotes:document.getElementById('fNotes').value};var b=document.getElementById('fSave');b.disabled=true;call(t?'updateTask':'createTask',[t?t['Task ID']:d,d],function(){close();tasks();toast(t?'Task updated successfully.':'Task created successfully.','ok');});}
  function dateInput(v){if(!v)return'';var m=String(v).match(/^(\d{1,2})-(\w{3})-(\d{4})/);if(!m)return'';var z={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};return m[3]+'-'+z[m[2]]+'-'+String(m[1]).padStart(2,'0');}
  function close(){document.getElementById('modalBg').classList.remove('show');}
  function nav(){var n=document.querySelector('.nav');if(!n||document.querySelector('[data-page="tasks"]'))return;var b=document.createElement('button');b.type='button';b.setAttribute('data-page','tasks');b.innerHTML='☑ &nbsp; Tasks';b.onclick=function(){window.show('tasks');};var p=n.querySelector('[data-page="projects"]');if(p)p.parentNode.insertBefore(b,p.nextSibling);else n.appendChild(b);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){nav();if(new URLSearchParams(location.search).get('page')==='tasks')window.show('tasks');});else{nav();if(new URLSearchParams(location.search).get('page')==='tasks')window.show('tasks');}
})();
</script>
