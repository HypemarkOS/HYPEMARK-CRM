<style id="hm-brand-fix-v10">
/* Exact HYPEMARK logo. Artwork is unchanged. Only the presentation gets a subtle premium 3D hover treatment. */
.brand{
  position:relative!important;
  height:184px!important;
  width:100%!important;
  margin:0 0 16px!important;
  padding:0!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  overflow:hidden!important;
  box-sizing:border-box!important;
  border-radius:24px!important;
  background:#fff!important;
  box-shadow:0 12px 30px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.9)!important;
  perspective:800px!important;
}
.brand > svg{
  display:block!important;
  width:auto!important;
  height:148px!important;
  max-width:88%!important;
  max-height:calc(100% - 24px)!important;
  overflow:visible!important;
  flex:0 0 auto!important;
  transform:translateZ(0) translateY(0) scale(1)!important;
  transform-origin:center center!important;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.14)) drop-shadow(0 7px 7px rgba(0,0,0,.20))!important;
  transition:transform .28s cubic-bezier(.2,.8,.2,1),filter .28s ease!important;
  will-change:transform,filter!important;
}
.brand > svg:hover{
  transform:translateZ(18px) translateY(-6px) scale(1.07) rotateX(3deg)!important;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.18)) drop-shadow(0 13px 12px rgba(0,0,0,.28))!important;
}
@media(max-width:700px){
  .brand{height:76px!important;border-radius:18px!important;margin-bottom:12px!important;perspective:600px!important}
  .brand > svg{height:58px!important;max-width:82%!important}
  .brand > svg:hover{transform:translateZ(8px) translateY(-3px) scale(1.04)!important}
}
</style>

  function renderExactHypeMark(){

    brand.innerHTML=exactLogoSvg;

})();
</script>
<script id="hm-client-modal-fix">
(function(){
  function escClient(v){return String(v==null?'':v).replace(/[&<>\'\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]})}
  window.openClient=function(id){
    var bg=document.getElementById('modalBg'),body=document.getElementById('modalBody'),title=document.getElementById('modalTitle');
    if(!bg||!body||!title){console.error('HYPEMARK CRM: Add Client modal container is missing.');return;}
    var existing=null;
    if(id&&window.state&&Array.isArray(state.clients)) existing=state.clients.find(function(c){return String(c['Client ID'])===String(id)})||null;
    title.textContent=existing?'Edit Client':'Add Client';
    body.innerHTML='<form id="hmClientForm" onsubmit="return hmSaveClient(event)"><div class="form-grid">'+
      '<div class="field"><label>Client Name *</label><input id="hmClientName" required></div>'+ 
      '<div class="field"><label>Business Name *</label><input id="hmBusinessName" required></div>'+ 
      '<div class="field"><label>Contact Person</label><input id="hmContactPerson"></div>'+ 
      '<div class="field"><label>Mobile</label><input id="hmMobile" inputmode="tel"></div>'+ 
      '<div class="field"><label>Email</label><input id="hmEmail" type="email"></div>'+ 
      '<div class="field"><label>GST</label><input id="hmGST"></div>'+ 
      '<div class="field full"><label>Address</label><textarea id="hmAddress"></textarea></div>'+ 
      '</div><div id="hmClientMsg" class="notice" style="display:none"></div><div class="form-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button id="hmClientSave" type="submit" class="save">'+(existing?'Save Changes':'Save Client')+'</button></div></form>';
    if(existing){
      document.getElementById('hmClientName').value=existing['Client Name']||'';
      document.getElementById('hmBusinessName').value=existing['Business Name']||'';
      document.getElementById('hmContactPerson').value=existing['Contact Person']||'';
      document.getElementById('hmMobile').value=existing.Mobile||'';
      document.getElementById('hmEmail').value=existing.Email||'';
      document.getElementById('hmGST').value=existing.GST||'';
      document.getElementById('hmAddress').value=existing.Address||'';
    }
    bg.classList.add('show');
  };
  window.hmSaveClient=function(e){
    e.preventDefault();
    var btn=document.getElementById('hmClientSave'),msg=document.getElementById('hmClientMsg');
    var id=(window.state&&state.editingClientId)||'';
    var data={clientName:document.getElementById('hmClientName').value.trim(),businessName:document.getElementById('hmBusinessName').value.trim(),contactPerson:document.getElementById('hmContactPerson').value.trim(),mobile:document.getElementById('hmMobile').value.trim(),email:document.getElementById('hmEmail').value.trim(),gst:document.getElementById('hmGST').value.trim(),address:document.getElementById('hmAddress').value.trim()};
    var existingId='';
    if(window.state&&Array.isArray(state.clients)&&state.clients.length){
      var match=state.clients.find(function(c){return String(c['Client Name']||'')===data.clientName&&String(c['Business Name']||'')===data.businessName});
      if(match&&document.getElementById('modalTitle').textContent==='Edit Client')existingId=String(match['Client ID']||'');
    }
    btn.disabled=true;btn.textContent='Saving...';msg.style.display='none';
    var runner=google.script.run.withSuccessHandler(function(saved){
      if(window.state&&Array.isArray(state.clients)){
        var i=state.clients.findIndex(function(c){return String(c['Client ID'])===String(saved['Client ID'])});
        if(i>=0)state.clients[i]=saved;else state.clients.push(saved);
        state.editingClientId='';
      }
      closeModal();
      if(typeof renderClientsPro==='function')renderClientsPro();
      toast('Client '+(existingId?'updated':'created')+' successfully.','ok');
    }).withFailureHandler(function(err){
      btn.disabled=false;btn.textContent=document.getElementById('modalTitle').textContent==='Edit Client'?'Save Changes':'Save Client';msg.style.display='block';msg.className='notice err';msg.textContent=err&&err.message?err.message:String(err);
    });
    if(existingId)runner.updateClient(existingId,data);else runner.createClient(data);
    return false;
  };
})();
</script>
