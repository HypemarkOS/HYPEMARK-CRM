<style id="hm-brand-fix-v6">
/* Deterministic brand renderer. The logo is rebuilt as inline SVG inside the existing shell node. */
.brand{
  position:relative!important;
  height:184px!important;
  width:100%!important;
  margin:0 0 16px!important;
  padding:0!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  overflow:hidden!important;
  box-sizing:border-box!important;
  border-radius:24px!important;
  background:#fff!important;
  box-shadow:0 12px 30px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.9)!important;
}
.brand > svg{
  display:block!important;
  width:86%!important;
  max-width:245px!important;
  height:auto!important;
  overflow:visible!important;
}
.brand > svg text{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif!important;
  font-size:38px!important;
  font-weight:900!important;
  letter-spacing:-2.2px!important;
  fill:#0b0f14!important;
}
.brand > svg .hm-red{fill:#e51b23!important}
.brand::after{
  content:"";
  position:absolute!important;
  left:50%!important;
  bottom:24px!important;
  width:44px!important;
  height:4px!important;
  transform:translateX(-50%)!important;
  border-radius:999px!important;
  background:#e51b23!important;
}
@media(max-width:700px){
  .brand{height:76px!important;border-radius:18px!important;margin-bottom:12px!important}
  .brand > svg{width:48px!important}
  .brand > svg text{font-size:34px!important;letter-spacing:-2px!important}
  .brand::after{bottom:14px!important;width:24px!important;height:3px!important}
}
</style>
<script>
(function(){
  function renderHypeMarkLogo(){
    var brand=document.querySelector('.brand');
    if(!brand)return;
    brand.innerHTML='<svg viewBox="0 0 260 64" role="img" aria-label="HYPEMARK CRM" xmlns="http://www.w3.org/2000/svg"><text x="130" y="45" text-anchor="middle">HYPE<tspan class="hm-red">MARK</tspan></text></svg>';
    brand.setAttribute('aria-label','HYPEMARK CRM');
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',renderHypeMarkLogo);
  }else{
    renderHypeMarkLogo();
  }
  window.addEventListener('load',renderHypeMarkLogo);
})();
</script>
